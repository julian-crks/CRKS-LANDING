<script>
// === RETOS V13 - Insignias al mérito ===
const CRKS_BADGES=[
 {id:'imparable',emoji:'🔥',name:'Imparable',desc:'3 días seguidos entrenando. La constancia es tu superpoder.',meta:3,tipo:'racha',color:'#FF6B00'},
 {id:'centurion-running',emoji:'🏃',name:'Centurión Running',desc:'100 km en Running. Cada kilómetro te hizo más fuerte.',meta:100,tipo:'run',color:'#A6FF00'},
 {id:'conquistador',emoji:'⛰️',name:'Conquistador',desc:'Primer Trail completado. La montaña ya te conoce.',meta:1,tipo:'trail-first',color:'#8B5CF6'},
 {id:'tiburon',emoji:'💧',name:'Tiburón',desc:'5 km en Natación. En el agua también eres Crack.',meta:5,tipo:'swim',color:'#00BFFF'},
 {id:'fuerza-100',emoji:'🏋️',name:'Fuerza 100',desc:'100 kg registrados en Fuerza. El esfuerzo se mide en kilos y en carácter.',meta:100,tipo:'kilos',color:'#FFD700'},
 {id:'ciclista-50',emoji:'🚴',name:'Rodador 50',desc:'50 km en Ciclismo. La ruta te premia.',meta:50,tipo:'bike',color:'#FF3B30'},
 {id:'constante',emoji:'🍃',name:'Constante',desc:'7 días de racha. No paras, creces.',meta:7,tipo:'racha',color:'#00C853'},
 {id:'madrugador',emoji:'☀️',name:'Madrugador',desc:'5 entrenos publicados. El que madruga, entrena.',meta:5,tipo:'workouts',color:'#FFC107'}
];
function crksBadgeProgress(badge,sums,my,streak,ps){
 if(badge.tipo==='racha')return streak||0;
 if(badge.tipo==='run')return sums.run||0;
 if(badge.tipo==='bike')return sums.bike||0;
 if(badge.tipo==='swim')return sums.swim||0;
 if(badge.tipo==='trail-first')return (ps||[]).some(function(x){return String(x.sport||'').toLowerCase().includes('trail');})?1:0;
 if(badge.tipo==='kilos')return sums.kilos||0;
 if(badge.tipo==='workouts')return (my||[]).length;
 return 0;
}
function crksGetUnlocked(){
 try{return JSON.parse(localStorage.getItem('crks_badges')||'[]');}catch(e){return [];}
}
function crksSaveUnlocked(arr){try{localStorage.setItem('crks_badges',JSON.stringify(arr));}catch(e){}}
async function crksUnlockBadge(badge){
 var unlocked=crksGetUnlocked();if(unlocked.indexOf(badge.id)>=0)return false;unlocked.push(badge.id);crksSaveUnlocked(unlocked);
 try{var _rb=await sb.from('badges').select('id,name').eq('name',badge.name).maybeSingle();if(_rb.data){await sb.from('user_badges').insert({user_id:me.id,badge_id:_rb.data.id});}}catch(e){}
 try{await sb.from('chats').insert({user_id:me.id,body:'[[BADGE:'+badge.id+']] '+badge.emoji+' '+badge.name});}catch(e){}
 return true;
}
function crksShowCelebration(badge){
 var old=document.getElementById('crks-cele');if(old)old.remove();
 var div=document.createElement('div');div.id='crks-cele';div.style='position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
 div.innerHTML='<div style="background:#111;border:2px solid #A6FF00;border-radius:22px;padding:28px 22px;text-align:center;max-width:360px;width:100%;animation:crks-pop .5s ease-out"><div style="font-size:72px;animation:crks-bounce 1s ease-in-out infinite">'+badge.emoji+'</div><div style="font-size:11px;letter-spacing:2px;color:#A6FF00;font-weight:800;margin-top:8px">¡INSIGNIA DESBLOQUEADA!</div><h2 style="margin:8px 0 4px">'+badge.name+'</h2><p style="opacity:.85;font-size:14px;line-height:1.4">'+badge.desc+'</p><p style="font-size:12px;opacity:.7">Ya quedó guardada en tu perfil. Los demás cracks la verán en Logros de la comunidad.</p><button onclick="document.getElementById(\'crks-cele\').remove()" style="background:#A6FF00;color:#000;border:0;border-radius:999px;padding:13px 22px;font-weight:900;width:100%;margin-top:12px">¡Seguir entrenando! ⚡</button><div style="margin-top:10px;font-size:20px">🎉 ✨ 🏅 ✨ 🎉</div></div>';
 document.body.appendChild(div);
 setTimeout(function(){var el=document.getElementById('crks-cele');if(el)el.remove();},6000);
}
window.crksClaimBadge=async function(badgeId){
 var badge=CRKS_BADGES.find(function(b){return b.id===badgeId;});if(!badge)return;
 var newly=await crksUnlockBadge(badge);if(newly){crksShowCelebration(badge);}else{alert('Ya tienes esta insignia en tu perfil.');}render();
};
window.crksTapBadge=function(badgeId){
 var badge=CRKS_BADGES.find(function(b){return b.id===badgeId;});if(!badge)return;
 var unlocked=crksGetUnlocked();var has=unlocked.indexOf(badge.id)>=0;
 alert((has?'🏅 Ya la tienes: ':'🔒 Aún bloqueada: ')+badge.name+'\n\n'+badge.desc);
};
const _origRetosForV13=V.retos;
V.retos=async()=>{
 const ps=await getPosts(200);const my=(ps||[]).filter(function(p){return p.user_id==me?.id;});
 const sums={run:0,bike:0,swim:0,trail:0,kilos:0};my.forEach(function(p){var s=String(p.sport||'').toLowerCase();if(s.includes('running'))sums.run+=+p.km||0;if(s.includes('ciclismo')||s.includes('bici'))sums.bike+=+p.km||0;if(s.includes('nataci'))sums.swim+=+p.km||0;if(s.includes('trail'))sums.trail+=+p.km||0;var mk=/Kilos:\s*([0-9.]+)/.exec(p.body||'');if(mk)sums.kilos+=+mk[1];});
 const streak=prof?.streak||0;const unlocked=crksGetUnlocked();
 // Auto-desbloquear las que ya cumpliste al entrar a Retos (sin spam: solo celebra la primera nueva)
 var newlyUnlocked=[];
 for(var i=0;i<CRKS_BADGES.length;i++){var b=CRKS_BADGES[i];var pr=crksBadgeProgress(b,sums,my,streak,ps);if(pr>=b.meta&&unlocked.indexOf(b.id)<0){var did=await crksUnlockBadge(b);if(did)newlyUnlocked.push(b);}}
 const unlockedNow=crksGetUnlocked();
 // Destacado: la insignia más cercana a desbloquear o la última desbloqueada
 var featured=null;var bestPct=-1;CRKS_BADGES.forEach(function(b){var pr=crksBadgeProgress(b,sums,my,streak,ps);var pct=Math.min(100,Math.round(pr/(b.meta||1)*100));if(pct<100&&pct>bestPct){bestPct=pct;featured={badge:b,pr:pr,pct:pct};}});
 if(!featured&&newlyUnlocked.length)featured={badge:newlyUnlocked[0],pr:newlyUnlocked[0].meta,pct:100};
 var featuredHtml='';
 if(featured){var fb=featured.badge;featuredHtml='<div class="card" style="border:2px solid #A6FF00;background:linear-gradient(180deg,#1a2a00,#111)"><div style="font-size:11px;letter-spacing:2px;color:#A6FF00;font-weight:800">RETO DESTACADO · TU PRÓXIMA INSIGNIA</div><div style="display:flex;gap:12px;align-items:center;margin-top:10px"><div style="font-size:56px" class="crks-badge-near">'+fb.emoji+'</div><div style="flex:1"><h3 style="margin:0">'+fb.name+'</h3><p class="m" style="margin:4px 0">'+fb.desc+'</p><div style="background:#222;height:14px;border-radius:99px;overflow:hidden;margin-top:8px"><div class="crks-progress-fill" style="width:'+featured.pct+'%;height:14px;background:#A6FF00"></div></div><p style="font-size:12px;margin:6px 0 0"><b>'+featured.pr+' / '+fb.meta+'</b> · '+featured.pct+'% · '+(featured.pct>=100?'¡Ya la tienes!':'Te falta '+(fb.meta-featured.pr)+' para desbloquearla')+'</p></div></div>'+(featured.pct>=100?'<button class="l-btn-primary" style="width:100%;margin-top:10px" onclick="crksClaimBadge(\''+fb.id+'\')">Reclamar insignia 🏅</button>':'<button class="g" style="width:100%;margin-top:10px" onclick="go(\'feed\')">Publicar entreno para avanzar →</button>')+'</div>';}
 var grid=CRKS_BADGES.map(function(b){
   var pr=crksBadgeProgress(b,sums,my,streak,ps);var pct=Math.min(100,Math.round(pr/(b.meta||1)*100));var has=unlockedNow.indexOf(b.id)>=0;var near=!has&&pct>=70;
   var cls=has?'crks-badge-unlocked':(near?'crks-badge-near':'');
   return '<div onclick="crksTapBadge(\''+b.id+'\')" style="background:'+(has?'#1a2a00':'#111')+';border:1px solid '+(has?'#A6FF00':'#333')+';border-radius:16px;padding:12px 8px;text-align:center;cursor:pointer;opacity:'+(has?'1':'0.95')+'"><div style="font-size:38px;filter:'+(has?'none':'grayscale(1) brightness(.7)')+'" class="'+cls+'">'+b.emoji+'</div><div style="font-weight:800;font-size:12px;margin-top:6px;line-height:1.2">'+b.name+'</div><div style="font-size:10px;opacity:.75;margin-top:3px">'+(has?'✅ Desbloqueada':(pct>=100?'🎉 Lista para reclamar':'🔒 '+pct+'% · '+pr+' / '+b.meta))+'</div><div style="background:#222;height:6px;border-radius:99px;overflow:hidden;margin-top:6px"><div style="width:'+pct+'%;height:6px;background:'+(has?'#A6FF00':'#555')+'"></div></div>'+(pct>=100&&!has?'<button onclick="event.stopPropagation();crksClaimBadge(\''+b.id+'\')" style="background:#A6FF00;color:#000;border:0;border-radius:999px;padding:6px 10px;font-weight:800;font-size:11px;margin-top:8px;width:100%">Reclamar 🏅</button>':'')+'</div>';
 }).join('');
 var list=CRKS_BADGES.map(function(b){
   var pr=crksBadgeProgress(b,sums,my,streak,ps);var pct=Math.min(100,Math.round(pr/(b.meta||1)*100));var has=unlockedNow.indexOf(b.id)>=0;
   return '<div class="card" style="display:flex;gap:12px;align-items:center;border:1px solid '+(has?'#A6FF00':'#222')+'"><div style="font-size:44px;filter:'+(has?'none':'grayscale(1) brightness(.7)')+'" class="'+(has?'crks-badge-unlocked':'')+'">'+b.emoji+'</div><div style="flex:1"><b>'+b.name+'</b><p class="m" style="margin:3px 0">'+b.desc+'</p><div style="background:#222;height:12px;border-radius:99px;overflow:hidden;position:relative"><div class="crks-progress-fill" style="width:'+pct+'%;height:12px;background:#A6FF00"></div><span style="position:absolute;left:calc('+pct+'% - 10px);top:-2px;font-size:14px">⚡</span></div><p style="font-size:12px;margin:6px 0 0">Tu progreso: <b>'+pr+' / '+b.meta+'</b> · '+pct+'% '+(has?'· ✅ Insignia en tu perfil':'')+'</p></div>'+(pct>=100&&!has?'<button onclick="crksClaimBadge(\''+b.id+'\')" style="background:#A6FF00;color:#000;border:0;border-radius:999px;padding:10px 14px;font-weight:900;white-space:nowrap">Reclamar 🏅</button>':'')+'</div>';
 }).join('');
 var html='<div><h2 style="text-align:center;margin:6px 0 2px">🏆 RETOS CRKS</h2><p class="m" style="text-align:center">Supérate. Gana tu insignia al mérito. Cada entreno publicado te acerca.</p><div style="text-align:center;margin:10px 0"><span style="display:inline-block;background:#1a1a1a;border:1px solid #333;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700">🏅 '+unlockedNow.length+' de '+CRKS_BADGES.length+' insignias desbloqueadas · 🔥 Racha '+streak+' días</span></div>'+featuredHtml+'<h3 style="margin:14px 0 10px">Tus insignias al mérito</h3><p class="m">Toca una insignia para ver qué necesitas. Las desbloqueadas se mueven y brillan.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+grid+'</div><h3 style="margin:18px 0 10px">Todos los retos</h3>'+list+'<p class="m" style="text-align:center;margin-top:10px">Las insignias se calculan con tus entrenos publicados y tu racha. Al desbloquearla, queda guardada en tu perfil y se anuncia en Logros de la comunidad.</p></div>';
 // Celebrar solo la primera nueva para no spamear
 if(newlyUnlocked.length){setTimeout(function(){crksShowCelebration(newlyUnlocked[0]);},400);}
 return html;
};
// === PERFIL: mostrar insignias desbloqueadas (local + Supabase) ===
const _origPerfilForV13=V.perfil;
V.perfil=async()=>{
 var html=await _origPerfilForV13();
 var unlocked=crksGetUnlocked();
 var myBadges=CRKS_BADGES.filter(function(b){return unlocked.indexOf(b.id)>=0;});
 var grid=myBadges.length?myBadges.map(function(b){return '<div style="background:#1a2a00;border:1px solid #A6FF00;border-radius:16px;padding:14px 8px;text-align:center"><div style="font-size:44px" class="crks-badge-unlocked">'+b.emoji+'</div><div style="font-weight:800;font-size:13px;margin-top:6px">'+b.name+'</div><div style="font-size:11px;opacity:.8;margin-top:3px">'+b.desc+'</div><div style="font-size:11px;color:#A6FF00;font-weight:800;margin-top:6px">✅ Desbloqueada</div></div>';}).join(''):'<p class="m">Aún no tienes insignias. Completa un reto en Retos y tu primera insignia quedará aquí.</p>';
 var locked=CRKS_BADGES.filter(function(b){return unlocked.indexOf(b.id)<0;});
 var lockedHtml=locked.length?'<h3 style="margin-top:14px">Insignias por desbloquear</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+locked.map(function(b){return '<div style="background:#111;border:1px solid #333;border-radius:16px;padding:12px 8px;text-align:center;opacity:.8"><div style="font-size:36px;filter:grayscale(1) brightness(.7)">'+b.emoji+'</div><div style="font-weight:700;font-size:12px;margin-top:6px">'+b.name+'</div><div style="font-size:11px;opacity:.75">🔒 '+b.desc+'</div></div>';}).join('')+'</div>':'';
 var inject='<div class="card"><h3>🏅 Mis insignias al mérito</h3><p class="m">Cada insignia que desbloqueas en Retos queda alojada aquí, en tu perfil.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+grid+'</div>'+lockedHtml+'</div>';
 if(html.indexOf('Mi ranking personal')>=0){return html.replace('Mi ranking personal', inject+'<h3>Mi ranking personal</h3>');}
 return html+inject;
};
// === INICIO: Logros de la comunidad (sin tocar el resto de Inicio) ===
const _origHomeForV13=V.home;
V.home=async()=>{
 var html=await _origHomeForV13();
 try{
   var logros=[];
   try{var _rl=await sb.from('chats').select('*,profiles(name)').order('created_at',{ascending:false}).limit(50);if(!_rl.error&&_rl.data){_rl.data.forEach(function(c){var b=c.body||'';if(!b.startsWith('[[BADGE:'))return;var e2=b.indexOf(']]');if(e2<0)return;var bid=b.slice(8,e2);var badge=CRKS_BADGES.find(function(x){return x.id===bid;});if(!badge)return;logros.push({name:c.profiles?.name||'Crack',badge:badge,when:new Date(c.created_at).toLocaleDateString('es-CO',{day:'numeric',month:'short'})});});}}catch(e){}
   // Filtrar logros locales si no hay en chats
   if(!logros.length){var _ul=crksGetUnlocked();if(_ul.length){_ul.slice(0,3).forEach(function(bid){var badge=CRKS_BADGES.find(function(x){return x.id===bid;});if(badge)logros.push({name:(prof?.name||'Tú'),badge:badge,when:'Hoy'});});}}
   if(logros.length){
     var logrosHtml='<div class="card" style="border:1px solid #A6FF00"><h3>🏅 Logros de la comunidad</h3><p class="m">Insignias que los cracks acaban de desbloquear.</p>'+logros.slice(0,5).map(function(l){return '<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #222"><div style="font-size:32px" class="crks-badge-unlocked">'+l.badge.emoji+'</div><div style="flex:1"><b>'+l.name+'</b> desbloqueó <b>'+l.badge.name+'</b><div class="m" style="font-size:11px">'+l.badge.desc+' · '+l.when+'</div></div><span style="font-size:11px;background:#A6FF00;color:#000;border-radius:999px;padding:4px 8px;font-weight:800;white-space:nowrap">¡Logro!</span></div>';}).join('')+'<button class="g" style="width:100%;margin-top:8px" onclick="go(\'retos\')">Ver mis retos e insignias →</button></div>';
     // Insertar antes de "Último entreno" o al final si no existe
     if(html.indexOf('Último entreno')>=0){return html.replace('Último entreno', logrosHtml+'<h2>Último entreno');}
     return html+logrosHtml;
   }
 }catch(e){}
 return html;
};
</script>

<script>
// === ENCUENTROS V14 - Foto opcional, sin tocar lo que ya funciona ===
// Voy, comentarios, compartir, orden y borrado 1h después quedan EXACTAMENTE igual.
// Solo se suma: campo opcional de foto en el formulario + foto visible en cada encuentro.
function crksMeetPhotoPreview(input){
  var prev=document.getElementById('meet-photo-preview');var wrap=document.getElementById('meet-photo-wrap');if(!prev||!wrap)return;
  var f=input&&input.files&&input.files[0];if(!f){wrap.style.display='none';prev.src='';return;}
  var r=new FileReader();r.onload=function(e){prev.src=e.target.result;wrap.style.display='block';};r.readAsDataURL(f);
}
function crksMeetPhotoRemove(){var inp=document.getElementById('meet-photo');if(inp)inp.value='';var wrap=document.getElementById('meet-photo-wrap');if(wrap)wrap.style.display='none';var prev=document.getElementById('meet-photo-preview');if(prev)prev.src='';}
function crksGetMeetPhotosLocal(){try{return JSON.parse(localStorage.getItem('crks_meet_photos')||'{}');}catch(e){return {};}}
function crksSaveMeetPhotoLocal(id,url){try{var m=crksGetMeetPhotosLocal();m[String(id)]=url;localStorage.setItem('crks_meet_photos',JSON.stringify(m));}catch(e){}}
// mk() nuevo: igual que antes, pero con foto opcional comprimida como en Entrenos (800px, 55%)
async function mk(){
  if(!me)return alert('Inicia sesión para proponer');
  var title=(document.getElementById('mt')||{}).value||'';title=title.trim();if(!title)return alert('Pon un título');
  var place=(document.getElementById('mp')||{}).value||'';var d=(document.getElementById('md')||{}).value||'';
  var btn=document.querySelector('button[onclick="mk()"]');var oldTxt=btn?btn.textContent:'';if(btn){btn.disabled=true;btn.textContent='Subiendo…';}
  try{
    var photoUrl=null;var fileEl=document.getElementById('meet-photo');var file=fileEl&&fileEl.files&&fileEl.files[0]?fileEl.files[0]:null;
    if(file){try{photoUrl=await up(file);}catch(e){photoUrl=null;alert('No se pudo subir la foto, se crea el encuentro sin foto. Error: '+(e.message||e));}}
    var payload={user_id:me.id,title:title,place:place,starts_at:d?new Date(d).toISOString():null};
    var r=await sb.from('meetups').insert(payload).select('id').single();
    if(r.error)throw r.error;
    var newId=r.data&&r.data.id?r.data.id:null;
    if(photoUrl&&newId){
      crksSaveMeetPhotoLocal(newId,photoUrl);
      // Intentar guardar en columna si existe (si no existe, no falla: ya está en local + en chats)
      try{await sb.from('meetups').update({image_url:photoUrl}).eq('id',newId);}catch(e){}
      try{await sb.from('meetups').update({photo_url:photoUrl}).eq('id',newId);}catch(e){}
      try{await sb.from('chats').insert({user_id:me.id,body:'[[MEET:PHOTO:'+newId+']] '+photoUrl});}catch(e){}
    }
    alert('Encuentro creado. Todos lo ven!');
    render();
  }catch(e){alert('No se pudo crear. Pega el SQL de meetups. Error: '+(e.message||e));if(btn){btn.disabled=false;btn.textContent=oldTxt;}}
}
V.meet=async()=>{
 cleanupExpiredMeetups();
 let ms=await getMeetups();
 ms=(ms||[]).slice().sort(function(a,b){var ta=a.starts_at?new Date(a.starts_at).getTime():Infinity;var tb=b.starts_at?new Date(b.starts_at).getTime():Infinity;return ta-tb;});
 var now1h=Date.now()-3600000;ms=ms.filter(function(m){if(!m.starts_at)return true;return new Date(m.starts_at).getTime()>now1h;});
 let sbCmts=[];
 try{let _rc=await sb.from('meetup_comments').select('*,profiles(name)').order('created_at',{ascending:false}).limit(200);if(!_rc.error&&_rc.data)sbCmts=_rc.data.map(function(c){return {meet:c.meetup_id||c.meet_id||c.meet, name:c.profiles?.name||'Crack', body:c.body||c.content||c.text||c.comment||'', ts:new Date(c.created_at).getTime()};});}catch(e){}
 // Fotos desde chats con marca [[MEET:PHOTO:id]] + comentarios [[MEET:id]] (Chats los filtra, Encuentros los lee)
 var meetPhotos={};try{var _mp=crksGetMeetPhotosLocal();Object.keys(_mp).forEach(function(k){meetPhotos[String(k)]=_mp[k];});}catch(e){}
 try{let _rc3=await sb.from('chats').select('*,profiles(name)').order('created_at',{ascending:false}).limit(300);if(!_rc3.error&&_rc3.data){_rc3.data.forEach(function(c){var b=c.body||'';if(!b.startsWith('[[MEET:'))return;var end=b.indexOf(']]');if(end<0)return;var mid=b.slice(7,end);var txt=b.slice(end+2).trim();if(mid.startsWith('PHOTO:')){var pid=mid.slice(6);if(txt&&!meetPhotos[String(pid)])meetPhotos[String(pid)]=txt;return;}sbCmts.push({meet:mid,name:c.profiles?.name||'Crack',body:txt,ts:new Date(c.created_at).getTime()});});}}catch(e){}
 let localCmts=[];try{localCmts=JSON.parse(localStorage.getItem('crks_meet_comments')||'[]');}catch(e){}
 let voyExtra={};try{let _rv=await sb.from('chats').select('body').order('created_at',{ascending:false}).limit(500);if(!_rv.error&&_rv.data){_rv.data.forEach(function(c){var b=c.body||'';if(!b.startsWith('[[VOY:'))return;var e2=b.indexOf(']]');if(e2<0)return;var mid=b.slice(6,e2);voyExtra[mid]=(voyExtra[mid]||0)+1;});}}catch(e){}
 const cards=ms.map(function(m){

async function crksFileToDataUrl(f){

  try{

    var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);
    var blob=await new Promise(function(res){c.toBlob(res,'image/jpeg',0.55);});
    return await new Promise(function(res,rej){var rd=new FileReader();rd.onload=function(){res(rd.result);};rd.onerror=rej;rd.readAsDataURL(blob);});

}

  }

}

    try{localStorage.setItem('crks_v19_cleaned','1');}catch(e){}
  }catch(e){}
}

  var postEvents=[];try{var _gp2=await getPosts(200);postEvents=(_gp2||[]).filter(function(p){return (p.body||'').includes('[EVENTO_CRKS]');});}catch(e){}
  var localEvents=[];try{localEvents=JSON.parse(localStorage.getItem('crks_eventos_admin')||'[]');}catch(e){}
  var seen={};var allEvents=[];
  function parsePostBodyV19(body){
    var lines=String(body||'').split('\n');var title=lines[0].replace('[EVENTO_CRKS]','').trim();var desc='',place='',when='',price='',pricePre='',priceFull='',preEnd='';
    lines.forEach(function(l){if(l.startsWith('Lugar:'))place=l.replace('Lugar:','').trim();else if(l.startsWith('Fecha:'))when=l.replace('Fecha:','').trim();else if(l.startsWith('Precio:'))price=l.replace('Precio:','').trim();else if(l.startsWith('Preventa:'))pricePre=l.replace('Preventa:','').trim();else if(l.startsWith('Precio normal:'))priceFull=l.replace('Precio normal:','').trim();else if(l.startsWith('Fin preventa:'))preEnd=l.replace('Fin preventa:','').trim();else if(!l.includes('[EVENTO_CRKS]')&&!l.startsWith('Lugar:')&&!l.startsWith('Fecha:')&&!l.startsWith('Precio:')&&!l.startsWith('Preventa:')&&!l.startsWith('Precio normal:')&&!l.startsWith('Fin preventa:'))desc+=l+' ';});
    return {title:title,desc:desc.trim(),place:place,when:when,price:price,price_pre:pricePre,price_full:priceFull,pre_end:preEnd};
  }
  sbEvents.forEach(function(r){var key=String(r.title||'').toLowerCase().trim();if(seen[key])return;seen[key]=1;allEvents.push({source:'supabase',sbId:r.id,postId:null,title:r.title||'',desc:r.description||r.desc||'',place:r.place||'',when:r.starts_at||r.when||'',price:r.price||'',price_pre:r.price_pre||r.price||'',price_full:r.price_full||r.price||'',pre_end:r.pre_end||'',img:r.image_url||r.img||'',includes:r.includes||'',created_at:r.created_at||''});});
  postEvents.forEach(function(p){var parsed=parsePostBodyV19(p.body||'');var key=parsed.title.toLowerCase().trim();if(seen[key]){var ex=allEvents.find(function(x){return x.title.toLowerCase().trim()===key;});if(ex){if(!ex.postId)ex.postId=p.id;if(!ex.img&&p.image_url)ex.img=p.image_url;if(!ex.price_pre&&parsed.price_pre)ex.price_pre=parsed.price_pre;if(!ex.price_full&&parsed.price_full)ex.price_full=parsed.price_full;if(!ex.pre_end&&parsed.pre_end)ex.pre_end=parsed.pre_end;}return;}seen[key]=1;allEvents.push({source:'post',sbId:null,postId:p.id,title:parsed.title,desc:parsed.desc,place:parsed.place,when:parsed.when,price:parsed.price,price_pre:parsed.price_pre,price_full:parsed.price_full,pre_end:parsed.pre_end,img:p.image_url||'',created_at:p.created_at||''});});
  localEvents.forEach(function(r,i){var key=String(r.title||'').toLowerCase().trim();if(seen[key]){var ex2=allEvents.find(function(x){return x.title.toLowerCase().trim()===key;});if(ex2&&!ex2.img&&r.img)ex2.img=r.img;return;}seen[key]=1;allEvents.push({source:'local',localIdx:i,postId:null,title:r.title||'',desc:r.desc||r.description||'',place:r.place||'',when:r.when||r.starts_at||'',price:r.price||'',price_pre:r.price_pre||r.price||'',price_full:r.price_full||r.price||'',pre_end:r.pre_end||'',img:r.img||r.image_url||'',created_at:r.created_at||''});});
  // Sacar Mandalay de la lista normal (se maneja aparte)

  // ORDENAR POR FECHA: más próximo primero, sin fecha al final
  allEvents.sort(function(a,b){
    var da=crksEventoDateObj(a), db=crksEventoDateObj(b);
    if(da&&db)return da-db;
    if(da&&!db)return -1;
    if(!da&&db)return 1;
    return 0;
  });
  var mandalayEv={title:'Reto Mandalay',desc:'4 Horas de puro esfuerzo y luz de luna',place:'Mandalay',price:'$140.000',price_pre:'$140.000',price_full:'$160.000',pre_end:'2026-01-15',when:'2026-01-15T18:00:00',img:''};
  if(mandalayFromList){mandalayEv=mandalayFromList;if(!mandalayEv.price_pre)mandalayEv.price_pre='$140.000';if(!mandalayEv.price_full)mandalayEv.price_full='$160.000';if(!mandalayEv.pre_end)mandalayEv.pre_end='2026-01-15';}
  var mandalayHtml='';

    mandalayHtml='<div class=card style=border:2px solid #A6FF00;background:linear-gradient(180deg,#1a2a00,#111)><div style=background:#A6FF00;color:#000;padding:6px 10px;border-radius:99px;display:inline-block;font-weight:800;font-size:11px>EVENTO DESTACADO · OFICIAL CRKS</div><h2 style=margin:10px 0 4px>Reto Mandalay</h2><p><b>4 Horas de puro esfuerzo y luz de luna</b></p>'+crksEventoFechaBadge(mandalayEv)+crksEventoPreventaBadge(mandalayEv)+crksEventoButtonsV18('Reto Mandalay',mandalayEv)+'<button class=g style="width:100%;margin-top:8px" onclick="crksShareEvento(\'Reto Mandalay\',\'4 Horas de puro esfuerzo y luz de luna\',\'Mandalay\',\'$140.000 hasta 15 de Enero, luego $160.000\',\'\',\'\')">📤 Compartir evento</button>'+(isAdm?'<button class=g style="width:100%;margin-top:8px;color:#ff6b6b" onclick="crksDeleteMandalay()">Borrar Reto Mandalay (Admin) 🗑️</button>':'')+'</div>';
  } else if(isAdm){
    mandalayHtml='<div class=card style=border:1px dashed #ff6b6b><b>Historial borrado ✅</b><p class=m style=margin:6px 0>Todos los eventos publicados hasta ahora fueron borrados. Eventos empieza limpio. Puedes restaurar Reto Mandalay si quieres.</p><button class=g onclick="crksRestoreMandalay()">Restaurar Reto Mandalay</button></div>';
  }
  var otros=allEvents.map(function(r){
    var whenTxt='';try{if(r.when)whenTxt=new Date(r.when).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'});}catch(e){whenTxt=r.when||'';}
    var delBtn=isAdm?'<button class=g style="margin-top:8px;color:#ff6b6b;width:100%" onclick="crksDeleteEventoByTitleV17(\''+esc(r.title).replace(/\'/g,"\\'")+'\',\''+(r.sbId||'')+'\',\''+(r.postId||'')+'\')">Borrar evento (Admin) 🗑️</button>':'';
    var imgHtml=r.img?'<img loading="lazy" decoding="async" src="'+esc(r.img)+'" style="width:100%;max-height:280px;object-fit:cover;border-radius:12px;margin:8px 0" onclick="window.open(\''+esc(r.img)+'\',\'_blank\')" title="Toca para ver foto completa">':'';
    var shareBtn='<button class=g style="width:100%;margin-top:8px" onclick="crksShareEvento(\''+esc(r.title).replace(/\'/g,"\\'")+'\',\''+esc(r.desc||'').replace(/\'/g,"\\'")+'\',\''+esc(r.place||'').replace(/\'/g,"\\'")+'\',\''+esc(r.price||'').replace(/\'/g,"\\'")+'\',\''+esc(whenTxt).replace(/\'/g,"\\'")+'\',\''+esc(r.img||'').replace(/\'/g,"\\'")+'\')">📤 Compartir evento con foto</button>';
    return '<div class=card style=border:2px solid #A6FF00><div style=background:#A6FF00;color:#000;padding:6px 10px;border-radius:99px;display:inline-block;font-weight:800;font-size:11px>EVENTO OFICIAL</div><h2 style=margin:10px 0 4px>'+esc(r.title)+'</h2>'+crksEventoFechaBadge(r)+imgHtml+'<p>'+esc(r.desc||'')+'</p>'+crksEventoPreventaBadge(r)+crksEventoButtonsV18(r.title,r)+shareBtn+delBtn+'</div>';
  }).join('');
  var adminBar=isAdm?'<div class=card style=border:1px solid #A6FF00><b>👑 Eres Admin · Eventos limpios</b><p class=m style=margin:6px 0>Historial viejo borrado. Los nuevos eventos aparecen ordenados por fecha: el más próximo primero. Fecha y Preventa quedan resaltadas en cada tarjeta.</p><button class=g style="color:#ff6b6b;width:100%" onclick="crksClearEventosPrueba()">Borrar TODOS los eventos publicados 🗑️</button><small class=m>Incluye Mandalay. Puedes restaurarlo desde aquí.</small>'+(mandalayDeleted?'<button class=g style="width:100%;margin-top:8px" onclick="crksRestoreMandalay()">Restaurar Reto Mandalay</button>':'')+'</div>':'';

  return '<h2>Eventos</h2><p class=m>Eventos oficiales CRKS · Ordenados por fecha, el más próximo primero.<br>Separa tu cupo con el 50% o asegúralo con pago completo.</p>'+adminBar+mandalayHtml+'<h3 style=margin:16px 0 10px>Próximos eventos oficiales · En orden de fecha</h3>'+(otros||empty);
};

<script>

function crksMerchDeletedList(){try{return JSON.parse(localStorage.getItem('crks_merch_deleted')||'[]');}catch(e){return [];}}
function crksMerchIsDeleted(name){return crksMerchDeletedList().includes(String(name||''));}
function crksGetAllMerchSyncLocal(){
  var out=[];
  try{var base=(typeof MERCH!=='undefined'?MERCH:[]).map(function(m){return {name:m.name,desc:m.desc,img:m.img,price:m.price||'',from:'oficial',created_at:'2025-01-01'};});out=out.concat(base);}catch(e){}
  try{out=out.concat(crksGetAdminProducts().map(function(p){return {name:p.name,desc:p.desc,img:p.img,price:p.price||'',from:'admin-local',created_at:p.created_at||''};}));}catch(e){}
  return out;
}
async function crksGetAllMerch(){
  var seen={};var all=[];
  // 1) Local + oficiales (si no están borrados)
  crksGetAllMerchSyncLocal().forEach(function(m){if(crksMerchIsDeleted(m.name))return;var k=String(m.name).toLowerCase().trim();if(seen[k])return;seen[k]=1;all.push(m);});
  // 2) Supabase products
  try{var _rp=await sb.from('products').select('*').order('created_at',{ascending:false}).limit(50);if(!_rp.error&&_rp.data){_rp.data.forEach(function(r){if(!r||!r.name)return;if(crksMerchIsDeleted(r.name))return;var k=String(r.name).toLowerCase().trim();if(seen[k]){var ex=all.find(function(x){return x.name.toLowerCase().trim()===k;});if(ex){if(!ex.sbId)ex.sbId=r.id;if(!ex.img&&r.image_url)ex.img=r.image_url;if(!ex.created_at&&r.created_at)ex.created_at=r.created_at;}return;}seen[k]=1;all.push({name:r.name,desc:r.description||r.desc||'',img:r.image_url||r.img||'',price:r.price||'',from:'supabase',sbId:r.id,created_at:r.created_at||''});});}}catch(e){}
  // 3) Posts [PRODUCTO_CRKS] - respaldo que SÍ ven todos (como Eventos)
  try{
    var _gp=await getPosts(200);var evs=(_gp||[]).filter(function(p){return (p.body||'').includes('[PRODUCTO_CRKS]');});
    evs.forEach(function(p){
      var lines=String(p.body||'').split('\n');var title=lines[0].replace('[PRODUCTO_CRKS]','').trim();if(!title||crksMerchIsDeleted(title))return;
      var desc='',price='';lines.forEach(function(l){if(l.startsWith('Descripción:'))desc=l.replace('Descripción:','').trim();else if(l.startsWith('Precio:'))price=l.replace('Precio:','').trim();else if(!l.includes('[PRODUCTO_CRKS]')&&!l.startsWith('Descripción:')&&!l.startsWith('Precio:'))desc+=l+' ';});
      var k=title.toLowerCase().trim();if(seen[k]){var ex2=all.find(function(x){return x.name.toLowerCase().trim()===k;});if(ex2){if(!ex2.postId)ex2.postId=p.id;if(!ex2.img&&p.image_url)ex2.img=p.image_url;}return;}seen[k]=1;all.push({name:title,desc:desc.trim(),img:p.image_url||'',price:price,from:'post',postId:p.id,created_at:p.created_at||''});
    });
  }catch(e){}
  // Orden: más recientes primero (por created_at, oficiales al final si no tienen fecha)
  all.sort(function(a,b){
    var da=a.created_at?new Date(a.created_at).getTime():0, db=b.created_at?new Date(b.created_at).getTime():0;
    return db-da;
  });
  return all;
}
// Guardar prenda V20: products + posts [PRODUCTO_CRKS] + local, con foto garantizada
crksAddProductAdmin=async function(){
  if(typeof crksIsAdmin==='function'&&!crksIsAdmin())return alert('Solo la cuenta '+ (typeof CRKS_ADMIN_EMAIL!=='undefined'?CRKS_ADMIN_EMAIL:'runcrackscolombia@gmail.com') +' puede agregar productos.');
  var name=(document.getElementById('ap-name')||{}).value||'';name=name.trim();if(!name)return alert('Pon el nombre de la prenda, Ej: Ref. NUEVA');
  var desc=(document.getElementById('ap-desc')||{}).value||'';var price=(document.getElementById('ap-price')||{}).value||'';
  var fileEl=document.getElementById('ap-photo');var file=fileEl&&fileEl.files&&fileEl.files[0]?fileEl.files[0]:null;
  var photo='';
  if(file){
    try{photo=await up(file);}catch(e){photo='';}
    if(!photo){try{photo=await crksFileToDataUrl(file);}catch(e){photo='';}}
  }
  if(file&&!photo)return alert('No se pudo anexar la foto. Intenta con otra foto más liviana.');
  // Si estaba borrada antes, quitarla de borrados para que vuelva a aparecer
  try{var del=crksMerchDeletedList().filter(function(n){return n!==name;});localStorage.setItem('crks_merch_deleted',JSON.stringify(del));}catch(e){}
  var p={name:name,desc:desc,price:price,img:photo,created_at:new Date().toISOString()};
  var arr=crksGetAdminProducts();arr.push(p);try{localStorage.setItem('crks_products_admin',JSON.stringify(arr));}catch(e){}
  var errP=null, errPost=null;
  try{var r1=await sb.from('products').insert({name:name,description:desc,price:price,image_url:photo||null});if(r1.error){var r1b=await sb.from('products').insert({name:name,description:desc,price:price});if(r1b.error)errP=r1b.error;}}catch(e){errP=e;}
  try{
    var body='[PRODUCTO_CRKS] '+name+'\nDescripción: '+desc+'\nPrecio: '+price;
    var r2=await sb.from('posts').insert({user_id:me.id,sport:'Merch',body:body,km:0,minutes:0,image_url:photo||null});
    if(r2.error){var r2b=await sb.from('posts').insert({user_id:me.id,sport:'Merch',body:body,km:0,minutes:0});if(r2b.error)errPost=r2b.error;}
  }catch(e){errPost=e;}
  if(errP&&errPost)alert('Se guardó en tu celular, pero Supabase bloqueó ambos.\nProducts: '+(errP.message||errP)+'\nPosts: '+(errPost.message||errPost)+'\nPega el SQL de abajo.');
  else alert('Prenda publicada ✅ Con foto '+(photo?'sí anexada':'sin foto')+'. Ya aparece en Merch para todos.');
  render();
};
async function crksDeleteMerchOne(name, sbId, postId){
  if(typeof crksIsAdmin==='function'&&!crksIsAdmin())return alert('Solo Admin puede borrar.');
  if(!confirm('¿Borrar "'+name+'" de Merch? Desaparece para todos.'))return;
  if(sbId){try{await sb.from('products').delete().eq('id',sbId);}catch(e){}}
  // Borrar cualquier product con ese nombre
  try{var _all=await sb.from('products').select('id,name');if(_all.data){for(var i=0;i<_all.data.length;i++){if(String(_all.data[i].name)===String(name))await sb.from('products').delete().eq('id',_all.data[i].id);}}}catch(e){}
  if(postId){try{await sb.from('likes').delete().eq('post_id',postId);}catch(e){}try{await sb.from('comments').delete().eq('post_id',postId);}catch(e){}try{await sb.from('posts').delete().eq('id',postId);}catch(e){}}
  try{
    var _gp=await getPosts(200);var evs=(_gp||[]).filter(function(p){return (p.body||'').includes('[PRODUCTO_CRKS] '+name);});
    for(var j=0;j<evs.length;j++){try{await sb.from('likes').delete().eq('post_id',evs[j].id);}catch(e){}try{await sb.from('comments').delete().eq('post_id',evs[j].id);}catch(e){}await sb.from('posts').delete().eq('id',evs[j].id);}
  }catch(e){}
  try{var arr=crksGetAdminProducts().filter(function(x){return String(x.name)!==String(name);});localStorage.setItem('crks_products_admin',JSON.stringify(arr));}catch(e){}
  // Marcar como borrada para que ni las 3 oficiales vuelvan a aparecer
  try{var del=crksMerchDeletedList();if(!del.includes(name)){del.push(name);localStorage.setItem('crks_merch_deleted',JSON.stringify(del));}}catch(e){}
  render();
}
async function crksClearMerchAll(){
  if(typeof crksIsAdmin==='function'&&!crksIsAdmin())return alert('Solo Admin puede borrar.');
  if(!confirm('¿Borrar TODAS las prendas de Merch, INCLUIDAS Aurora, Cromo y Lava? Merch queda vacío para todos. Puedes restaurar las 3 oficiales después.'))return;
  try{var _e=await sb.from('products').select('id');if(!_e.error&&_e.data){for(var i=0;i<_e.data.length;i++){await sb.from('products').delete().eq('id',_e.data[i].id);}}}catch(e){}
  try{var _gp=await getPosts(200);var evs=(_gp||[]).filter(function(p){return (p.body||'').includes('[PRODUCTO_CRKS]');});for(var j=0;j<evs.length;j++){try{await sb.from('likes').delete().eq('post_id',evs[j].id);}catch(e){}try{await sb.from('comments').delete().eq('post_id',evs[j].id);}catch(e){}await sb.from('posts').delete().eq('id',evs[j].id);}}catch(e){}
  try{localStorage.removeItem('crks_products_admin');}catch(e){}
  // Marcar las 3 oficiales + todas las que había como borradas
  try{
    var allNames=[];try{(typeof MERCH!=='undefined'?MERCH:[]).forEach(function(m){allNames.push(m.name);});}catch(e){}
    try{crksGetAdminProducts().forEach(function(m){allNames.push(m.name);});}catch(e){}

<script>
// === RECUPERAR CONTRASEÑA V22 - Olvidé mi contraseña + Recuperar Admin ===
var crksRecoveryEmail='';
async function crksForgotPassword(){
  var emailEl=document.getElementById('e');
  var email=emailEl?emailEl.value.trim():'';
  if(!email){
    email=prompt('¿A qué correo te enviamos el código para recuperar tu cuenta? Ej: runcrackscolombia@gmail.com');
    if(!email)return;email=email.trim();
  }
  if(!email.includes('@'))return alert('Pon un correo válido, Ej: runcrackscolombia@gmail.com');
  crksRecoveryEmail=email;
  var msgEl=document.getElementById('msg');if(msgEl)msgEl.textContent='Enviando código de verificación...';
  try{
    var r=await sb.auth.signInWithOtp({email:email, options:{shouldCreateUser:false}});
    if(r.error)throw r.error;
    if(msgEl)msgEl.textContent='Código enviado a '+email+'. Revisa tu correo y Spam.';
    crksShowCodeForm();
  }catch(e){
    if(msgEl)msgEl.textContent='No se pudo enviar: '+e.message;
    alert('No se pudo enviar el código. Error: '+e.message+' Si el correo no está registrado, crea la cuenta con Regístrate primero.');
  }
}
function crksShowCodeForm(){
  var toggle=document.getElementById('authToggle');
  var old=document.getElementById('crks-code-box');
  if(old)old.remove();
  var div=document.createElement('div');
  div.id='crks-code-box';
  div.style='background:#111;border:2px solid #A6FF00;border-radius:16px;padding:14px;margin-top:10px;text-align:left';
  div.innerHTML='<div style="font-size:12px;font-weight:900;letter-spacing:1px;color:#A6FF00">CÓDIGO DE VERIFICACIÓN</div><p style="font-size:12px;opacity:.85;margin:6px 0">Te enviamos un código de 6 dígitos a <b>'+crksRecoveryEmail+'</b>. Escríbelo aquí, pon tu contraseña nueva y listo. No tienes que abrir ningún link.</p><label class="auth-label">Código de 6 dígitos:</label><div class="auth-field"><input id="crks-code" inputmode="numeric" placeholder="Ej: 123456"></div><label class="auth-label">Contraseña nueva:</label><div class="auth-field"><input id="crks-newpass" type="password" placeholder="Mínimo 6 caracteres"></div><button class="auth-btn" onclick="crksVerifyCodeAndSetPassword()">GUARDAR CONTRASEÑA NUEVA</button><div style="font-size:11px;opacity:.7;margin-top:6px">¿No te llegó? Revisa Spam / Promociones y vuelve a darle a Recuperar cuenta para pedir otro código.</div>';
  if(toggle)toggle.parentNode.insertBefore(div, toggle.nextSibling);
  else document.getElementById('app').appendChild(div);
  setTimeout(function(){var i=document.getElementById('crks-code');if(i)i.focus();},100);
}
async function crksVerifyCodeAndSetPassword(){
  var code=(document.getElementById('crks-code')||{}).value||'';
  var np=(document.getElementById('crks-newpass')||{}).value||'';
  code=code.trim();np=np.trim();
  if(code.length<6)return alert('Pon el código de 6 dígitos que te llegó al correo.');
  if(!np||np.length<6)return alert('La contraseña nueva debe tener mínimo 6 caracteres.');
  try{
    var v=await sb.auth.verifyOtp({email:crksRecoveryEmail, token:code, type:'email'});
    if(v.error)throw v.error;
    var u=await sb.auth.updateUser({password:np});
    if(u.error)throw u.error;
    alert('Contraseña cambiada. Ya puedes entrar con tu contraseña nueva.');
    location.reload();
  }catch(e){alert('No se pudo cambiar: '+e.message+' Revisa que el código sea el último que te llegó y que no haya vencido. Pide otro código si es necesario.');}
}
async function crksSetNewPassword(){
  return crksVerifyCodeAndSetPassword();
}
async function crksHandleRecoveryCode(){
  try{
    var qs=new URLSearchParams(window.location.search);
    var code=qs.get('code');
    if(code){
      var r=await sb.auth.exchangeCodeForSession(code);
      if(!r.error){try{window.history.replaceState({},'',window.location.pathname);}catch(e){} return true;}
    }
  }catch(e){}
  return false;
}
function crksIsRecovery(){
  try{
    var h=window.location.hash||'';var s=window.location.search||'';
    return h.includes('type=recovery')||s.includes('type=recovery')||h.includes('access_token');
  }catch(e){return false;}
}
// Envolver render para inyectar Olvidé mi contraseña sin tocar el diseño aprobado del login
try{
  var _origRenderV22=render;
  render=async function(){
    await _origRenderV22();
    try{
      // Si es recuperación, mostrar formulario de contraseña nueva
      if(window.location.search.includes('code=')){await crksHandleRecoveryCode();}
      // Inyectar link Olvidé mi contraseña en login/registro si no existe
      var toggle=document.getElementById('authToggle');
      if(toggle&&!document.getElementById('crks-forgot')){
        var div=document.createElement('div');
        div.id='crks-forgot';
        div.style='margin:8px 0 2px;text-align:center';
        div.innerHTML='<span style="color:#c9e8a8;font-size:14px">¿Olvidaste tu contraseña? <b onclick="crksForgotPassword()" style="color:#A6FF00;cursor:pointer;text-decoration:underline">Recuperar cuenta</b></span><div style="font-size:11px;color:#888;margin-top:4px">Te enviamos un código de 6 dígitos al correo. Sin links, sin páginas vacías.</div>';
        toggle.parentNode.insertBefore(div, toggle.nextSibling);
      }
    }catch(e){}
  };
}catch(e){}
</script>

  try{ var b=JSON.parse(localStorage.getItem('crks_eventos_admin')||'[]'); localStorage.setItem('crks_eventos_admin',JSON.stringify(b.filter(function(x){ return String(x.title)!==String(title); }))); }catch(e){}
  if(sbId){ try{ await sb.from('events').delete().eq('id',sbId); }catch(e){} }
  if(postId){ try{ await sb.from('posts').delete().eq('id',postId); }catch(e){} }
  render();
}
</script>
</body></html>

<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRKS · Run Cracks Colombia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0a0a0a;--card:#151515;--ink:#ffffff;--g:#000000;--y:#A6FF00;--mut:#9aa39c}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--card:#151515;--ink:#ffffff;--g:#000000;--mut:#9aa39c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;margin:.2em 0;letter-spacing:.01em}h1{font-size:3rem}h2{font-size:1.8rem}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:#000;color:#fff;border-bottom:2px solid #A6FF00}header b{font:700 1.7rem 'Barlow Condensed',sans-serif;flex:1}
nav{display:flex;overflow-x:auto;background:#000;border-bottom:2px solid #A6FF00}nav a{padding:12px 16px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--mut)}nav a.on{color:var(--ink);box-shadow:inset 0 -4px var(--y)}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:#151515;border:1px solid #222;border-radius:12px;padding:14px;margin:0 0 12px;display:block;color:#fff}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,textarea,select{width:100%;padding:10px;margin:4px 0;border:1px solid #333;border-radius:8px;background:#111;color:#fff;font:inherit}
.row input,.row select{flex:1;min-width:90px}label{display:block;font-size:.85rem;color:var(--mut)}
button{padding:9px 14px;border:0;border-radius:4px;background:var(--y);color:#12261f;font:600 1rem Barlow,sans-serif;cursor:pointer}button.g{background:transparent;color:var(--ink);outline:1px solid var(--mut)}
header button{background:#fff3}small,.m{color:var(--mut)}img{max-width:100%;border-radius:4px;margin:6px 0}
.auth{max-width:380px;margin:12vh auto}:focus-visible{outline:3px solid var(--y);outline-offset:2px}

.publish-card{background:#000!important;color:#fff!important;border:2px solid #A6FF00!important;border-radius:16px!important;padding:18px!important}
.publish-card textarea,.publish-card input,.publish-card select{background:#111!important;color:#fff!important;border:1px solid #333!important;border-radius:10px!important}
.publish-card button{background:#A6FF00!important;color:#000!important;font-weight:800!important;border-radius:999px!important;padding:12px 20px!important;width:100%;font-size:1.05rem}
.publish-logo{font-family:'Barlow Condensed',Impact,sans-serif;font-size:2.6rem;font-weight:700;color:#A6FF00;text-align:center;line-height:1;margin:2px 0 8px;letter-spacing:.02em}
.publish-title{font-family:'Barlow Condensed',Impact,sans-serif;font-size:1.8rem;line-height:.95;text-align:center;margin:4px 0}
.publish-title span{color:#A6FF00}
.publish-sub{text-align:center;color:#aaa;font-size:.9rem;margin-bottom:12px}
.landing{background:#070807;color:#fff}
.l-hero{padding:28px 20px;max-width:900px}
.l-eyebrow{color:#A6FF00;letter-spacing:.28em;font-size:.9rem;font-weight:700}
.l-hero h1{font-size:clamp(3rem,10vw,6rem);line-height:.88;margin:12px 0}
.l-hero h1 .green{color:#A6FF00}
.l-hero p{color:#d6ddd8;max-width:560px}
.l-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.l-btn-primary{background:#A6FF00;color:#000;border:0;border-radius:999px;padding:12px 20px;font:700 1rem 'Barlow Condensed',sans-serif;cursor:pointer}
.l-btn-ghost{background:transparent;color:#fff;border:1.5px solid #fff;border-radius:999px;padding:11px 20px;font:700 1rem 'Barlow Condensed',sans-serif;cursor:pointer}
.l-ticker{background:#A6FF00;color:#000;overflow:hidden;white-space:nowrap;padding:9px 0;font-weight:700}
.home-sec{max-width:900px;margin:0 auto;padding:16px}
.post-card{background:var(--card);border-radius:12px;padding:14px;margin:0 0 14px}
.post-top{display:flex;gap:10px;align-items:center}
.post-avatar{width:44px;height:44px;border-radius:50%;background:#12261f;color:#A6FF00;display:flex;align-items:center;justify-content:center;font:700 1.2rem 'Barlow Condensed',sans-serif;flex-shrink:0;overflow:hidden}
.post-avatar img{width:100%;height:100%;object-fit:cover}
.streak-badge{background:#fff3cd;border:1px solid #f2b705;border-radius:999px;padding:2px 9px;font-size:.82rem;font-weight:700;white-space:nowrap}
.post-stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;font-weight:700}
.post-stats span{background:#222;padding:6px 10px;border-radius:999px;font-size:.9rem}
.miracha{background:#12261f;color:#fff;border-radius:12px;padding:14px;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.miracha b{color:#A6FF00;font-size:1.3rem}

.chat-box{background:var(--card);border-radius:12px;padding:14px;max-height:380px;overflow:auto;margin:10px 0}
.chat-msg{display:flex;gap:8px;margin:0 0 10px}
.chat-msg b{font-size:.9rem}
.rank-table{width:100%;border-collapse:collapse;font-size:.88rem}
.rank-table th,.rank-table td{padding:8px 6px;text-align:left;border-bottom:1px solid #333;color:#fff}
.rank-table th{background:#000;color:#A6FF00;border-bottom:2px solid #A6FF00}
.merch-title{font-size:2rem}
</style></head><body><div id="app"></div>

const sb=supabase.createClient(SB_URL,SB_KEY),$=s=>document.querySelector(s),V={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>d?new Date(d).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'}):'';
let me=null,prof=null,isAdmin=false,tab='home';
sb.auth.onAuthStateChange((_,s)=>{me=s?.user||null;setTimeout(async()=>{if(me)await loadMe();render()},0)});

async function getPosts(limit){
 try{
  let r=await sb.from('posts').select('*,profiles(name,streak,avatar_url),likes(user_id),comments(id,body,profiles(name,avatar_url))').order('created_at',{ascending:false}).limit(limit||20);
  if(!r.error && r.data) return r.data;
 }catch(e){}
 try{
  let r2=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(limit||20);
  let ps=r2.data||[];
  try{let pr=await sb.from('profiles').select('id,name,streak,avatar_url');let m={};(pr.data||[]).forEach(x=>{m[x.id]=x});ps=ps.map(x=>({...x,profiles:m[x.user_id]||null,likes:[],comments:[]}));}catch(e){}
  return ps;
 }catch(e){return []}
}


function parseTiempo(txt){if(!txt)return 0;txt=String(txt).trim();if(!txt)return 0;if(/^[0-9]+(\.[0-9]+)?$/.test(txt))return +txt;let parts=txt.split(':').map(Number);if(parts.some(isNaN))return 0;if(parts.length==2)return parts[0]*60+parts[1];if(parts.length==3)return parts[0]*60+parts[1]+parts[2]/60;return 0}
function fmtDigital(min){min=Math.round(min||0);let h=Math.floor(min/60),m=min%60,s=0;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function fmtTiempo(min){return fmtDigital(min)}
async function getMeetups(){try{let r=await sb.from('meetups').select('*,profiles(name),meetup_going(user_id)').order('starts_at');if(!r.error&&r.data)return r.data}catch(e){}try{let r2=await sb.from('meetups').select('*').order('starts_at');return r2.data||[]}catch(e){return []}}
async function getProducts(){try{let r=await sb.from('products').select('*').order('created_at',{ascending:false});if(!r.error)return r.data||[]}catch(e){}return []}

async function loadMe(){const [p,a]=await Promise.all([sb.from('profiles').select('*').eq('id',me.id).single(),sb.rpc('is_admin')]);prof=p.data;isAdmin=a.data===true}
const go=t=>{tab=t;render()};
async function render(){
 if(!me)return $('#app').innerHTML=`<div class="card auth"><h1>CRKS</h1><p class=m>Run Cracks Colombia. Entrena, publica y suma racha.</p><input id=n placeholder="Tu nombre (solo para crear cuenta)"><input id=e type=email placeholder="Correo"><input id=p type=password placeholder="Contraseña (mínimo 6)"><div class=row><button onclick="login()">Entrar</button><button class=g onclick="signup()">Crear cuenta</button></div><p id=msg></p></div>`;
 const nav=[['home','Inicio'],['feed','Entrenos'],['chats','Chats 🚀'],['rank','Ranking'],['meet','Encuentros'],['retos','Retos'],['eventos','Eventos'],['tienda','Merch ⚡'],['perfil','Perfil']];if(isAdmin)nav.push(['admin','Admin']);
 const lastChat=JSON.parse(localStorage.getItem('crks_last_chat')||'null'); const notif=(lastChat&&Date.now()-lastChat.time<3600000)?`<div style="background:#A6FF00;color:#000;padding:10px 16px;font-weight:700;text-align:center">🚀 ÚLTIMO AVISO: ${esc(lastChat.name)}: ${esc(lastChat.text)} · <span style="text-decoration:underline;cursor:pointer" onclick="go('chats')">Ver chats</span></div>`:'';
 $('#app').innerHTML=notif+`<header><img src="'+LOGO_URL+'" style="height:34px;width:auto" alt="CRKS"><b style="display:none">CRKS</b><span>🔥 ${prof?.streak||0} · ${esc(prof?.name)}</span><button onclick="sb.auth.signOut()">Salir</button></header><nav>${nav.map(([k,l])=>`<a class="${k==tab?'on':''}" onclick="go('${k}')">${l}</a>`).join('')}</nav><main id=v>Cargando…</main>`;
 try{$('#v').innerHTML=await V[tab]()}catch(e){$('#v').innerHTML='<p>Error: '+esc(e.message)+'</p>'}
}
const msg=t=>$('#msg').textContent=t;
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value});if(error)msg('No se pudo entrar: '+error.message)}
async function signup(){const{data,error}=await sb.auth.signUp({email:$('#e').value.trim(),password:$('#p').value,options:{data:{name:$('#n').value.trim()}}});if(error)return msg(error.message);if(!data.session)msg('Cuenta creada. Revisa tu correo para confirmarla y luego entra.')}
async function up(f){if(!f)return null;const p=`${me.id}/${Date.now()}-${f.name.replace(/[^\w.]/g,'_')}`;const{error}=await sb.storage.from('media').upload(p,f);if(error){alert(error.message);return null}return sb.storage.from('media').getPublicUrl(p).data.publicUrl}
async function del(t,id){if(!confirm('¿Eliminar?'))return;const{error}=await sb.from(t).delete().eq('id',id);if(error)alert(error.message);render()}
const img=u=>u?`<img src="${esc(u)}" alt="">`:'';

async function post(){let body=$('#pb').value.trim();if(!body)return alert('Cuéntanos qué entrenaste');if(!me)return alert('Inicia sesión para publicar');const f=$('#pf').files[0];const image_url=await up(f);if(f&&!image_url)return;const sport=$('#ps').value;const km=+$('#pk').value||0;const tiempoTxt=$('#pm')?$('#pm').value.trim():'';const minutes=parseTiempo(tiempoTxt)||0;const kilos=$('#pkilos')?+$('#pkilos').value||0:0;const pace=$('#ppace')?$('#ppace').value.trim():'';let extra=[];if(kilos)extra.push('Kilos: '+kilos);if(tiempoTxt)extra.push('Tiempo: '+tiempoTxt);if(pace)extra.push('Pace: '+pace);if(extra.length)body=body+'\n['+extra.join(' | ')+']';const{error}=await sb.from('posts').insert({user_id:me.id,body,sport,km,minutes,image_url});if(error)return alert(error.message);const t0=tab;$('#pb').value='';if($('#pk'))$('#pk').value='';if($('#pm'))$('#pm').value='';if($('#pkilos'))$('#pkilos').value='';if($('#ppace'))$('#ppace').value='';if($('#pf'))$('#pf').value='';await loadMe();tab=t0;render();alert('¡Entreno publicado! Ya quedó guardado.');}

V.rank=async()=>{
 const ps=await getPosts(300);
 const pr=(await sb.from('profiles').select('id,name,avatar_url,streak')).data||[];
 const mp={};pr.forEach(x=>{mp[x.id]=x});
 const agg={};
 (ps||[]).forEach(p=>{
  const uid=p.user_id||'sin-usuario'; if(!agg[uid]) agg[uid]={uid, name:(mp[uid]?.name)||(p.profiles?.name)||'Crack', streak:mp[uid]?.streak||p.profiles?.streak||0, run:0, bike:0, swim:0, trail:0, fuerzaMin:0, movMin:0, kilos:0, workouts:0, totalMin:0};
  const a=agg[uid]; a.workouts++; a.totalMin+=+p.minutes||0;
  const s=(p.sport||'').toLowerCase();
  if(s.includes('running')||s==='run') a.run+=+p.km||0;
  else if(s.includes('ciclismo')||s.includes('bici')||s.includes('bike')) a.bike+=+p.km||0;
  else if(s.includes('nataci')) a.swim+=+p.km||0;
  else if(s.includes('trail')) a.trail+=+p.km||0;
  else if(s.includes('fuerza')) a.fuerzaMin+=+p.minutes||0;
  else if(s.includes('movilidad')) a.movMin+=+p.minutes||0;
  const mk=/Kilos:\s*([0-9.]+)/.exec(p.body||''); if(mk) a.kilos+=+mk[1];
 });
 const arr=Object.values(agg);
 const table=(title, key, fmt, emoji)=>{const list=arr.filter(x=>x[key]>0).sort((a,b)=>b[key]-a[key]); if(!list.length) return `<h2>${emoji} ${title}</h2><p class=m>Aún nadie ha publicado en ${title}.</p>`; return `<h2>${emoji} ${title}</h2><div style="overflow:auto"><table class="rank-table"><tr><th>#</th><th>Crack</th><th>🔥 Racha</th><th>${title}</th><th>Entrenos</th></tr>${list.map((a,i)=>`<tr><td>${i+1}</td><td><b>${esc(a.name)}</b></td><td>🔥 ${a.streak}</td><td><b>${fmt(a[key])}</b></td><td>${a.workouts}</td></tr>`).join('')}</table></div>`};
 return '<h2>🏆 Ranking CRKS - Separado por deporte</h2><p class=m>Cada modalidad suma aparte. Un crack puede liderar Running y otro Ciclismo, no se mezclan.</p>'+table('Running','run',v=>v.toFixed(1)+' km','🏃')+table('Ciclismo','bike',v=>v.toFixed(1)+' km','🚴')+table('Natación','swim',v=>v.toFixed(1)+' km','🏊')+table('Trail','trail',v=>v.toFixed(1)+' km','🥾')+table('Fuerza','fuerzaMin',v=>fmtDigital(v),'🏋️')+table('Movilidad','movMin',v=>fmtDigital(v),'🧘')+`<h2>⚖️ Kilos totales - Fuerza</h2><div style="overflow:auto"><table class="rank-table"><tr><th>#</th><th>Crack</th><th>Kilos</th></tr>${arr.filter(x=>x.kilos>0).sort((a,b)=>b.kilos-a.kilos).map((a,i)=>`<tr><td>${i+1}</td><td><b>${esc(a.name)}</b></td><td><b>${a.kilos} kg</b></td></tr>`).join('')||'<tr><td colspan=3>Aún nadie ha registrado kilos.</td></tr>'}</table></div>`;
};

 let msgs=[];
 try{let r=await sb.from('chats').select('*,profiles(name)').order('created_at',{ascending:false}).limit(50); if(!r.error&&r.data) msgs=r.data.reverse().map(x=>({name:x.profiles?.name||'Crack',text:x.body,time:new Date(x.created_at).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}));}catch(e){}
 if(!msgs.length){ msgs=JSON.parse(localStorage.getItem('crks_chats')||'[]'); }

<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRKS · Run Cracks Colombia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#e4ebe6;--card:#fff;--ink:#12261f;--g:#1f5d46;--y:#f2b705;--mut:#5d6f67}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a15;--card:#17271f;--ink:#e8f0eb;--g:#3f9b77;--mut:#93a89d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;margin:.2em 0;letter-spacing:.01em}h1{font-size:3rem}h2{font-size:1.8rem}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--g);color:#fff}header b{font:700 1.7rem 'Barlow Condensed',sans-serif;flex:1}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:2px solid var(--g)}nav a{padding:12px 16px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--mut)}nav a.on{color:var(--ink);box-shadow:inset 0 -4px var(--y)}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:6px;padding:14px;margin:0 0 12px;display:block}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,textarea,select{width:100%;padding:10px;margin:4px 0;border:1px solid var(--mut);border-radius:4px;background:transparent;color:inherit;font:inherit}
.row input,.row select{flex:1;min-width:90px}label{display:block;font-size:.85rem;color:var(--mut)}
button{padding:9px 14px;border:0;border-radius:4px;background:var(--y);color:#12261f;font:600 1rem Barlow,sans-serif;cursor:pointer}button.g{background:transparent;color:var(--ink);outline:1px solid var(--mut)}
header button{background:#fff3}small,.m{color:var(--mut)}img{max-width:100%;border-radius:4px;margin:6px 0}
.auth{max-width:380px;margin:12vh auto}:focus-visible{outline:3px solid var(--y);outline-offset:2px}

.publish-card{background:#000!important;color:#fff!important;border:2px solid #A6FF00!important;border-radius:16px!important;padding:18px!important}
.publish-card textarea,.publish-card input,.publish-card select{background:#111!important;color:#fff!important;border:1px solid #333!important;border-radius:10px!important}
.publish-card button{background:#A6FF00!important;color:#000!important;font-weight:800!important;border-radius:999px!important;padding:12px 20px!important;width:100%;font-size:1.05rem}
.publish-logo{font-family:'Barlow Condensed',Impact,sans-serif;font-size:2.6rem;font-weight:700;color:#A6FF00;text-align:center;line-height:1;margin:2px 0 8px;letter-spacing:.02em}
.publish-title{font-family:'Barlow Condensed',Impact,sans-serif;font-size:1.8rem;line-height:.95;text-align:center;margin:4px 0}
.publish-title span{color:#A6FF00}
.publish-sub{text-align:center;color:#aaa;font-size:.9rem;margin-bottom:12px}
.landing{background:#070807;color:#fff}
.l-hero{padding:28px 20px;max-width:900px}
.l-eyebrow{color:#A6FF00;letter-spacing:.28em;font-size:.9rem;font-weight:700}
.l-hero h1{font-size:clamp(3rem,10vw,6rem);line-height:.88;margin:12px 0}
.l-hero h1 .green{color:#A6FF00}
.l-hero p{color:#d6ddd8;max-width:560px}
.l-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.l-btn-primary{background:#A6FF00;color:#000;border:0;border-radius:999px;padding:12px 20px;font:700 1rem 'Barlow Condensed',sans-serif;cursor:pointer}
.l-btn-ghost{background:transparent;color:#fff;border:1.5px solid #fff;border-radius:999px;padding:11px 20px;font:700 1rem 'Barlow Condensed',sans-serif;cursor:pointer}
.l-ticker{background:#A6FF00;color:#000;overflow:hidden;white-space:nowrap;padding:9px 0;font-weight:700}
.home-sec{max-width:900px;margin:0 auto;padding:16px}
.post-card{background:var(--card);border-radius:12px;padding:14px;margin:0 0 14px}
.post-top{display:flex;gap:10px;align-items:center}
.post-avatar{width:44px;height:44px;border-radius:50%;background:#12261f;color:#A6FF00;display:flex;align-items:center;justify-content:center;font:700 1.2rem 'Barlow Condensed',sans-serif;flex-shrink:0;overflow:hidden}
.post-avatar img{width:100%;height:100%;object-fit:cover}
.streak-badge{background:#fff3cd;border:1px solid #f2b705;border-radius:999px;padding:2px 9px;font-size:.82rem;font-weight:700;white-space:nowrap}
.post-stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;font-weight:700}
.post-stats span{background:#eef4ef;padding:6px 10px;border-radius:999px;font-size:.9rem}
.miracha{background:#12261f;color:#fff;border-radius:12px;padding:14px;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.miracha b{color:#A6FF00;font-size:1.3rem}

.chat-box{background:var(--card);border-radius:12px;padding:14px;max-height:380px;overflow:auto;margin:10px 0}
.chat-msg{display:flex;gap:8px;margin:0 0 10px}
.chat-msg b{font-size:.9rem}
.rank-table{width:100%;border-collapse:collapse;font-size:.88rem}
.rank-table th,.rank-table td{padding:8px 6px;text-align:left;border-bottom:1px solid #ddd}
.rank-table th{background:#12261f;color:#A6FF00}
.merch-title{font-size:2rem}
</style></head><body><div id="app"></div>
<script>
const SB_URL='https://oqyjbradimrzhrcawept.supabase.co',SB_KEY='sb_publishable_f1rIroehbs0PaGBu2DCqkA_MBA4CtLP';
const sb=supabase.createClient(SB_URL,SB_KEY),$=s=>document.querySelector(s),V={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>d?new Date(d).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'}):'';
let me=null,prof=null,isAdmin=false,tab='home';
sb.auth.onAuthStateChange((_,s)=>{me=s?.user||null;setTimeout(async()=>{if(me)await loadMe();render()},0)});

async function getPosts(limit){
 try{
  let r=await sb.from('posts').select('*,profiles(name,streak,avatar_url),likes(user_id),comments(id,body,profiles(name,avatar_url))').order('created_at',{ascending:false}).limit(limit||20);
  if(!r.error && r.data) return r.data;
 }catch(e){}
 try{
  let r2=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(limit||20);
  let ps=r2.data||[];
  try{let pr=await sb.from('profiles').select('id,name,streak,avatar_url');let m={};(pr.data||[]).forEach(x=>{m[x.id]=x});ps=ps.map(x=>({...x,profiles:m[x.user_id]||null,likes:[],comments:[]}));}catch(e){}
  return ps;
 }catch(e){return []}
}


function parseTiempo(txt){if(!txt)return 0;txt=String(txt).trim();if(!txt)return 0;if(/^[0-9]+(\.[0-9]+)?$/.test(txt))return +txt;let parts=txt.split(':').map(Number);if(parts.some(isNaN))return 0;if(parts.length==2)return parts[0]*60+parts[1];if(parts.length==3)return parts[0]*60+parts[1]+parts[2]/60;return 0}
function fmtTiempo(min){if(!min)return '';min=Math.round(min);let h=Math.floor(min/60),m=min%60;return h>0?h+':'+String(m).padStart(2,'0')+' h':m+':00 min'}
async function getMeetups(){try{let r=await sb.from('meetups').select('*,profiles(name),meetup_going(user_id)').order('starts_at');if(!r.error&&r.data)return r.data}catch(e){}try{let r2=await sb.from('meetups').select('*').order('starts_at');return r2.data||[]}catch(e){return []}}
async function getProducts(){try{let r=await sb.from('products').select('*').order('created_at',{ascending:false});if(!r.error)return r.data||[]}catch(e){}return []}

async function loadMe(){const [p,a]=await Promise.all([sb.from('profiles').select('*').eq('id',me.id).single(),sb.rpc('is_admin')]);prof=p.data;isAdmin=a.data===true}
const go=t=>{tab=t;render()};
async function render(){
 if(!me)return $('#app').innerHTML=`<div class="card auth"><h1>CRKS</h1><p class=m>Run Cracks Colombia. Entrena, publica y suma racha.</p><input id=n placeholder="Tu nombre (solo para crear cuenta)"><input id=e type=email placeholder="Correo"><input id=p type=password placeholder="Contraseña (mínimo 6)"><div class=row><button onclick="login()">Entrar</button><button class=g onclick="signup()">Crear cuenta</button></div><p id=msg></p></div>`;
 const nav=[['home','Inicio'],['feed','Entrenos'],['chats','Chats ⚡'],['rank','Ranking'],['meet','Encuentros'],['retos','Retos'],['eventos','Eventos'],['tienda','Merch ⚡'],['perfil','Perfil']];if(isAdmin)nav.push(['admin','Admin']);
 $('#app').innerHTML=`<header><b>CRKS</b><span>🔥 ${prof?.streak||0} · ${esc(prof?.name)}</span><button onclick="sb.auth.signOut()">Salir</button></header><nav>${nav.map(([k,l])=>`<a class="${k==tab?'on':''}" onclick="go('${k}')">${l}</a>`).join('')}</nav><main id=v>Cargando…</main>`;
 try{$('#v').innerHTML=await V[tab]()}catch(e){$('#v').innerHTML='<p>Error: '+esc(e.message)+'</p>'}
}
const msg=t=>$('#msg').textContent=t;
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value});if(error)msg('No se pudo entrar: '+error.message)}
async function signup(){const{data,error}=await sb.auth.signUp({email:$('#e').value.trim(),password:$('#p').value,options:{data:{name:$('#n').value.trim()}}});if(error)return msg(error.message);if(!data.session)msg('Cuenta creada. Revisa tu correo para confirmarla y luego entra.')}
async function up(f){if(!f)return null;const p=`${me.id}/${Date.now()}-${f.name.replace(/[^\w.]/g,'_')}`;const{error}=await sb.storage.from('media').upload(p,f);if(error){alert(error.message);return null}return sb.storage.from('media').getPublicUrl(p).data.publicUrl}
async function del(t,id){if(!confirm('¿Eliminar?'))return;const{error}=await sb.from(t).delete().eq('id',id);if(error)alert(error.message);render()}
const img=u=>u?`<img src="${esc(u)}" alt="">`:'';


V.home=async()=>{
 const ps=await getPosts(20);
 const ms=(await sb.from('meetups').select('*,profiles(name),meetup_going(user_id)').order('starts_at').limit(3)).data||[];
 const pr=(await sb.from('products').select('*').order('created_at',{ascending:false}).limit(4)).data||[];
 const ch=(await sb.from('challenges').select('*').order('created_at',{ascending:false}).limit(3)).data||[];
 return `<div class="landing"><div class="l-hero"><div class="l-eyebrow">CLUB DEPORTIVO \u2022 COLOMBIA</div><h1>NACIMOS<br>PARA<br><span class="green">RENDIR.</span></h1><p>Entrena con tus cracks. Comparte cada kil\u00f3metro, acepta retos y cuadra la pr\u00f3xima salida con los Cracks.</p><div class="l-btns"><button class="l-btn-primary" onclick="go('feed')">\uD83D\uDCF7 PUBLICA TU ENTRENO</button><button class="l-btn-ghost" onclick="go('meet')">\uD83E\uDD1D ARMA UN ENCUENTRO</button></div></div><div class="l-ticker"><span>PREP\u00c1RATE \u26a1 CRKS \u26a1 ENTRENA \u26a1 COMPARTE \u26a1 SUP\u00c9RATE \u26a1 CRKS \u26a1&nbsp;&nbsp;</span></div></div><div class="home-sec"><div class="miracha"><div><div style="opacity:.8">TU RACHA</div><b>\uD83D\uDD25 ${prof?.streak||0} d\u00edas</b> <small>\u2022 R\u00e9cord ${prof?.best_streak||0}</small></div><button class="l-btn-primary" onclick="go('feed')">+ Publicar</button></div><h2>\uD83D\uDD25 Entrenos de los Cracks</h2>${((ps||[]).map(p=>{const nm=esc(p.profiles?.name||'Crack');const ini=nm.charAt(0).toUpperCase();const av=p.profiles?.avatar_url?`<img src="${esc(p.profiles.avatar_url)}">`:ini;const lk=(p.likes||[]).some(x=>x.user_id==me.id);return `<div class="post-card"><div class="post-top"><div class="post-avatar">${av}</div><div style="flex:1"><div style="font-weight:700">${nm}</div><div class="m">${fd(p.created_at)} \u2022 ${esc(p.sport||'')}</div></div><span class="streak-badge">\uD83D\uDD25 ${p.profiles?.streak||0} d\u00edas</span></div><p>${esc(p.body)}</p>${img(p.image_url)}<div class="post-stats"><span>\uD83C\uDFC3 ${+p.km} km</span><span>\u23f1\uFE0F ${p.minutes} min</span></div><div class="row"><button class=g onclick="like('${p.id}',${lk})">${lk?'\u2764\uFE0F':'\uD83E\uDD0D'} ${(p.likes||[]).length}</button><button class=g onclick="cmt('${p.id}')">\uD83D\uDCAC ${(p.comments||[]).length}</button>${p.user_id==me.id||isAdmin?`<button class=g onclick="del('posts','${p.id}')">Borrar</button>`:''}</div>${(p.comments||[]).map(c=>`<small><b>${esc(c.profiles?.name)}:</b> ${esc(c.body)}</small><br>`).join('')}</div>`}).join('')||'<p class=m>A\u00fan no hay entrenos. Publica el primero.</p>')}<button class=g onclick="go('feed')">Publicar / Ver todo \u2192</button><h2>\uD83E\uDD1D Pr\u00f3ximos encuentros</h2>${((ms||[]).map(m=>`<div class="card"><h3>${esc(m.title)}</h3><div class=m>${esc(m.place)} \u2022 ${fd(m.starts_at)} \u2022 por ${esc(m.profiles?.name||'')}</div></div>`).join('')||'<p class=m>No hay encuentros programados.</p>')}<button class=g onclick="go('meet')">Ver encuentros \u2192</button><h2>\uD83C\uDFC6 Retos</h2>${((ch||[]).map(r=>`<div class="card">${img(r.cover_url)}<h3>${esc(r.title)}</h3><p>${esc(r.description)}</p></div>`).join('')||'<p class=m>No hay retos activos.</p>')}<h2>\uD83D\uDECD\uFE0F Merch / Tienda</h2>${((pr||[]).filter(r=>r.active!==false).map(r=>`<div class="card">${img(r.image_url)}<h3>${esc(r.name)}</h3><p>${esc(r.description)}</p><b>${esc(r.price)}</b></div>`).join('')||'<p class=m>Pronto m\u00e1s merch CRKS.</p>')}<button class=g onclick="go('tienda')">Ver Merch ⚡ \u2192</button></div>`;
};

V.feed=async()=>{
 const ps=await getPosts(30);
 return`<div class="card publish-card"><div class="publish-logo">CRKS\u26a1</div><div class="publish-title">PUBLICA TU <span>ENTRENO</span></div><div class="publish-sub">Cada kil\u00f3metro cuenta. Comparte tu racha con los Cracks.</div><textarea id=pb rows=2 placeholder="¿Qué entrenaste hoy? Ej: 21k montaña, me sentí fuerte"></textarea><div class=row><select id=ps><option value="Running">Running</option><option value="Ciclismo">Ciclismo</option><option value="Natación">Natación</option><option value="Trail">Trail</option><option value="Fuerza">Fuerza</option><option value="Movilidad">Movilidad</option><option value="Otro">Otro</option></select><input id=pk type=number step=any placeholder="Km (Running / Bici / Natación)"></div><div class=row><input id=pm placeholder="Tiempo Ej: 30:00 o 1:20"><input id=pkilos type=number step=any placeholder="Kilos (solo Fuerza, opcional)"><input id=ppace placeholder="Pace opcional Ej: 5:30 /km"></div><input id=pf type=file accept="image/*"><button onclick="post()">Publicar entreno</button><small class=m>Tiempo: escribe 30:00 para 30 min, o 1:20 para 1h 20min. Pace: solo si quieres, Ej: 5:30</small></div>`+
 ((ps||[]).map(p=>{const l=p.likes.some(x=>x.user_id==me.id);return`<div class=card><b>${esc(p.profiles?.name)}</b> <small>${fd(p.created_at)} · ${esc(p.sport||'')} · ${+p.km} km · ${p.minutes} min</small><p>${esc(p.body)}</p>${img(p.image_url)}<div class=row><button class=g onclick="like('${p.id}',${l})">${l?'❤️':'🤍'} ${p.likes.length}</button><button class=g onclick="cmt('${p.id}')">💬 ${p.comments.length}</button>${p.user_id==me.id||isAdmin?`<button class=g onclick="del('posts','${p.id}')">Borrar</button>`:''}</div>${p.comments.map(c=>`<small><b>${esc(c.profiles?.name)}:</b> ${esc(c.body)}</small><br>`).join('')}</div>`}).join('')||'<p class=m>Aún no hay entrenos. Publica el primero y empieza tu racha.</p>')};
async function post(){let body=$('#pb').value.trim();if(!body)return alert('Cuéntanos qué entrenaste');if(!me)return alert('Inicia sesión para publicar');const f=$('#pf').files[0];const image_url=await up(f);if(f&&!image_url)return;const sport=$('#ps').value;const km=+$('#pk').value||0;const tiempoTxt=$('#pm')?$('#pm').value.trim():'';const minutes=parseTiempo(tiempoTxt)||0;const kilos=$('#pkilos')?+$('#pkilos').value||0:0;const pace=$('#ppace')?$('#ppace').value.trim():'';let extra=[];if(kilos)extra.push('Kilos: '+kilos);if(tiempoTxt)extra.push('Tiempo: '+tiempoTxt);if(pace)extra.push('Pace: '+pace);if(extra.length)body=body+'\n['+extra.join(' | ')+']';const{error}=await sb.from('posts').insert({user_id:me.id,body,sport,km,minutes,image_url});if(error)return alert(error.message);const t0=tab;$('#pb').value='';if($('#pk'))$('#pk').value='';if($('#pm'))$('#pm').value='';if($('#pkilos'))$('#pkilos').value='';if($('#ppace'))$('#ppace').value='';if($('#pf'))$('#pf').value='';await loadMe();tab=t0;render();alert('¡Entreno publicado! Ya quedó guardado.');}
async function like(id,l){await(l?sb.from('likes').delete().match({post_id:id,user_id:me.id}):sb.from('likes').insert({post_id:id,user_id:me.id}));render()}
async function cmt(id){const body=prompt('Tu comentario');if(!body)return;await sb.from('comments').insert({post_id:id,user_id:me.id,body});render()}

V.rank=async()=>{
 const ps=await getPosts(200);
 const pr=(await sb.from('profiles').select('id,name,avatar_url,streak')).data||[];
 const mp={};pr.forEach(x=>{mp[x.id]=x});
 const agg={};
 (ps||[]).forEach(p=>{
  const uid=p.user_id||'sin-usuario'; if(!agg[uid]) agg[uid]={uid, name:(mp[uid]?.name)||(p.profiles?.name)||'Crack', avatar:mp[uid]?.avatar_url||p.profiles?.avatar_url||'', streak:mp[uid]?.streak||p.profiles?.streak||0, run:0, bike:0, swim:0, trail:0, fuerzaMin:0, movMin:0, kilos:0, workouts:0, totalMin:0};
  const a=agg[uid]; a.workouts++; a.totalMin+=+p.minutes||0;
  const s=(p.sport||'').toLowerCase();
  if(s.includes('running')||s==='run') a.run+=+p.km||0;
  else if(s.includes('ciclismo')||s.includes('bici')||s.includes('bike')) a.bike+=+p.km||0;
  else if(s.includes('nataci')) a.swim+=+p.km||0;
  else if(s.includes('trail')) a.trail+=+p.km||0;
  else if(s.includes('fuerza')) a.fuerzaMin+=+p.minutes||0;
  else if(s.includes('movilidad')||s.includes('movilidad')) a.movMin+=+p.minutes||0;
  // Kilos desde el texto [Kilos: 50]
  const mk=/Kilos:\s*([0-9.]+)/.exec(p.body||''); if(mk) a.kilos+=+mk[1];
 });
 const arr=Object.values(agg).sort((a,b)=>(b.run+b.bike+b.swim+b.trail)- (a.run+a.bike+a.swim+a.trail));
 return '<h2>🏆 Ranking CRKS</h2><p class=m>Sumatoria de todo lo que publican. Running, Bici y Natación separados por km. Fuerza y Movilidad por tiempo. Kilos sumados aparte.</p><div style="overflow:auto"><table class="rank-table"><tr><th>#</th><th>Crack</th><th>🔥 Racha</th><th>🏃 Run km</th><th>🚴 Bici km</th><th>🏊 Nata km</th><th>🥾 Trail km</th><th>🏋️ Fuerza</th><th>🧘 Movilidad</th><th>⚖️ Kilos</th><th>Entrenos</th></tr>'+arr.map((a,i)=>`<tr><td>${i+1}</td><td><b>${esc(a.name)}</b></td><td>🔥 ${a.streak}</td><td>${a.run.toFixed(1)}</td><td>${a.bike.toFixed(1)}</td><td>${a.swim.toFixed(1)}</td><td>${a.trail.toFixed(1)}</td><td>${fmtTiempo(a.fuerzaMin)}</td><td>${fmtTiempo(a.movMin)}</td><td>${a.kilos}</td><td>${a.workouts}</td></tr>`).join('')+'</table></div><p class=m>El ranking se calcula solo con lo que publican en Entrenos. Si alguien pone Running, suma en Run. Si pone Bici, suma en Bici. Si pone Natación, suma en Nata. Así no se mezclan.</p>';
};


V.meet=async()=>{
 const ms=await getMeetups();
 return`<div class=card><h3>Proponer encuentro</h3><input id=mt placeholder="Título (ej. Rodada del domingo)"><input id=mp placeholder="Lugar"><input id=md type=datetime-local><button onclick="mk()">Crear encuentro</button></div>`+
 ((ms||[]).map(m=>{const g=m.meetup_going.some(x=>x.user_id==me.id);return`<div class=card><h3>${esc(m.title)}</h3><div class=m>${esc(m.place)} · ${fd(m.starts_at)} · por ${esc(m.profiles?.name)}</div><div class=row><button class=${g?'g':''} onclick="going('${m.id}',${g})">${g?'Ya no voy':'Voy'} (${m.meetup_going.length})</button>${m.user_id==me.id||isAdmin?`<button class=g onclick="del('meetups','${m.id}')">Borrar</button>`:''}</div></div>`}).join('')||'<p class=m>No hay encuentros programados.</p>')};
async function mk(){const title=$('#mt').value.trim();if(!title)return alert('Pon un título');const d=$('#md').value;const{error}=await sb.from('meetups').insert({user_id:me.id,title,place:$('#mp').value,starts_at:d?new Date(d).toISOString():null});if(error)alert(error.message);render()}
async function going(id,g){await(g?sb.from('meetup_going').delete().match({meetup_id:id,user_id:me.id}):sb.from('meetup_going').insert({meetup_id:id,user_id:me.id}));render()}

const list=async(t,f,o)=>{const{data}=await sb.from(t).select('*').order(o,{ascending:false});return(data||[]).map(f).join('')||'<p class=m>Aún no hay nada publicado aquí.</p>'};

V.chats=()=>{
 const msgs=JSON.parse(localStorage.getItem('crks_chats')||'[]');
 const list=msgs.length?msgs.map(m=>`<div class="chat-msg"><b>${esc(m.name)}:</b><span>${esc(m.text)}</span><small class=m> ${esc(m.time)}</small></div>`).join(''):'<p class=m>Aún no hay mensajes. Sé el primero en avisar un entreno de repente.</p>';
 return `<h2>Chats ⚡ Entrenos de repente</h2><p class=m>Espacio aparte para coordinar en cualquier momento. Ej: "Salimos en 30 min a 10k, ¿quién va?"</p><div class="chat-box" id="chatbox">${list}</div><input id="chatInput" placeholder="Escribe: Salimos en 30 min a... ¿quién va?"><div class=row><button onclick="sendChat()">Enviar</button><button class=g onclick="suddenTraining()">⚡ Avisar entreno de repente</button></div><p class=m>Por ahora los chats quedan guardados en este celular / navegador. Para que los vean TODOS en todos los celulares, hay que crear la tabla chats en Supabase (te dejé el SQL abajo en el chat).</p>`;
};
function sendChat(){const v=$('#chatInput').value.trim();if(!v)return;const msgs=JSON.parse(localStorage.getItem('crks_chats')||'[]');msgs.push({name:prof?.name||'Crack',text:v,time:new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})});localStorage.setItem('crks_chats',JSON.stringify(msgs.slice(-100)));render()}
function suddenTraining(){const msg=prompt('¿Qué entreno de repente? Ej: Salimos en 30 min, 10k en el parque');if(!msg)return;const msgs=JSON.parse(localStorage.getItem('crks_chats')||'[]');msgs.push({name:prof?.name||'Crack',text:'⚡ ENTRENO DE REPENTE: '+msg,time:new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})});localStorage.setItem('crks_chats',JSON.stringify(msgs.slice(-100)));tab='chats';render()}

V.retos=()=>list('challenges',r=>`<div class=card>${img(r.cover_url)}<h3>${esc(r.title)}</h3><p>${esc(r.description)}</p><div class=m>Meta: ${+r.goal_km} km · ${r.starts_on||''} → ${r.ends_on||''}</div></div>`,'created_at').then(h=>'<h2>Retos</h2>'+h);
V.eventos=()=>list('events',r=>`<div class=card>${img(r.image_url)}<h3>${esc(r.title)}</h3><div class=m>${fd(r.starts_at)} · ${esc(r.place)}</div><p>${esc(r.description)}</p><b>${esc(r.price)}</b> <small>${esc(r.includes)}</small></div>`,'created_at').then(h=>'<h2>Eventos</h2>'+h);
V.tienda=()=>list('products',r=>r.active?`<div class=card>${img(r.image_url)}<h3>${esc(r.name)}</h3><p>${esc(r.description)}</p><b>${esc(r.price)}</b></div>`:'','sort').then(h=>'<h2>Merch ⚡</h2>'+h);


const FRASES=['Hoy te superas a ti mismo, no a nadie más.','Un kilómetro más es una excusa menos.','Los cracks no esperan motivación, la crean.','Tu yo de mañana te está mirando entrenar hoy.','No se trata de ser el más rápido, sino de no parar.','Cada entreno es una promesa que te cumples.','El dolor pasa, la racha queda.'];
function fraseHoy(){const d=new Date();const idx=Math.floor((d.getTime()/86400000)%FRASES.length);return FRASES[idx]}

V.perfil=async()=>{
 const{data:b}=await sb.from('user_badges').select('badges(name,emoji,description)').eq('user_id',me.id);const x=prof||{};
 return`<h2>Mi perfil</h2><div class="card" style="background:#000;color:#fff;border:2px solid #A6FF00"><div style="color:#A6FF00;font-weight:700">FRASE DE HOY</div><div style="font-size:1.2rem;font-weight:700">“${fraseHoy()}”</div><div style="margin-top:8px">🔥 Racha: ${prof?.streak||0} días · Récord: ${prof?.best_streak||0}</div></div><div class="card"><h3>🏅 Mis insignias</h3><div class=row>${(b||[]).map(i=>`<span title="${esc(i.badges.description)}">${i.badges.emoji} ${esc(i.badges.name)}</span>`).join('')||'<span class=m>Aún no tienes insignias. Completa un reto o publica tu primer entreno.</span>'}</div></div><div class=card>${img(x.avatar_url)}<label>Nombre<input id=fn value="${esc(x.name)}"></label><label>Deporte<input id=fs value="${esc(x.sport)}"></label><label>Nivel<input id=fl value="${esc(x.level)}"></label><label>Sobre mí<textarea id=fb rows=2>${esc(x.bio)}</textarea></label><label>Foto de perfil (se verá en tus entrenos y comentarios)<input id=fa type=file accept="image/*"></label><button onclick="save()">Guardar cambios</button></div><div class=card><h3>Racha: ${x.streak||0} días <small>(récord ${x.best_streak||0})</small></h3><div class=row>${(b||[]).map(i=>`<span title="${esc(i.badges.description)}">${i.badges.emoji} ${esc(i.badges.name)}</span>`).join('')||'<span class=m>Publica un entreno para ganar tu primera insignia.</span>'}</div></div>`};
async function save(){const o={name:$('#fn').value,sport:$('#fs').value,level:$('#fl').value,bio:$('#fb').value,onboarded:true};const a=await up($('#fa').files[0]);if(a)o.avatar_url=a;const{error}=await sb.from('profiles').update(o).eq('id',me.id);if(error)alert(error.message);await loadMe();render()}

const F={challenges:['Retos',[['title','Título'],['description','Descripción'],['goal_km','Meta (km)','number'],['starts_on','Inicio','date'],['ends_on','Fin','date'],['cover_url','Portada','file']]],events:['Eventos',[['title','Título'],['starts_at','Fecha y hora','datetime-local'],['place','Lugar'],['description','Descripción'],['price','Precio'],['includes','Qué incluye'],['image_url','Imagen','file']]],products:['Productos',[['name','Nombre'],['description','Descripción'],['price','Precio'],['image_url','Imagen','file']]]};
V.admin=async()=>{let h='<h2>Panel de administrador</h2>';
 for(const t in F){const{data}=await sb.from(t).select('*').order('created_at',{ascending:false});
  h+=`<div class=card><h3>${F[t][0]}</h3>${F[t][1].map(([k,l,ty='text'])=>`<label>${l}<input id="${t}_${k}" type=${ty} ${ty=='file'?'accept="image/*"':''}></label>`).join('')}<button onclick="add('${t}')">Agregar</button>${(data||[]).map(r=>`<div class=row><span style="flex:1">${esc(r.title||r.name)}</span><button class=g onclick="del('${t}','${r.id}')">Borrar</button></div>`).join('')}</div>`}
 const[{data:u},{data:b}]=await Promise.all([sb.from('profiles').select('id,name'),sb.from('badges').select('id,name,emoji')]);
 return h+`<div class=card><h3>Otorgar insignia</h3><select id=bu>${(u||[]).map(x=>`<option value="${x.id}">${esc(x.name)}`).join('')}</select><select id=bb>${(b||[]).map(x=>`<option value="${x.id}">${x.emoji} ${esc(x.name)}`).join('')}</select><button onclick="award()">Otorgar</button></div>`};
async function add(t){const o={};for(const[k,,ty]of F[t][1]){const e=$(`#${t}_${k}`);if(ty=='file')o[k]=await up(e.files[0]);else if(e.value)o[k]=ty=='datetime-local'?new Date(e.value).toISOString():ty=='number'?+e.value:e.value}const{error}=await sb.from(t).insert(o);if(error)return alert(error.message);render()}
async function award(){const{error}=await sb.from('user_badges').insert({user_id:$('#bu').value,badge_id:+$('#bb').value});if(error)alert(error.message);else alert('Insignia otorgada')}
</script></body></html>

const RETOS_IA=[{t:'100 Km Running en menos de un mes',d:'Suma 100 km en Running en 30 dias.',meta:100,tipo:'run',emoji:'x'},{t:'100 Kg en Press Banca',d:'Registra 100 kg en Fuerza.',meta:100,tipo:'kilos',emoji:'x'},{t:'50 Km en Bici en una semana',d:'Suma 50 km en Ciclismo.',meta:50,tipo:'bike',emoji:'x'},{t:'5 Km Natacion en un mes',d:'Suma 5 km en Natacion.',meta:5,tipo:'swim',emoji:'x'},{t:'15 dias seguidos',d:'Publica 15 dias seguidos.',meta:15,tipo:'racha',emoji:'x'},{t:'200 Kg totales en Fuerza',d:'Suma 200 kg en Fuerza.',meta:200,tipo:'kilos',emoji:'x'}];
async function getPosts(n=80){try{let r=await sb.from('posts').select('*,profiles(name,avatar_url),likes(user_id),comments(id,body,profiles(name,avatar_url))').order('created_at',{ascending:false}).limit(n);if(!r.error&&r.data)return r.data}catch(e){}try{let r2=await sb.from('posts').select('*,profiles(name,avatar_url)').order('created_at',{ascending:false}).limit(n);let posts=r2.data||[];try{let lk=await sb.from('likes').select('post_id,user_id');let cm=await sb.from('comments').select('id,post_id,body,profiles(name,avatar_url)');posts.forEach(pp=>{pp.likes=(lk.data||[]).filter(x=>x.post_id==pp.id);pp.comments=(cm.data||[]).filter(x=>x.post_id==pp.id)});}catch(e){posts.forEach(pp=>{pp.likes=[];pp.comments=[]})}return posts}catch(e){return []}}
async function like(id,l){if(!me)return alert('Inicia sesion');try{const r=await(l?sb.from('likes').delete().match({post_id:id,user_id:me.id}):sb.from('likes').insert({post_id:id,user_id:me.id}));if(r.error)throw r.error;render()}catch(e){alert('No se pudo reaccionar. Pega el SQL de likes. Error: '+e.message)}}
async function cmt(id){if(!me)return alert('Inicia sesion');const body=prompt('Tu comentario');if(!body)return;try{const r=await sb.from('comments').insert({post_id:id,user_id:me.id,body});if(r.error)throw r.error;render()}catch(e){alert('No se pudo comentar. Error: '+e.message)}}
async function mk(){const title=$('#mt').value.trim();if(!title)return alert('Pon un titulo');if(!me)return alert('Inicia sesion');try{const d=$('#md').value;const r=await sb.from('meetups').insert({user_id:me.id,title,place:$('#mp').value,starts_at:d?new Date(d).toISOString():null});if(r.error)throw r.error;alert('Encuentro creado. Todos lo ven!');render()}catch(e){alert('No se pudo crear. Pega el SQL de meetups. Error: '+e.message)}}
async function joinMeet(id){if(!me)return alert('Inicia sesion');try{const r=await sb.from('meetup_going').insert({meetup_id:id,user_id:me.id});if(r.error)throw r.error;alert('Te sumaste!');render()}catch(e){alert('No se pudo unir. Error: '+e.message)}}
async function commentMeet(id){const body=prompt('Tu comentario para este encuentro');if(!body)return;const arr=JSON.parse(localStorage.getItem('crks_meet_comments')||'[]');arr.push({meet:id,name:prof?.name||'Crack',body});localStorage.setItem('crks_meet_comments',JSON.stringify(arr));render()}
async function saveRetoAdmin(){const title=$('#rt').value.trim();if(!title)return alert('Pon titulo');const arr=JSON.parse(localStorage.getItem('crks_retos_admin')||'[]');arr.push({title,desc:$('#rd').value,meta:+$('#rm').value||0});localStorage.setItem('crks_retos_admin',JSON.stringify(arr));alert('Reto guardado.');render()}
async function saveEventoAdmin(){const title=$('#et').value.trim();if(!title)return alert('Pon titulo');const arr=JSON.parse(localStorage.getItem('crks_eventos_admin')||'[]');arr.push({title,desc:$('#ed').value,when:$('#edt').value,place:$('#ep').value,price:$('#epr').value});localStorage.setItem('crks_eventos_admin',JSON.stringify(arr));alert('Evento guardado.');render()}
async function upPfp(){const f=$('#pfp').files[0];if(!f)return alert('Elige una foto');const url=await up(f);if(!url)return;const r=await sb.from('profiles').update({avatar_url:url}).eq('id',me.id);if(r.error)return alert(r.error.message);await loadMe();render();alert('Foto actualizada');}
V.retos=async()=>{const ps=await getPosts(200);const my=(ps||[]).filter(p=>p.user_id==me?.id);const sums={run:0,bike:0,swim:0,kilos:0};my.forEach(p=>{const s=(p.sport||'').toLowerCase();if(s.includes('running'))sums.run+=+p.km||0;if(s.includes('ciclismo')||s.includes('bici'))sums.bike+=+p.km||0;if(s.includes('nataci'))sums.swim+=+p.km||0;const mk=/Kilos:\s*([0-9.]+)/.exec(p.body||'');if(mk)sums.kilos+=+mk[1];});const getProg=r=>r.tipo=='racha'?(prof?.streak||0):(sums[r.tipo]||0);const extra=JSON.parse(localStorage.getItem('crks_retos_admin')||'[]');return '<h2>Retos - Actualizados con tu progreso</h2><p class=m>Tu progreso se actualiza con lo que publicas.</p>'+RETOS_IA.map(r=>{const pr=getProg(r);const pct=Math.min(100,Math.round(pr/r.meta*100));return '<div class=card><b>'+r.t+'</b><p class=m>'+r.d+'</p><div style=background:#222;height:10px;border-radius:99px;overflow:hidden><div style=width:'+pct+'%;height:10px;background:#A6FF00></div></div><p>Tu progreso: <b>'+pr+' / '+r.meta+'</b> - '+pct+'% '+(pct>=100?' - RETO COMPLETADO!':'')+'</p></div>';}).join('')+extra.map(r=>'<div class=card><b>'+esc(r.title)+'</b><p>'+esc(r.desc)+'</p></div>').join('');};
V.eventos=async()=>{const extra=JSON.parse(localStorage.getItem('crks_eventos_admin')||'[]');return '<h2>Eventos</h2><div class=card style=border:2px solid #A6FF00><div style=background:#A6FF00;color:#000;padding:6px 10px;border-radius:99px;display:inline-block;font-weight:800>EVENTO DESTACADO</div><h2>Reto Mandalay</h2><p><b>4 Horas de puro esfuerzo y luz de luna</b> aparte en Chizpa</p><p><b>Valor:</b> $140.000 hasta 15 de Enero, luego $160.000</p><button onclick="alert(\'Te avisaremos\')">Me interesa</button></div>'+extra.map(r=>'<div class=card><h3>'+esc(r.title)+'</h3><p>'+esc(r.desc)+'</p></div>').join('');};
V.tienda=async()=>{return '<h2>Merch</h2><p class=m>Prendas oficiales CRKS x HIGH. Personalizables.</p>'+MERCH.map(m=>'<div class=card><img loading=lazy decoding=async src='+m.img+' style=width:100%;max-height:420px;object-fit:cover;border-radius:10px><h3>'+m.name+'</h3><p class=m>'+m.desc+'</p><button onclick="alert(\'Para pedir, escribenos por Chats.\')">Pedir '+m.name+'</button></div>').join('');};
V.perfil=async()=>{const ps=await getPosts(200);const my=(ps||[]).filter(p=>p.user_id==me?.id);const sums={run:0,bike:0,swim:0,trail:0,kilos:0,workouts:my.length};my.forEach(p=>{const s=(p.sport||'').toLowerCase();if(s.includes('running'))sums.run+=+p.km||0;if(s.includes('ciclismo')||s.includes('bici'))sums.bike+=+p.km||0;if(s.includes('nataci'))sums.swim+=+p.km||0;if(s.includes('trail'))sums.trail+=+p.km||0;const mk=/Kilos:\s*([0-9.]+)/.exec(p.body||'');if(mk)sums.kilos+=+mk[1];});return '<h2>Mi perfil</h2><div class=card style=text-align:center><img src='+(prof?.avatar_url||'')+' onerror="this.style.display=\'none\'" style="width:200px;height:200px;object-fit:cover;border-radius:50%;border:4px solid #A6FF00;display:block;margin:0 auto 10px"><h2>'+esc(prof?.name||'Crack')+'</h2><p class=m>Wellness Club - CRKS</p><div class=row style=justify-content:center><div><b>'+sums.workouts+'</b><br><span class=m>Entrenos</span></div><div><b>'+(prof?.streak||0)+'</b><br><span class=m>Racha</span></div><div><b>'+(b||[]).length+'</b><br><span class=m>Insignias</span></div></div><label>Foto de perfil (200x200, redonda)<input id=pfp type=file accept="image/*"></label><button onclick="upPfp()">Actualizar foto</button></div><div class=card><h3>Frase de hoy</h3><p>'+fraseHoy()+'</p></div><div class=card><h3>Mis insignias</h3><div class=row>'+((b||[]).map(i=>'<span>'+i.badges.emoji+' '+esc(i.badges.name)+'</span>').join('')||'<span class=m>Aun no tienes insignias.</span>')+'</div></div><div class=card><h3>Mi ranking personal</h3><p>Running: <b>'+sums.run.toFixed(1)+' km</b></p><p>Bici: <b>'+sums.bike.toFixed(1)+' km</b></p><p>Nata: <b>'+sums.swim.toFixed(1)+' km</b></p><p>Trail: <b>'+sums.trail.toFixed(1)+' km</b></p><p>Kilos: <b>'+sums.kilos+' kg</b></p></div>';};
V.admin=()=>{return '<h2>Admin - Retos y Eventos</h2><p class=m>Desde aqui agregas retos y eventos. Solo estar logueado.</p><div class=card><h3>Agregar Reto</h3><input id=rt placeholder="Titulo"><textarea id=rd placeholder="Descripcion"></textarea><input id=rm type=number placeholder="Meta"><button onclick="saveRetoAdmin()">Guardar Reto</button></div><div class=card><h3>Agregar Evento</h3><input id=et placeholder="Titulo"><textarea id=ed placeholder="Descripcion"></textarea><input id=edt type=datetime-local><input id=ep placeholder="Lugar"><input id=epr placeholder="Precio"><button onclick="saveEventoAdmin()">Guardar Evento</button></div>';};

async function post(){let body=$('#pb').value.trim();if(!body)return alert('Cuentanos que entrenaste');if(!me)return alert('Inicia sesion para publicar');const f=$('#pf').files[0];let image_url=null;try{if(f)image_url=await up(f);}catch(e){image_url=null}const sport=$('#ps')?$('#ps').value:'Running';const km=$('#pk')?+$('#pk').value||0:0;let tiempoTxt=$('#pm')?$('#pm').value.trim():'';let minutes=0;try{minutes=parseTiempo(tiempoTxt)||0;}catch(e){minutes=0}const kilos=$('#pkilos')?+$('#pkilos').value||0:0;const pace=$('#ppace')?$('#ppace').value.trim():'';let extra=[];if(kilos)extra.push('Kilos: '+kilos);if(tiempoTxt)extra.push('Tiempo: '+tiempoTxt);if(pace)extra.push('Pace: '+pace);if(extra.length)body=body+'\n['+extra.join(' | ')+']';try{const r=await sb.from('posts').insert({user_id:me.id,body,sport,km,minutes,image_url});if(r.error)throw r.error;}catch(e){try{const r2=await sb.from('posts').insert({user_id:me.id,body,sport,km,minutes});if(r2.error)throw r2.error;}catch(e2){return alert('No se pudo publicar. Pega el SQL de posts. Error: '+e2.message);}}const t0=tab;if($('#pb'))$('#pb').value='';if($('#pk'))$('#pk').value='';if($('#pm'))$('#pm').value='';if($('#pkilos'))$('#pkilos').value='';if($('#ppace'))$('#ppace').value='';if($('#pf'))$('#pf').value='';await loadMe();tab=t0;render();alert('Entreno publicado! Ya quedo guardado.');}

V.retos=async()=>{const ps=await getPosts(200);const my=(ps||[]).filter(p=>p.user_id==me?.id);const sums={run:0,bike:0,swim:0,kilos:0,trail:0};my.forEach(p=>{const s=(p.sport||'').toLowerCase();if(s.includes('running'))sums.run+=+p.km||0;if(s.includes('ciclismo')||s.includes('bici'))sums.bike+=+p.km||0;if(s.includes('nataci'))sums.swim+=+p.km||0;if(s.includes('trail'))sums.trail+=+p.km||0;const mk=/Kilos:\s*([0-9.]+)/.exec(p.body||'');if(mk)sums.kilos+=+mk[1];});const getProg=r=>{if(r.tipo=='racha')return prof?.streak||0;if(r.tipo)return sums[r.tipo]||0;const tt=(r.title||r.t||'').toLowerCase();if(tt.includes('running')||tt.includes('run'))return sums.run;if(tt.includes('bici')||tt.includes('ciclismo'))return sums.bike;if(tt.includes('nataci'))return sums.swim;if(tt.includes('trail'))return sums.trail;if(tt.includes('press')||tt.includes('kilo')||tt.includes('kg')||tt.includes('fuerza'))return sums.kilos;return sums.run;};const extra=JSON.parse(localStorage.getItem('crks_retos_admin')||'[]');const all=[...RETOS_IA.map(r=>({title:r.t,desc:r.d,meta:r.meta,tipo:r.tipo})),...extra.map(r=>({title:r.title,desc:r.desc,meta:r.meta,tipo:r.tipo||''}))];return '<h2>Retos - Actualizados con tu progreso</h2><p class=m>La barra se llena con lo que publicas. El rayo avanza contigo.</p>'+all.map(r=>{const pr=getProg(r);const pct=Math.min(100,Math.round(pr/(r.meta||1)*100));return '<div class=card><b>'+esc(r.title)+'</b><p class=m>'+esc(r.desc||'')+'</p><div style=background:#222;height:16px;border-radius:99px;overflow:hidden;position:relative><div style=width:'+pct+'%;height:16px;background:#A6FF00;position:relative></div><span style=position:absolute;left:calc('+pct+'% - 14px);top:-2px;font-size:16px>⚡</span></div><p>Tu progreso: <b>'+pr+' / '+r.meta+'</b> - '+pct+'% '+(pct>=100?' - RETO COMPLETADO!':'')+'</p></div>';}).join('');};

V.perfil=async()=>{try{const ps=await getPosts(200);const my=(ps||[]).filter(p=>p.user_id==me?.id);const sums={run:0,bike:0,swim:0,trail:0,kilos:0,workouts:my.length};my.forEach(p=>{const s=(p.sport||'').toLowerCase();if(s.includes('running'))sums.run+=+p.km||0;if(s.includes('ciclismo')||s.includes('bici'))sums.bike+=+p.km||0;if(s.includes('nataci'))sums.swim+=+p.km||0;if(s.includes('trail'))sums.trail+=+p.km||0;const mk=/Kilos:\s*([0-9.]+)/.exec(p.body||'');if(mk)sums.kilos+=+mk[1];});const badges=(typeof b!=='undefined'?b:[]);return '<h2>Mi perfil</h2><div class=card style=text-align:center><img src='+(prof?.avatar_url||'')+' onerror="this.style.display=\'none\'" style="width:200px;height:200px;object-fit:cover;border-radius:50%;border:4px solid #A6FF00;display:block;margin:0 auto 10px"><h2>'+esc(prof?.name||'Crack')+'</h2><p class=m>Wellness Club - CRKS</p><div class=row style=justify-content:center><div><b>'+sums.workouts+'</b><br><span class=m>Entrenos</span></div><div><b>'+(prof?.streak||0)+'</b><br><span class=m>Racha</span></div><div><b>'+badges.length+'</b><br><span class=m>Insignias</span></div></div><label>Foto de perfil (200x200, redonda)<input id=pfp type=file accept="image/*"></label><button onclick="upPfp()">Actualizar foto</button></div><div class=card><h3>Frase del dia</h3><p>'+fraseHoy()+'</p></div><div class=card><h3>Mis insignias</h3><div class=row>'+(badges.map(i=>'<span>'+(i.badges?.emoji||'🏅')+' '+esc(i.badges?.name||'Insignia')+'</span>').join('')||'<span class=m>Aun no tienes insignias. Completa un reto.</span>')+'</div></div><div class=card><h3>Mi ranking personal</h3><p>Running: <b>'+sums.run.toFixed(1)+' km</b></p><p>Bici: <b>'+sums.bike.toFixed(1)+' km</b></p><p>Nata: <b>'+sums.swim.toFixed(1)+' km</b></p><p>Trail: <b>'+sums.trail.toFixed(1)+' km</b></p><p>Kilos: <b>'+sums.kilos+' kg</b></p><p>Racha: <b>'+(prof?.streak||0)+' dias</b></p></div>';}catch(e){return '<h2>Mi perfil</h2><div class=card><p>Error al cargar perfil: '+e.message+'</p><label>Foto<input id=pfp type=file accept="image/*"></label><button onclick="upPfp()">Actualizar foto</button></div>';}};
V.home=async()=>{const ps=await getPosts(20);const totalRun=(ps||[]).reduce((a,p)=>a+((p.sport||'').toLowerCase().includes('running')?+p.km||0:0),0);const slides=[{e:'🔥',t:'NACIMOS PARA RETARNOS.',d:'Entrena como un Crack. Comparte cada entreno, acepta retos y cuadra la proxima salida.'},{e:'🏃',t:'Entrenos en vivo',d:'Publica tu entreno, reacciona con corazon y comenta. Cada km suma.'},{e:'⚡',t:'Retos CRKS',d:'100 Km Running, 100 Kg Press Banca. Tu barra se llena sola con lo que publicas.'},{e:'🚀',t:'Chats de repente',d:'Salimos en 30 min, ¿quien va? Coordina en Chats y que se arme.'},{e:'👕',t:'Merch oficial',d:'Aurora, Cromo y Lava. Personalizables. Pide por WhatsApp.'},{e:'🌕',t:'Reto Mandalay',d:'4 horas de puro esfuerzo y luz de luna. Oferta $140.000 hasta 15 de Enero.'}];let idx=0;const html='<h2>Inicio</h2><div class=slide-wrap><div class=slide-track id=slideTrack>'+slides.map(s=>'<div class=slide><div style=font-size:2.5rem>'+s.e+'</div><b>'+s.t+'</b><p>'+s.d+'</p></div>').join('')+'</div></div><div style=text-align:center;margin:6px 0><button onclick="prevSlide()">◀</button> <button onclick="nextSlide()">▶</button></div><div class=card><b>Wellness Club - CRKS</b><p class=m>Entrena como un Crack. Comparte cada entreno, acepta retos y cuadra la proxima salida con los Cracks.</p><div class=row><button onclick="go(\'feed\')">Publica tu entreno</button><button onclick="go(\'meet\')">Arma un encuentro</button></div></div><div class=card><h3>Un poco de todo</h3><p>🏃 Entrenos recientes: '+(ps||[]).length+'</p><p>🔥 Km Running recientes: '+totalRun.toFixed(1)+' km</p><p>⚡ Retos activos: 6 + los de Admin</p><p>🌕 Proximo evento: Reto Mandalay - $140.000 hasta 15 Enero</p><p>👕 Merch: Aurora, Cromo, Lava</p><button onclick="go(\'chats\')">Ir a Chats 🚀</button></div>';setTimeout(()=>{let cur=0;window._slideInt=setInterval(()=>{cur=(cur+1)%slides.length;const el=document.getElementById('slideTrack');if(el)el.style.transform='translateX(-'+(cur*100)+'%)';},4000);},100);return const sb=supabase.createClient(SB_URL,SB_KEY),$=s=>document.querySelector(s),V={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>d?new Date(d).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'}):'';
let me=null,prof=null,isAdmin=false,tab='home';
sb.auth.onAuthStateChange((_,s)=>{me=s?.user||null;setTimeout(async()=>{if(me)await loadMe();render()},0)});

async function getPosts(limit){
 try{
  let r=await sb.from('posts').select('*,profiles(name,streak,avatar_url),likes(user_id),comments(id,body,profiles(name,avatar_url))').order('created_at',{ascending:false}).limit(limit||20);
  if(!r.error && r.data) return r.data;
 }catch(e){}
 try{
  let r2=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(limit||20);
  let ps=r2.data||[];
  try{let pr=await sb.from('profiles').select('id,name,streak,avatar_url');let m={};(pr.data||[]).forEach(x=>{m[x.id]=x});ps=ps.map(x=>({...x,profiles:m[x.user_id]||null,likes:[],comments:[]}));}catch(e){}
  return ps;
 }catch(e){return []}
}

function parseTiempo(txt){if(!txt)return 0;txt=String(txt).trim();if(!txt)return 0;if(/^[0-9]+(\.[0-9]+)?$/.test(txt))return Math.round(+txt);let parts=txt.split(':').map(Number);if(parts.some(isNaN))return 0;if(parts.length==2)return Math.round(parts[0]*60+parts[1]);if(parts.length==3)return Math.round(parts[0]*60+parts[1]+parts[2]/60);return 0}
function fmtDigital(min){min=Math.round(min||0);let h=Math.floor(min/60),m=min%60,s=0;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function fmtTiempo(min){return fmtDigital(min)}
async function getMeetups(){try{let r=await sb.from('meetups').select('*,profiles(name),meetup_going(user_id)').order('starts_at');if(!r.error&&r.data)return r.data}catch(e){}try{let r2=await sb.from('meetups').select('*').order('starts_at');return r2.data||[]}catch(e){return []}}
async function getProducts(){try{let r=await sb.from('products').select('*').order('created_at',{ascending:false});if(!r.error)return r.data||[]}catch(e){}return []}

async function loadMe(){const [p,a]=await Promise.all([sb.from('profiles').select('*').eq('id',me.id).single(),sb.rpc('is_admin')]);prof=p.data;isAdmin=a.data===true}
const go=t=>{tab=t;render()};
async function render(){
 if(!me)return $('#app').innerHTML=`<div class="auth-screen"><img class="auth-logo" src="${LOGO_URL}" alt="CRKS"><div class="auth-club">Wellness Club</div><div class="auth-fields" id="authFields"><label class="auth-label" for="n">Nombre:</label><div class="auth-field"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg><input id="n" placeholder="Como quieres que te conozcan" autocomplete="name"></div><label class="auth-label" for="e">Correo:</label><div class="auth-field"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><input id="e" type="email" placeholder="Correo" autocomplete="email"></div><label class="auth-label" for="p">Contraseña:</label><div class="auth-field"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="p" type="password" placeholder="Contraseña" autocomplete="current-password"><button type="button" class="auth-eye" aria-label="Ver contraseña" onclick="togglePass()">👁️</button></div></div><button class="auth-btn" id="authBtn" onclick="authSubmit()">VAMOS CRACKS</button><div class="auth-toggle" id="authToggle">¿No tienes cuenta? <b onclick="toggleAuthMode()">Regístrate</b></div><p class="auth-msg" id="msg"></p></div>`;
 const nav=[['home','Inicio'],['feed','Entrenos'],['chats','Chats 🚀'],['rank','Ranking'],['meet','Encuentros'],['retos','Retos'],['eventos','Eventos'],['tienda','Merch ⚡'],['perfil','Perfil']];if(isAdmin)nav.push(['admin','Admin']);
 const lastChat=JSON.parse(localStorage.getItem('crks_last_chat')||'null'); const notif=(lastChat&&Date.now()-lastChat.time<3600000)?`<div style="background:#A6FF00;color:#000;padding:10px 16px;font-weight:700;text-align:center">🚀 ÚLTIMO AVISO: ${esc(lastChat.name)}: ${esc(lastChat.text)} · <span style="text-decoration:underline;cursor:pointer" onclick="go('chats')">Ver chats</span></div>`:'';
 $('#app').innerHTML=notif+`<header><span style="font-weight:900;color:#fff">CRKS<span style="color:#A6FF00">⚡</span></span><b style="display:none">CRKS</b><span>🔥 ${prof?.streak||0} · ${esc(prof?.name)}</span><button onclick="sb.auth.signOut()">Salir</button></header><nav>${nav.map(([k,l])=>`<a class="${k==tab?'on':''}" onclick="go('${k}')">${l}</a>`).join('')}</nav><main id=v>Cargando…</main>`;
 try{$('#v').innerHTML=await V[tab]()}catch(e){$('#v').innerHTML='<p>Error: '+esc(e.message)+'</p>'}
}
const msg=t=>$('#msg').textContent=t;
let authMode='login';function toggleAuthMode(){authMode=authMode==='login'?'signup':'login';const b=document.getElementById('authBtn');if(b)b.textContent=authMode==='signup'?'CREAR MI CUENTA':'VAMOS CRACKS';const tg=document.getElementById('authToggle');if(tg)tg.innerHTML=authMode==='signup'?'¿Ya tienes cuenta? <b onclick="toggleAuthMode()">Entra</b>':'¿No tienes cuenta? <b onclick="toggleAuthMode()">Regístrate</b>';}function togglePass(){const i=document.getElementById('p');if(i)i.type=i.type==='password'?'text':'password';}
async function authSubmit(){if(authMode==='signup'){await signup();}else{await login();}}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value});if(error)msg('No se pudo entrar: '+error.message)}
async function signup(){const{data,error}=await sb.auth.signUp({email:$('#e').value.trim(),password:$('#p').value,options:{data:{name:$('#n').value.trim()}}});if(error)return msg(error.message);if(!data.session)msg('Cuenta creada. Revisa tu correo para confirmarla y luego entra.')}
async function up(f){if(!f)return null;try{const bmp=await createImageBitmap(f);const max=800;let w=bmp.width,h=bmp.height;if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.55));const name=me.id+'/'+Date.now()+'.jpg';const{error}=await sb.storage.from('media').upload(name,blob,{upsert:true,contentType:'image/jpeg'});if(error){alert('No se pudo subir la foto: '+error.message);return null}return sb.storage.from('media').getPublicUrl(name).data.publicUrl}catch(e){const name=me.id+'/'+Date.now()+'-'+f.name.replace(/\s/g,'_');const{error}=await sb.storage.from('media').upload(name,f,{upsert:true});if(error){alert('No se pudo subir la foto: '+error.message);return null}return sb.storage.from('media').getPublicUrl(name).data.publicUrl}}
async function del(t,id){if(!confirm('¿Eliminar?'))return;const{error}=await sb.from(t).delete().eq('id',id);if(error)alert(error.message);render()}
const img=u=>u?`<img loading="lazy" decoding="async" src="${esc(u)}" alt="">`:'';

V.home=async()=>{
 const ps=await getPosts(20);
 const ms=(await sb.from('meetups').select('*,profiles(name),meetup_going(user_id)').order('starts_at').limit(3)).data||[];
 const pr=(await sb.from('products').select('*').order('created_at',{ascending:false}).limit(4)).data||[];
 const ch=(await sb.from('challenges').select('*').order('created_at',{ascending:false}).limit(3)).data||[];
 return `<div class="landing"><div class="l-hero"><span style="font-weight:900;color:#fff">CRKS<span style="color:#A6FF00">⚡</span></span><div class="l-eyebrow">Wellness Club - CRKS</div><h1>NACIMOS<br>PARA<br><span class="green">RETARNOS.</span></h1><p>Entrena como un Crack. Comparte cada entreno, acepta retos y cuadra la proxima salida con los Cracks</p><div class="l-btns"><button class="l-btn-primary" onclick="go('feed')">\uD83D\uDCF7 PUBLICA TU ENTRENO</button><button class="l-btn-ghost" onclick="go('meet')">\uD83E\uDD1D ARMA UN ENCUENTRO</button></div></div><div class="l-ticker"><span>PREP\u00c1RATE \u26a1 CRKS \u26a1 ENTRENA \u26a1 COMPARTE \u26a1 SUP\u00c9RATE \u26a1 CRKS \u26a1&nbsp;&nbsp;</span></div></div><div class="home-sec"><div class="miracha"><div><div style="opacity:.8">TU RACHA</div><b>\uD83D\uDD25 ${prof?.streak||0} d\u00edas</b> <small>\u2022 R\u00e9cord ${prof?.best_streak||0}</small></div><button class="l-btn-primary" onclick="go('feed')">+ Publicar</button></div><h2>\uD83D\uDD25 Entrenos de los Cracks</h2>${((ps||[]).map(p=>{const nm=esc(p.profiles?.name||'Crack');const ini=nm.charAt(0).toUpperCase();const av=p.profiles?.avatar_url?`<img loading="lazy" decoding="async" src="${esc(p.profiles.avatar_url)}">`:ini;const lk=(p.likes||[]).some(x=>x.user_id==me.id);return `<div class="post-card"><div class="post-top"><div class="post-avatar">${av}</div><div style="flex:1"><div style="font-weight:700">${nm}</div><div class="m">${fd(p.created_at)} \u2022 ${esc(p.sport||'')}</div></div><span class="streak-badge">\uD83D\uDD25 ${p.profiles?.streak||0} d\u00edas</span></div><p>${esc(p.body)}</p>${img(p.image_url)}<div class="post-stats"><span>\uD83C\uDFC3 ${+p.km} km</span><span>\u23f1\uFE0F ${fmtDigital(p.minutes)}</span></div><div class="row"><button class=g onclick="like('${p.id}',${lk})">${lk?'\u2764\uFE0F':'\uD83E\uDD0D'} ${(p.likes||[]).length}</button><button class=g onclick="cmt('${p.id}')">\uD83D\uDCAC ${(p.comments||[]).length}</button>${p.user_id==me.id||isAdmin?`<button class=g onclick="del('posts','${p.id}')">Borrar</button>`:''}</div>${(p.comments||[]).map(c=>`<small><b>${esc(c.profiles?.name)}:</b> ${esc(c.body)}</small><br>`).join('')}</div>`}).join('')||'<p class=m>A\u00fan no hay entrenos. Publica el primero.</p>')}<button class=g onclick="go('feed')">Publicar / Ver todo \u2192</button><h2>\uD83E\uDD1D Pr\u00f3ximos encuentros</h2>${((ms||[]).map(m=>`<div class="card"><h3>${esc(m.title)}</h3><div class=m>${esc(m.place)} \u2022 ${fd(m.starts_at)} \u2022 por ${esc(m.profiles?.name||'')}</div></div>`).join('')||'<p class=m>No hay encuentros programados.</p>')}<button class=g onclick="go('meet')">Ver encuentros \u2192</button><h2>\uD83C\uDFC6 Retos</h2>${((ch||[]).map(r=>`<div class="card">${img(r.cover_url)}<h3>${esc(r.title)}</h3><p>${esc(r.description)}</p></div>`).join('')||'<p class=m>No hay retos activos.</p>')}<h2>\uD83D\uDECD\uFE0F Merch / Tienda</h2>${((pr||[]).filter(r=>r.active!==false).map(r=>`<div class="card">${img(r.image_url)}<h3>${esc(r.name)}</h3><p>${esc(r.description)}</p><b>${esc(r.price)}</b></div>`).join('')||'<p class=m>Pronto m\u00e1s merch CRKS.</p>')}<button class=g onclick="go('tienda')">Ver Merch ⚡ \u2192</button></div>`;
};

V.feed=async()=>{
 const ps=await getPosts(50);
 const sports=['Running','Ciclismo','Natación','Trail','Fuerza','Movilidad'];
 const cards=(ps||[]).map(x=>{
  const nm=esc(x.profiles?.name||'Crack'); const ini=nm.charAt(0).toUpperCase();
  const av=x.profiles?.avatar_url?`<img loading="lazy" decoding="async" src="${esc(x.profiles.avatar_url)}">`:ini;
  const lk=(x.likes||[]).some(y=>y.user_id==me?.id);
  const isMine=me && x.user_id==me.id;
  const paceTxt=x.pace?esc(x.pace):(x.km&&x.minutes? (Math.floor(x.minutes/x.km)+':'+String(Math.round((x.minutes/x.km%1)*60)).padStart(2,'0')+'/km'):'—');
  return `<article class="post-card entreno-card">
   <div class="post-top"><div class="post-avatar">${av}</div><div style="flex:1"><div style="font-weight:700">${nm}</div><div class="m">${fd(x.created_at)} • ${esc(x.sport||'')} • ${+x.km||0} km</div></div>${isMine?`<button class="g" style="color:#ff6b6b" onclick="deletePost('${x.id}')">🗑️</button>`:''}</div>
   <p>${esc(x.body)}</p>${img(x.image_url)}
   <div class="post-stats"><span>⏱️ ${fmtDigital(x.minutes)}</span><span>⚡ Pace ${paceTxt}</span>${x.kilos?`<span>🏋️ ${x.kilos} kg</span>`:''}</div>
   <div class="row"><button class=g onclick="like('${x.id}',${lk})">${lk?'❤️':'🤍'} ${(x.likes||[]).length}</button><button class=g onclick="document.getElementById('cmt-${x.id}').focus()">💬 ${(x.comments||[]).length}</button><button class=g onclick="sharePost('${x.id}')">📤 Compartir</button></div>
   ${(x.comments||[]).slice(-3).map(c=>`<small><b>${esc(c.profiles?.name||'Crack')}:</b> ${esc(c.body)}</small><br>`).join('')}
   <div class="row" style="margin-top:8px"><input id="cmt-${x.id}" maxlength="120" placeholder="Comenta corto… (máx. 120)" style="flex:1"><button class=g onclick="cmtInline('${x.id}')">Enviar</button></div>
  </article>`}).join('')||'<p class=m>Aún no hay entrenos. Publica el primero.</p>';
 return `<div>
  <h1 style="text-align:center;margin:6px 0 2px">Entrenos</h1><p class=m style="text-align:center">Publica, reacciona, comenta y comparte. Todos los entrenos viven aquí.</p>
  <div class="card publish-card entreno-publish" style="border:2px solid #A6FF00">
   <div class="publish-title">PUBLICA TU <span>ENTRENO</span></div><div class="publish-sub">Cada kilómetro cuenta. Comparte tu racha con los Cracks.</div>
   <label class=m>¿Qué entrenaste?</label><textarea id=pb rows=2 placeholder="Describe tu sesión de hoy…"></textarea>
   <label class=m>Deporte</label><div class="row" style="flex-wrap:wrap;gap:6px" id="sportPills">${sports.map((s,i)=>`<button type="button" class="g sport-pill ${i==0?'active':''}" data-sport="${s}" onclick="pickSport('${s}',this)">${s}</button>`).join('')}</div>
   <select id=ps style="display:none"><option>Running</option><option>Ciclismo</option><option>Natación</option><option>Trail</option><option>Fuerza</option><option>Movilidad</option></select>
   <div class="row"><div style="flex:1"><label class=m>Km</label><input id=pk type="number" step="0.1" min="0" placeholder="0.0"></div><div style="flex:1"><label class=m>Tiempo</label><input id=pm placeholder="00:00:00" inputmode="numeric"></div></div>
   <div class="row"><div style="flex:1"><label class=m>Kilos (opcional)</label><input id=pkilos type="number" step="0.5" min="0" placeholder="—"></div><div style="flex:1"><label class=m>Pace (opcional)</label><input id=ppace placeholder="— ej: 5:09/km"></div></div>
   <label class=m>Foto</label><label class="g" style="display:block;text-align:center;padding:12px;border:1.5px dashed #666;cursor:pointer">📷 Añadir foto<input id=pf type="file" accept="image/*" style="display:none" onchange="previewEntreno(this)"></label><div id="entrenoPreview"></div>
   <button class="l-btn-primary" style="width:100%;padding:15px;margin-top:10px" onclick="post()">Publicar entreno</button><small class=m>La foto se comprime a 800px para que cargue liviano.</small>
  </div>
  <h2>Entrenos recientes</h2>${cards}</div>`;
};
window.window.pickSport=function(s,el){var sel=document.getElementById('ps');if(sel)sel.value=s;document.querySelectorAll('.sport-card').forEach(function(c){var on=c.dataset.sport===s;c.classList.toggle('active',on);c.style.border=on?'2px solid #A6FF00':'1px solid #333';c.style.background=on?'#1a2a00':'#111';});document.querySelectorAll('.sport-pill').forEach(function(b){b.classList.toggle('active',b.dataset.sport===s);});function show(id,on){var b=document.getElementById(id);if(b)b.style.display=on?'block':'none';}var isGym=(s==='Gym'||s==='Calistenia');show('muscleBlock',isGym);show('routineBlock',isGym);show('altimetriaBlock',s==='Trail');show('mtbBlock',s==='MTB');show('natacionBlock',s==='Natación');show('kmBlock',!isGym);show('tiempoBlock',true);show('paceBlock',!isGym);var st=document.getElementById('entrenoStatus');if(st)st.textContent='Deporte: '+s;};
window.pickMuscle=function(m,el){if(!el)return;el.classList.toggle('active');var on=el.classList.contains('active');el.style.background=on?'#A6FF00':'#1a1a1a';el.style.color=on?'#000':'#fff';el.style.borderColor=on?'#A6FF00':'#444';el.style.fontWeight=on?'800':'600';};
window.pickTerreno=function(m,el){document.querySelectorAll('.terreno-pill').forEach(function(b){var on=(b===el);b.classList.toggle('active',on);b.style.background=on?'#A6FF00':'#1a1a1a';b.style.color=on?'#000':'#fff';b.style.borderColor=on?'#A6FF00':'#444';b.style.fontWeight=on?'800':'600';});};
window.pickLugar=function(m,el){if(!el)return;el.classList.toggle('active');var on=el.classList.contains('active');el.style.background=on?'#A6FF00':'#1a1a1a';el.style.color=on?'#000':'#fff';el.style.borderColor=on?'#A6FF00':'#444';el.style.fontWeight=on?'800':'600';};

window.previewEntreno=(inp)=>{const f=inp.files&&inp.files[0];const box=document.getElementById('entrenoPreview');if(!f||!box)return;const url=URL.createObjectURL(f);box.innerHTML=`<img loading="lazy" src="${url}" style="width:100%;border-radius:12px;margin-top:8px">`;};
async function cmtInline(id){const inp=document.getElementById('cmt-'+id);if(!inp)return;const body=inp.value.trim();if(!body)return;if(!me)return alert('Inicia sesión');try{const r=await sb.from('comments').insert({post_id:id,user_id:me.id,body});if(r.error)throw r.error;render();}catch(e){alert('No se pudo comentar. Error: '+e.message);}}
async function deletePost(id){if(!confirm('¿Borrar tu entreno?'))return;try{const r=await sb.from('posts').delete().eq('id',id).eq('user_id',me.id);if(r.error)throw r.error;render();}catch(e){alert('No se pudo borrar. Error: '+e.message);}}

V.rank=async()=>{
 const selSport=(window.__rankSport||'Running');
 const ps=await getPosts(200);
 const pr=(await sb.from('profiles').select('id,name,avatar_url,streak')).data||[];
 const mp={};pr.forEach(x=>{mp[x.id]=x;});
 function normSport(s){
   s=String(s||'').toLowerCase();
   if(s.includes('mtb')||s.includes('montaña')||s.includes('montana'))return 'MTB';
   if(s.includes('ciclismo')||s.includes('bici')||s.includes('bike')||s.includes('ruta'))return 'Ciclismo';
   if(s.includes('nataci')||s.includes('swim')||s.includes('piscina')||s.includes('mar'))return 'Natación';
   if(s.includes('trail'))return 'Trail';
   if(s.includes('running')||s.includes('run')||s.includes('correr'))return 'Running';
   return '';
 }
 const sports=[{k:'Running',e:'🏃'},{k:'Trail',e:'🥾'},{k:'Ciclismo',e:'🚴'},{k:'MTB',e:'🚵'},{k:'Natación',e:'🏊'}];
 const agg={};
 (ps||[]).forEach(p=>{
   const ns=normSport(p.sport);if(!ns||ns!==selSport)return;
   const uid=p.user_id||'sin-usuario';if(!agg[uid])agg[uid]={uid,name:(mp[uid]?.name)||(p.profiles?.name)||'Crack',avatar:(mp[uid]?.avatar_url)||(p.profiles?.avatar_url)||'',streak:mp[uid]?.streak||p.profiles?.streak||0,count:0,km:0,minutes:0};
   const a=agg[uid];a.count++;a.km+=+p.km||0;a.minutes+=+p.minutes||0;
 });
 const arr=Object.values(agg).sort((a,b)=>(b.count-a.count)||(b.km-a.km)||(b.minutes-a.minutes));
 const pills=sports.map(s=>`<span onclick="setRankSport('${s.k}')" style="display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:${s.k===selSport?'800':'600'};background:${s.k===selSport?'#A6FF00':'#1a1a1a'};color:${s.k===selSport?'#000':'#fff'};border:1px solid ${s.k===selSport?'#A6FF00':'#444'};white-space:nowrap">${s.e} ${s.k}</span>`).join('');
 const selMeta=sports.find(s=>s.k===selSport)||sports[0];
 function av(a,sz){return a.avatar?`<img loading="lazy" src="${esc(a.avatar)}" style="width:${sz}px;height:${sz}px;border-radius:50%;object-fit:cover;border:2px solid #A6FF00">`:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:${Math.round(sz/2.4)}px;border:2px solid #A6FF00">${esc((a.name||'C').charAt(0).toUpperCase())}</div>`;}
 function statLine(a){if(selSport==='Natación')return `${a.count} entrenos • ${(a.km||0).toFixed(1)} km • ${fmtDigital(a.minutes)}`;return `${a.count} entrenos • ${(a.km||0).toFixed(1)} km • ${fmtDigital(a.minutes)}`;}
 let podium='';
 if(arr.length>=3){
   const first=arr[0],second=arr[1],third=arr[2];
   podium=`<div style="position:relative;background:linear-gradient(180deg,rgba(166,255,0,.14),rgba(0,0,0,0) 70%),radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.18),transparent 60%);border:1px solid #222;border-radius:18px;padding:18px 10px 14px;margin:14px 0;overflow:hidden">
   <div style="text-align:center;font-size:11px;letter-spacing:2px;opacity:.7">PODIO · ${esc(selSport.toUpperCase())}</div>
   <div style="display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:12px">
     <div style="flex:1;text-align:center"><div style="font-size:22px">🥈</div><div style="display:flex;justify-content:center;margin:6px 0">${av(second,56)}</div><div style="font-weight:800;font-size:13px;line-height:1.2">${esc(second.name)}</div><div style="font-size:11px;opacity:.8;margin-top:3px">${statLine(second)}</div><div style="font-size:11px;opacity:.7">🔥 ${second.streak} días</div><div style="background:#1a1a1a;border:1px solid #333;border-radius:10px 10px 0 0;padding:14px 4px 8px;margin-top:8px;font-weight:900">2</div></div>
     <div style="flex:1.25;text-align:center"><div style="font-size:28px">👑</div><div style="display:flex;justify-content:center;margin:6px 0">${av(first,76)}</div><div style="font-weight:900;font-size:15px;line-height:1.2">${esc(first.name)}</div><div style="font-size:11px;opacity:.8;margin-top:3px">${statLine(first)}</div><div style="font-size:11px;opacity:.7">🔥 ${first.streak} días</div><div style="background:#A6FF00;color:#000;border-radius:12px 12px 0 0;padding:22px 4px 10px;margin-top:8px;font-weight:900;font-size:18px">1</div></div>
     <div style="flex:1;text-align:center"><div style="font-size:22px">🥉</div><div style="display:flex;justify-content:center;margin:6px 0">${av(third,56)}</div><div style="font-weight:800;font-size:13px;line-height:1.2">${esc(third.name)}</div><div style="font-size:11px;opacity:.8;margin-top:3px">${statLine(third)}</div><div style="font-size:11px;opacity:.7">🔥 ${third.streak} días</div><div style="background:#1a1a1a;border:1px solid #333;border-radius:10px 10px 0 0;padding:10px 4px 8px;margin-top:8px;font-weight:900">3</div></div>
   </div></div>`;
 } else if(arr.length>0){
   podium=`<div style="background:#111;border:1px solid #222;border-radius:16px;padding:16px;margin:14px 0;text-align:center"><div style="font-size:26px">👑</div><div style="display:flex;justify-content:center;margin:8px 0">${av(arr[0],68)}</div><div style="font-weight:900">${esc(arr[0].name)}</div><div style="font-size:12px;opacity:.8;margin-top:4px">${statLine(arr[0])} • 🔥 ${arr[0].streak} días</div><div style="font-size:12px;opacity:.7;margin-top:6px">Faltan cracks para completar el podio. Publica tu entreno y sube.</div></div>`;
 }
 const rest=arr.slice(arr.length>=3?3:1).map((a,i)=>{
   const pos=(arr.length>=3?4:2)+i;
   return `<div style="display:flex;align-items:center;gap:10px;background:#111;border:1px solid #222;border-radius:14px;padding:10px 12px;margin-bottom:8px"><div style="width:28px;text-align:center;font-weight:900;opacity:.9">${pos}</div>${av(a,40)}<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.name)}</div><div style="font-size:12px;opacity:.8">${statLine(a)}</div></div><div style="text-align:right;font-size:11px;opacity:.8">🔥 ${a.streak} días</div></div>`;
 }).join('');
 return `<div><h2 style="text-align:center;margin:6px 0 2px">🏆 RANKING CRKS</h2><p class="m" style="text-align:center">Se compara todos los entrenos publicados, por deporte. Cada deporte suma aparte.</p><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0">${pills}</div><div style="text-align:center"><span style="display:inline-block;background:#1a1a1a;border:1px solid #333;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700">${selMeta.e} ${esc(selSport)} · ${arr.length} crack${arr.length===1?'':'s'} con entrenos publicados</span></div>${podium}${arr.length> (arr.length>=3?3:1)?`<h3 style="margin:16px 0 10px">Del ${arr.length>=3?'4º':'2º'} al ${Math.min(arr.length,10)}º</h3>${rest}`:''}${!arr.length?`<div class="card" style="text-align:center;margin-top:14px"><p style="font-weight:800">Aún nadie ha publicado en ${esc(selSport)}.</p><p class="m">Publica tu primer entreno en ${esc(selSport)} y sé el primero del podio.</p><button class="l-btn-primary" onclick="go('feed')">Publicar entreno →</button></div>`:''}<p class="m" style="text-align:center;margin-top:12px">Orden: 1º más entrenos publicados en ${esc(selSport)} · En empate, más km · Luego, más tiempo. Solo cuentan entrenos publicados, no borrados.</p></div>`;
};
window.setRankSport=function(s){window.__rankSport=s;render();};
V.meet=async()=>{
 const ms=await getMeetups();
 return`<div class=card><h3>Proponer encuentro</h3><p class=m>Libre para cualquiera. Cualquier crack puede invitar, no solo Admin. Al crearlo, todos lo ven.</p><input id=mt placeholder="Título (ej. Rodada del domingo)"><input id=mp placeholder="Lugar"><input id=md type=datetime-local><button onclick="mk()">Crear encuentro</button></div>`+
 ((ms||[]).map(m=>{const g=m.meetup_going.some(x=>x.user_id==me.id);return`<div class=card><h3>${esc(m.title)}</h3><div class=m>${esc(m.place)} · ${fd(m.starts_at)} · por ${esc(m.profiles?.name)}</div><div class=row><button class=${g?'g':''} onclick="going('${m.id}',${g})">${g?'Ya no voy':'Voy'} (${m.meetup_going.length})</button>${m.user_id==me.id||isAdmin?`<button class=g onclick="del('meetups','${m.id}')">Borrar</button>`:''}<button class=g onclick="shareMeet('${m.id}','${esc(m.title)}','${esc(m.place)}','${fd(m.starts_at)}')">📤 Compartir</button></div></div>`}).join('')||'<p class=m>No hay encuentros programados.</p>')};
async function mk(){const title=$('#mt').value.trim();if(!title)return alert('Pon un título');const d=$('#md').value;const r=await sb.from('meetups').insert({user_id:me.id,title,place:$('#mp').value,starts_at:d?new Date(d).toISOString():null});if(r.error)return alert('No se pudo crear el encuentro: '+r.error.message);alert('✅ Encuentro creado. ¡Todos lo ven en tiempo real!');render()}
async function shareMeet(id,title,place,when){const txt='🚀 Encuentro CRKS: '+title+' · '+place+' · '+when+' · Únete en crks-team.vercel.app';try{if(navigator.share){await navigator.share({title:'Encuentro CRKS',text:txt})}else{await navigator.clipboard.writeText(txt);alert('¡Copiado! Pégalo donde quieras: '+txt)}}catch(e){prompt('Copia este mensaje para compartir:',txt)}}
async function going(id,g){await(g?sb.from('meetup_going').delete().match({meetup_id:id,user_id:me.id}):sb.from('meetup_going').insert({meetup_id:id,user_id:me.id}));render()}

const list=async(t,f,o)=>{const{data}=await sb.from(t).select('*').order(o,{ascending:false});return(data||[]).map(f).join('')||'<p class=m>Aún no hay nada publicado aquí.</p>'};

const CHAT_TTL_MS=6*3600*1000;
function chatCutoffISO(){return new Date(Date.now()-CHAT_TTL_MS).toISOString();}
function chatLeftLabel(ts){var left=CHAT_TTL_MS-(Date.now()-ts);if(left<=0)return 'Se borra ahora';var h=Math.floor(left/3600000),m=Math.floor((left%3600000)/60000);return 'Se borra en '+(h>0?h+'h ':'')+m+'m';}
async function cleanupOldChats(){try{await sb.from('chats').delete().lt('created_at',chatCutoffISO()).not('body','ilike','[[VOY:%').not('body','ilike','[[MEET:%');}catch(e){try{await sb.from('chats').delete().lt('created_at',chatCutoffISO());}catch(e2){}}try{var arr=JSON.parse(localStorage.getItem('crks_chats')||'[]');var fresh=arr.filter(function(m){var ts=m.ts||0;return !ts||(Date.now()-ts)<CHAT_TTL_MS;});if(fresh.length!==arr.length)localStorage.setItem('crks_chats',JSON.stringify(fresh));}catch(e){}}
V.chats=async()=>{
 cleanupOldChats();
 let msgs=[];
 try{let r=await sb.from('chats').select('*,profiles(name)').order('created_at',{ascending:false}).limit(50); if(!r.error&&r.data) msgs=r.data.filter(function(x){return !(x.body||'').startsWith('[[MEET:')&&!(x.body||'').startsWith('[[VOY:');}).map(x=>({name:x.profiles?.name||'Crack',text:x.body,ts:new Date(x.created_at).getTime(),time:new Date(x.created_at).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})})).filter(function(m){return (Date.now()-m.ts)<CHAT_TTL_MS;}).reverse();}catch(e){}
 if(!msgs.length){ try{var _lm=JSON.parse(localStorage.getItem('crks_chats')||'[]'); msgs=_lm.filter(function(m){var ts=m.ts||0;return !ts||(Date.now()-ts)<CHAT_TTL_MS;}).filter(function(m){return !(m.text||'').startsWith('[[MEET:')&&!(m.text||'').startsWith('[[VOY:');}).map(function(m){return {name:m.name||'Crack',text:m.text,ts:m.ts||Date.now(),time:m.time||''};});}catch(e){} }
 const list=msgs.length?msgs.map(m=>`<div class="chat-msg"><b>${esc(m.name)}:</b><span>${esc(m.text)}</span><small class=m> ${esc(m.time)} · ⏳ ${esc(chatLeftLabel(m.ts||Date.now()))}</small></div>`).join(''):'<p class=m>Aún no hay mensajes. Sé el primero en avisar un entreno de repente.</p>';
 return `<h2>Chats 🚀 Entrenos de repente</h2><div class="card" style="background:#A6FF00;color:#000;border:0"><b>🚀 LLAMADO A LA ACCIÓN:</b> Cuando alguien escribe aquí, todos los cracks lo ven. Si ves un mensaje nuevo, responde y cuadra la salida.</div><p class=m>Espacio aparte para coordinar en cualquier momento. Ej: "Salimos en 30 min a 10k, ¿quién va?"</p><p class=m>⏳ Cada mensaje se borra solo a las 6 horas de enviado, para que Chats siempre sea de lo que está pasando ahora.</p><div class="chat-box" id="chatbox">${list}</div><input id="chatInput" placeholder="Escribe: Salimos en 30 min a... ¿quién va?"><div class=row><button onclick="sendChat()">Enviar 🚀</button><button class=g onclick="suddenTraining()">🚀 Avisar entreno de repente</button></div><p class=m>Los mensajes se guardan para todos los usuarios. Cada vez que alguien escribe, aparece arriba como aviso para que todos lo vean.</p>`;
};
async function sendChat(){const v=$('#chatInput').value.trim();if(!v)return;const r=await sb.from('chats').insert({user_id:me.id,body:v});if(r.error){const msgs=JSON.parse(localStorage.getItem('crks_chats')||'[]');msgs.push({name:prof?.name||'Crack',text:v,ts:Date.now(),time:new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})});localStorage.setItem('crks_chats',JSON.stringify(msgs.slice(-100)));}localStorage.setItem('crks_last_chat',JSON.stringify({name:prof?.name||'Crack',text:v,time:Date.now()}));alert('🚀 Mensaje enviado para todos los cracks. ¡Que se arme la salida!');render()}
async function suddenTraining(){const msg=prompt('¿Qué entreno de repente? Ej: Salimos en 30 min, 10k en el parque');if(!msg)return;const full='🚀 ENTRENO DE REPENTE: '+msg;const r=await sb.from('chats').insert({user_id:me.id,body:full});if(r.error){const msgs=JSON.parse(localStorage.getItem('crks_chats')||'[]');msgs.push({name:prof?.name||'Crack',text:full,ts:Date.now(),time:new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})});localStorage.setItem('crks_chats',JSON.stringify(msgs.slice(-100)));}localStorage.setItem('crks_last_chat',JSON.stringify({name:prof?.name||'Crack',text:full,time:Date.now()}));tab='chats';render()}

V.retos=()=>list('challenges',r=>`<div class=card>${img(r.cover_url)}<h3>${esc(r.title)}</h3><p>${esc(r.description)}</p><div class=m>Meta: ${+r.goal_km} km · ${r.starts_on||''} → ${r.ends_on||''}</div></div>`,'created_at').then(h=>'<h2>Retos</h2>'+h);
V.eventos=()=>list('events',r=>`<div class=card>${img(r.image_url)}<h3>${esc(r.title)}</h3><div class=m>${fd(r.starts_at)} · ${esc(r.place)}</div><p>${esc(r.description)}</p><b>${esc(r.price)}</b> <small>${esc(r.includes)}</small></div>`,'created_at').then(h=>'<h2>Eventos</h2>'+h);
V.tienda=()=>list('products',r=>r.active?`<div class=card>${img(r.image_url)}<h3>${esc(r.name)}</h3><p>${esc(r.description)}</p><b>${esc(r.price)}</b></div>`:'','sort').then(h=>'<h2>Merch ⚡</h2>'+h);

const FRASES=['Hoy te superas a ti mismo, no a nadie más.','Un kilómetro más es una excusa menos.','Los cracks no esperan motivación, la crean.','Tu yo de mañana te está mirando entrenar hoy.','No se trata de ser el más rápido, sino de no parar.','Cada entreno es una promesa que te cumples.','El dolor pasa, la racha queda.'];
function fraseHoy(){const d=new Date();const idx=Math.floor((d.getTime()/86400000)%FRASES.length);return FRASES[idx]}

V.perfil=async()=>{
 const{data:b}=await sb.from('user_badges').select('badges(name,emoji,description)').eq('user_id',me.id);const x=prof||{};
 return`<h2>Mi perfil</h2><div class="card" style="background:#000;color:#fff;border:2px solid #A6FF00"><div style="color:#A6FF00;font-weight:700">FRASE DE HOY</div><div style="font-size:1.2rem;font-weight:700">“${fraseHoy()}”</div><div style="margin-top:8px">🔥 Racha: ${prof?.streak||0} días · Récord: ${prof?.best_streak||0}</div></div><div class="card"><h3>🏅 Mis insignias</h3><div class=row>${(b||[]).map(i=>`<span title="${esc(i.badges.description)}">${i.badges.emoji} ${esc(i.badges.name)}</span>`).join('')||'<span class=m>Aún no tienes insignias. Completa un reto o publica tu primer entreno.</span>'}</div></div><div class=card>${img(x.avatar_url)}<label>Nombre<input id=fn value="${esc(x.name)}"></label><label>Deporte<input id=fs value="${esc(x.sport)}"></label><label>Nivel<input id=fl value="${esc(x.level)}"></label><label>Sobre mí<textarea id=fb rows=2>${esc(x.bio)}</textarea></label><label>Foto de perfil (se verá en tus entrenos y comentarios)<input id=fa type=file accept="image/*"></label><button onclick="save()">Guardar cambios</button></div><div class=card><h3>Racha: ${x.streak||0} días <small>(récord ${x.best_streak||0})</small></h3><div class=row>${(b||[]).map(i=>`<span title="${esc(i.badges.description)}">${i.badges.emoji} ${esc(i.badges.name)}</span>`).join('')||'<span class=m>Publica un entreno para ganar tu primera insignia.</span>'}</div></div>`};
async function save(){const o={name:$('#fn').value,sport:$('#fs').value,level:$('#fl').value,bio:$('#fb').value,onboarded:true};const a=await up($('#fa').files[0]);if(a)o.avatar_url=a;const{error}=await sb.from('profiles').update(o).eq('id',me.id);if(error)alert(error.message);await loadMe();render()}

const F={challenges:['Retos',[['title','Título'],['description','Descripción'],['goal_km','Meta (km)','number'],['starts_on','Inicio','date'],['ends_on','Fin','date'],['cover_url','Portada','file']]],events:['Eventos',[['title','Título'],['starts_at','Fecha y hora','datetime-local'],['place','Lugar'],['description','Descripción'],['price','Precio'],['includes','Qué incluye'],['image_url','Imagen','file']]],products:['Productos',[['name','Nombre'],['description','Descripción'],['price','Precio'],['image_url','Imagen','file']]]};
V.admin=async()=>{let h='<h2>Panel de administrador</h2>';
 for(const t in F){const{data}=await sb.from(t).select('*').order('created_at',{ascending:false});
  h+=`<div class=card><h3>${F[t][0]}</h3>${F[t][1].map(([k,l,ty='text'])=>`<label>${l}<input id="${t}_${k}" type=${ty} ${ty=='file'?'accept="image/*"':''}></label>`).join('')}<button onclick="add('${t}')">Agregar</button>${(data||[]).map(r=>`<div class=row><span style="flex:1">${esc(r.title||r.name)}</span><button class=g onclick="del('${t}','${r.id}')">Borrar</button></div>`).join('')}</div>`}
 const[{data:u},{data:b}]=await Promise.all([sb.from('profiles').select('id,name'),sb.from('badges').select('id,name,emoji')]);
 return h+`<div class=card><h3>Otorgar insignia</h3><select id=bu>${(u||[]).map(x=>`<option value="${x.id}">${esc(x.name)}`).join('')}</select><select id=bb>${(b||[]).map(x=>`<option value="${x.id}">${x.emoji} ${esc(x.name)}`).join('')}</select><button onclick="award()">Otorgar</button></div>`};
async function add(t){const o={};for(const[k,,ty]of F[t][1]){const e=$(`#${t}_${k}`);if(ty=='file')o[k]=await up(e.files[0]);else if(e.value)o[k]=ty=='datetime-local'?new Date(e.value).toISOString():ty=='number'?+e.value:e.value}const{error}=await sb.from(t).insert(o);if(error)return alert(error.message);render()}
async function award(){const{error}=await sb.from('user_badges').insert({user_id:$('#bu').value,badge_id:+$('#bb').value});if(error)alert(error.message);else alert('Insignia otorgada')}

const RETOS_IA=[{t:'100 Km Running en menos de un mes',d:'Suma 100 km en Running en 30 dias.',meta:100,tipo:'run',emoji:'x'},{t:'100 Kg en Press Banca',d:'Registra 100 kg en Fuerza.',meta:100,tipo:'kilos',emoji:'x'},{t:'50 Km en Bici en una semana',d:'Suma 50 km en Ciclismo.',meta:50,tipo:'bike',emoji:'x'},{t:'5 Km Natacion en un mes',d:'Suma 5 km en Natacion.',meta:5,tipo:'swim',emoji:'x'},{t:'15 dias seguidos',d:'Publica 15 dias seguidos.',meta:15,tipo:'racha',emoji:'x'},{t:'200 Kg totales en Fuerza',d:'Suma 200 kg en Fuerza.',meta:200,tipo:'kilos',emoji:'x'}];
async function getPosts(n=80){try{let r=await sb.from('posts').select('*,profiles(name,avatar_url),likes(user_id),comments(id,body,profiles(name,avatar_url))').order('created_at',{ascending:false}).limit(n);if(!r.error&&r.data)return r.data}catch(e){}try{let r2=await sb.from('posts').select('*,profiles(name,avatar_url)').order('created_at',{ascending:false}).limit(n);let posts=r2.data||[];try{let lk=await sb.from('likes').select('post_id,user_id');let cm=await sb.from('comments').select('id,post_id,body,profiles(name,avatar_url)');posts.forEach(pp=>{pp.likes=(lk.data||[]).filter(x=>x.post_id==pp.id);pp.comments=(cm.data||[]).filter(x=>x.post_id==pp.id)});}catch(e){posts.forEach(pp=>{pp.likes=[];pp.comments=[]})}return posts}catch(e){return []}}
async function like(id,l){if(!me)return alert('Inicia sesion');try{const r=await(l?sb.from('likes').delete().match({post_id:id,user_id:me.id}):sb.from('likes').insert({post_id:id,user_id:me.id}));if(r.error)throw r.error;render()}catch(e){alert('No se pudo reaccionar. Pega el SQL de likes. Error: '+e.message)}}
async function cmt(id){if(!me)return alert('Inicia sesion');const body=prompt('Tu comentario');if(!body)return;try{const r=await sb.from('comments').insert({post_id:id,user_id:me.id,body});if(r.error)throw r.error;render()}catch(e){alert('No se pudo comentar. Error: '+e.message)}}
async function mk(){const title=$('#mt').value.trim();if(!title)return alert('Pon un titulo');if(!me)return alert('Inicia sesion');try{const d=$('#md').value;const r=await sb.from('meetups').insert({user_id:me.id,title,place:$('#mp').value,starts_at:d?new Date(d).toISOString():null});if(r.error)throw r.error;alert('Encuentro creado. Todos lo ven!');render()}catch(e){alert('No se pudo crear. Pega el SQL de meetups. Error: '+e.message)}}
async function joinMeet(id){if(!me)return alert('Inicia sesion');try{const r=await sb.from('meetup_going').insert({meetup_id:id,user_id:me.id});if(r.error)throw r.error;alert('Te sumaste!');render()}catch(e){alert('No se pudo unir. Error: '+e.message)}}
async function commentMeet(id){const body=prompt('Tu comentario para este encuentro');if(!body)return;const arr=JSON.parse(localStorage.getItem('crks_meet_comments')||'[]');arr.push({meet:id,name:prof?.name||'Crack',body});localStorage.setItem('crks_meet_comments',JSON.stringify(arr));render()}

<script>

(function(){
if(window.__crksFinalEntrenos) return; window.__crksFinalEntrenos=true;
// --- Tiempo con espacios: 10 : 10 : 10 ---
window.formatTiempo=function(inp){if(!inp)return;let d=(inp.value||'').replace(/\D/g,'').slice(0,6);let out=d;if(d.length>4)out=d.slice(0,2)+' : '+d.slice(2,4)+' : '+d.slice(4);else if(d.length>2)out=d.slice(0,2)+' : '+d.slice(2);inp.value=out;};
window.parseTiempo=function(txt){if(!txt)return 0;txt=String(txt||'').replace(/\s/g,'').trim();if(!txt)return 0;if(/^\d+$/.test(txt)){txt=txt.padStart(6,'0');txt=txt.slice(0,2)+':'+txt.slice(2,4)+':'+txt.slice(4);}let p=txt.split(':').map(x=>+x||0);return Math.round((p[0]||0)*60+Math.min(59,p[1]||0)+Math.min(59,p[2]||0)/60);};
window.fmtDigital=function(min){let tot=Math.round((min||0)*60);let h=Math.floor(tot/3600),m=Math.floor((tot%3600)/60),s=tot%60;return String(h).padStart(2,'0')+' : '+String(m).padStart(2,'0')+' : '+String(s).padStart(2,'0');};
window.timeBox=function(inp,nextId){if(!inp)return;inp.value=(inp.value||'').replace(/\D/g,'').slice(0,2);if(inp.value.length==2&&nextId){let n=document.getElementById(nextId);if(n)n.focus();}syncTiempo();syncPace();};
window.timeBack=function(ev,prevId){if(ev.key==='Backspace'&&!ev.target.value&&prevId){let p=document.getElementById(prevId);if(p)p.focus();}};
window.getTiempo=function(){let h=(document.getElementById('th')?.value||'').trim(),m=(document.getElementById('tm')?.value||'').trim(),s=(document.getElementById('ts')?.value||'').trim();if(!h&&!m&&!s)return '';if(!h||!m||!s)return 'INCOMPLETO';return String(+h).padStart(2,'0')+' : '+String(Math.min(59,+m)).padStart(2,'0')+' : '+String(Math.min(59,+s)).padStart(2,'0');};
window.getPace=function(){let m=(document.getElementById('paceM')?.value||'').trim(),s=(document.getElementById('paceS')?.value||'').trim();if(!m&&!s)return '';if(!m||!s)return 'INCOMPLETO';return String(+m).padStart(2,'0')+' : '+String(Math.min(59,+s)).padStart(2,'0')+' /km';};
window.syncTiempo=function(){let v=getTiempo();let pm=document.getElementById('pm');if(pm)pm.value=(v==='INCOMPLETO'?'':v);return v;};
window.syncPace=function(){let v=getPace();let pp=document.getElementById('ppace');if(pp)pp.value=(v==='INCOMPLETO'?'':v);return v;};

window.up=async function(f){if(!f)return null;try{let blob=null;try{let dataUrl=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});let imgEl=await new Promise((res,rej)=>{let im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=dataUrl;});let max=800,w=imgEl.naturalWidth||imgEl.width,h=imgEl.naturalHeight||imgEl.height;if(w>max||h>max){let rr=Math.min(max/w,max/h);w=Math.round(w*rr);h=Math.round(h*rr);}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(imgEl,0,0,w,h);blob=await new Promise(res=>c.toBlob(res,'image/jpeg',0.55));}catch(e){blob=null;}let toUpload=blob||f;let name=(me&&me.id?me.id:'anon')+'/'+Date.now()+'.jpg';let upRes=await sb.storage.from('media').upload(name,toUpload,{upsert:true,contentType:'image/jpeg'});if(upRes.error)return null;return sb.storage.from('media').getPublicUrl(name).data.publicUrl;}catch(e){return null;}};
// --- getPosts: mezcla Supabase + guardado local (para que nunca se pierda un entreno) ---
let __origGetPosts=window.getPosts;
window.getPosts=async function(limit){
  var fromSb=[];
  try{var r=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(limit||50);if(r&&!r.error&&r.data)fromSb=r.data;else if(r&&r.error)window.__lastPostsError=r.error.message||String(r.error);}
  catch(e){window.__lastPostsError=e.message||String(e);}
  try{
    var _need=(fromSb||[]).filter(function(x){return !x.profiles;});
    if(_need.length){
      var _ids=[];_need.forEach(function(x){if(x.user_id&&_ids.indexOf(x.user_id)<0)_ids.push(x.user_id);});
      if(_ids.length){
        var _pr=await sb.from('profiles').select('id,name,avatar_url,streak').in('id',_ids);
        if(_pr&&!_pr.error&&_pr.data){var _pmap={};_pr.data.forEach(function(pp){_pmap[pp.id]=pp;});(fromSb||[]).forEach(function(x){if(!x.profiles&&_pmap[x.user_id])x.profiles=_pmap[x.user_id];});}
      }
      if(me&&prof){(fromSb||[]).forEach(function(x){if(!x.profiles&&x.user_id===me.id)x.profiles=prof;});}
    }
  }catch(e){}
  // LIKE + COMENTAR: traer likes y comments por separado (sin join) y pegarlos a cada post
  try{
    if(fromSb&&fromSb.length){
      var _ids=fromSb.map(function(x){return x.id;});
      var _likesBy={};try{var _rl=await sb.from('likes').select('*').in('post_id',_ids);if(_rl&&!_rl.error&&_rl.data){_rl.data.forEach(function(l){_likesBy[l.post_id]=_likesBy[l.post_id]||[];_likesBy[l.post_id].push(l);});}}catch(e){}
      var _cmtsBy={};try{var _rc=await sb.from('comments').select('*').in('post_id',_ids);if(_rc&&!_rc.error&&_rc.data){_rc.data.forEach(function(c){c.body=c.body||c.content||c.text||c.comment||'';_cmtsBy[c.post_id]=_cmtsBy[c.post_id]||[];_cmtsBy[c.post_id].push(c);});}}catch(e){}
      fromSb.forEach(function(x){
        var _lk=_likesBy[x.id]||[];var _cm=_cmtsBy[x.id]||[];
        // Unir con los que ya venían (si el join viejo los trajo), sin duplicar por user_id / id
        var _allLikes=(x.likes||[]).slice();_lk.forEach(function(l){if(!_allLikes.some(function(z){return z.user_id===l.user_id&&z.post_id===l.post_id;}))_allLikes.push(l);});x.likes=_allLikes;
        var _allCmts=(x.comments||[]).slice();_cm.forEach(function(c){if(!_allCmts.some(function(z){return String(z.id)===String(c.id);}))_allCmts.push(c);});x.comments=_allCmts;
      });
      // Perfiles de quienes comentaron
      try{
      var _cids=[];
      (fromSb||[]).forEach(function(x){(x.comments||[]).forEach(function(c){if(c.user_id&&_cids.indexOf(c.user_id)<0)_cids.push(c.user_id);});});
      if(_cids.length){
        var _pc=await sb.from('profiles').select('id,name,avatar_url').in('id',_cids);
        if(_pc&&!_pc.error&&_pc.data){
          var _cmap={};_pc.data.forEach(function(pp){_cmap[pp.id]=pp;});
          (fromSb||[]).forEach(function(x){(x.comments||[]).forEach(function(c){if(!c.profiles&&_cmap[c.user_id])c.profiles=_cmap[c.user_id];if(!c.profiles&&me&&c.user_id===me.id)c.profiles=prof;});});
        }
      }
    }catch(e){}

    }
  }catch(e){}
  fromSb.sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at);});
  return fromSb.slice(0,limit||50);
};
window.diagCRKS=async function(){
  var out=[];
  try{var s=await sb.auth.getSession();out.push('Sesión: '+(s&&s.data&&s.data.session?'OK':'SIN SESIÓN'));out.push('auth.uid: '+((s&&s.data&&s.data.session&&s.data.session.user&&s.data.session.user.id)||'—'));}catch(e){out.push('Sesión error: '+e.message);}
  out.push('me.id: '+((me&&me.id)||'—'));
  out.push('perfil: '+((prof&&prof.name)||'—'));
  try{var rp=await sb.from('posts').select('id',{count:'exact'}).limit(1);out.push('Leer posts: '+(rp.error?('FALLA: '+rp.error.message):('OK, total aprox: '+(rp.count!=null?rp.count:'?'))));}catch(e){out.push('Leer posts error: '+e.message);}
  try{var rl=await sb.from('likes').select('id').limit(1);out.push('Leer likes: '+(rl.error?('FALLA: '+rl.error.message):'OK'));}catch(e){out.push('Leer likes error: '+e.message);}
  try{var rc=await sb.from('comments').select('id').limit(1);out.push('Leer comments: '+(rc.error?('FALLA: '+rc.error.message):'OK'));}catch(e){out.push('Leer comments error: '+e.message);}
  var msg=out.join('\n');
  var el=document.getElementById('entrenoStatus');if(el)el.textContent=msg;
  alert('DIAGNÓSTICO CRKS\n\n'+msg+'\n\nSi algo dice FALLA o SIN SESIÓN, mándame captura de esto.');
};
// --- Publicar: 3 intentos Supabase + respaldo local ---
window.post=async function(){
  var btn=document.getElementById('btnPublicarEntreno');
  try{
    if(btn&&btn.disabled)return;if(btn){btn.disabled=true;btn.textContent='Publicando…';}
    setStatus('Publicando tu entreno…');
    if(!me){try{await sb.auth.getSession();}catch(e){}try{await loadMe();}catch(e){}if(!me)throw new Error('Inicia sesión para publicar. Si acabas de entrar, espera 2 segundos y vuelve a intentar.');}
    var sport0=document.getElementById('ps')?.value||document.querySelector('.sport-card.active')?.dataset?.sport||'Running';
    var body=(document.getElementById('pb')?.value||'').trim();if(!body)body='Entreno de '+sport0;
    var tiempoTxt=syncTiempo();if(!tiempoTxt||tiempoTxt==='INCOMPLETO')throw new Error('Completa el Tiempo: HH : MM : SS. Ejemplo: 10 : 10 : 10');
    var pace=syncPace();
    if(sport0==='Gym'||sport0==='Calistenia'){pace='';}
    else if(sport0==='MTB'&&pace==='INCOMPLETO'){pace='';}
    else if(pace==='INCOMPLETO')throw new Error('Completa el Pace: MM : SS. Ejemplo: 05 : 09');
    var km=(sport0==='Gym'||sport0==='Calistenia')?0:(+((document.getElementById('pk')?.value)||0)||0);
    if(!pace){try{var mins0=parseTiempo(tiempoTxt);if(km&&mins0){var sec=Math.round((mins0/km)*60);pace=String(Math.floor(sec/60)).padStart(2,'0')+' : '+String(sec%60).padStart(2,'0')+' /km';}}catch(e){}}
    var image_url=null,fotoFallida=false;var f=document.getElementById('pf')?.files?.[0];
    if(f){try{image_url=await up(f);if(!image_url)fotoFallida=true;}catch(e){fotoFallida=true;}}
    var minutes=Math.round(parseTiempo(tiempoTxt)||0);
    var _muscle=[].slice.call(document.querySelectorAll('.muscle-pill.active')).map(function(b){return b.dataset.muscle||b.textContent.trim();}).filter(Boolean).join(' + ');
    var _showMuscle=(sport0==='Gym'||sport0==='Calistenia');
    var _terrenoEl=document.querySelector('.terreno-pill.active');var _terreno=_terrenoEl?_terrenoEl.dataset.terreno||_terrenoEl.textContent.trim():'';
    var _desnivel=(document.getElementById('desnivel')?.value||'').trim();
    var _rutina=(document.getElementById('rutina')?.value||'').trim();
    var _altimetria=(document.getElementById('altimetria')?.value||'').trim();
    var _lugar=[].slice.call(document.querySelectorAll('.lugar-pill.active')).map(function(b){return b.dataset.lugar||b.textContent.trim();}).filter(Boolean).join(' + ');
    var extra=[];if(tiempoTxt)extra.push('Tiempo: '+tiempoTxt);if(pace)extra.push('Pace: '+pace);
    if(_showMuscle&&_muscle)extra.push('Músculo: '+_muscle);
    if(sport0==='Trail'&&_altimetria)extra.push('Altimetría: '+_altimetria+' m');
    if(sport0==='MTB'&&_desnivel)extra.push('Desnivel: '+_desnivel+' m');
    if(sport0==='MTB'&&_terreno)extra.push('Terreno: '+_terreno);
    if(sport0==='Natación'&&_lugar)extra.push('Lugar: '+_lugar);
    if(extra.length)body=body+'\n['+extra.join(' | ')+']';
    if(_showMuscle&&_rutina)body=body+'\nRUTINA:\n'+_rutina;
    minutes=Math.round(minutes||0);km=Math.round((km||0)*100)/100;
    // UN SOLO INTENTO PRINCIPAL + 1 RESPALDO MÍNIMO. Sin espejos locales que dupliquen o escondan.
    var saved=false,lastErr=null;
    var attempts=[{user_id:me.id,body,sport:sport0,km:km,minutes:minutes,image_url:image_url},{user_id:me.id,body,sport:sport0,km:Math.round(km||0),minutes:minutes},{user_id:me.id,body:body}];
    for(var ai=0;ai<attempts.length;ai++){try{var r=await sb.from('posts').insert(attempts[ai]);if(!r.error){saved=true;break;}lastErr=r.error;}catch(e){lastErr=e;}}
    if(!saved)throw new Error('Supabase no dejó guardar: '+(lastErr&&lastErr.message?lastErr.message:lastErr)+'\n\nSi dice RLS / policy / permission, pega el SQL de APAGAR RLS que te doy abajo. Ese SQL es el que hace que no falle.');
    // Verificación: leer de vuelta. Si no se puede leer, el problema es SELECT, no el publicar.
    var _readOk=false;try{var _chk=await sb.from('posts').select('id').eq('user_id',me.id).order('created_at',{ascending:false}).limit(1);if(_chk&&!_chk.error&&_chk.data&&_chk.data.length)_readOk=true;else if(_chk&&_chk.error)lastErr=_chk.error;}catch(e){lastErr=e;}
    if(!_readOk)throw new Error('Se guardó pero NO se puede leer de vuelta: '+(lastErr&&lastErr.message?lastErr.message:lastErr)+'\n\nPega el SQL de APAGAR RLS de posts.');
    setStatus('✅ Entreno publicado para todos');
    ['pb','pk'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});['th','tm','ts','paceM','paceS'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
    var rEl=document.getElementById('rutina');if(rEl)rEl.value='';var pf=document.getElementById('pf');if(pf)pf.value='';var pv=document.getElementById('entrenoPreview');if(pv)pv.innerHTML='';
    try{await loadMe();}catch(e){}
    try{await render();}catch(e){}
    if(fotoFallida)alert('Entreno publicado ✅ pero la foto no subió. Revisa el bucket media o publica sin foto.');
    else alert('Entreno publicado para todos ✅');
  }catch(err){setStatus('❌ No se pudo publicar: '+(err&&err.message?err.message:err));alert('No se pudo publicar:\n\n'+(err&&err.message?err.message:err)+'\n\nToca Diagnóstico en Entrenos y mándame captura.');}
  finally{var b=document.getElementById('btnPublicarEntreno');if(b){b.disabled=false;b.textContent='Publicar entreno';}}
};
// Delegación: si el onclick falla, el clic igual publica
document.addEventListener('click',function(e){if(e.target&&e.target.closest){var card=e.target.closest('.sport-card');if(card){e.preventDefault();pickSport(card.dataset.sport,card);return;}var mp=e.target.closest('.muscle-pill');if(mp){e.preventDefault();pickMuscle(mp.dataset.muscle,mp);return;}var tp=e.target.closest('.terreno-pill');if(tp){e.preventDefault();pickTerreno(tp.dataset.terreno,tp);return;}var lp=e.target.closest('.lugar-pill');if(lp){e.preventDefault();pickLugar(lp.dataset.lugar,lp);return;}}if(e.target&&e.target.closest&&e.target.closest('#btnPublicarEntreno')){e.preventDefault();post();}});
// --- Reaccionar / comentar corto ---
window.like=async function(id,l){
  if(!me){try{await sb.auth.getSession();}catch(e){}try{await loadMe();}catch(e){}if(!me)return alert('Inicia sesión para reaccionar');}
  try{
    var r;
    if(l){r=await sb.from('likes').delete().match({post_id:id,user_id:me.id});if(r.error)throw r.error;}
    else{
      r=await sb.from('likes').insert({post_id:id,user_id:me.id});
      // Si ya le habías dado like (duplicado), lo quitamos para que actúe como toggle
      if(r.error&&/duplicate|unique|already|existe/i.test(r.error.message||'')){var rd=await sb.from('likes').delete().match({post_id:id,user_id:me.id});if(rd.error)throw rd.error;}
      else if(r.error)throw r.error;
    }
    await render();
  }catch(e){alert('No se pudo reaccionar. Error exacto: '+e.message+'\n\nSi dice RLS / policy, pega el SQL de APAGAR RLS de likes. Si dice columna, mándame captura de este error.');}
};
window.cmtInline=async function(id){
  var inp=document.getElementById('cmt-'+id);if(!inp)return;var body=(inp.value||'').trim();
  if(!body)return alert('Escribe un comentario corto');if(body.length>120)return alert('Máx. 120 caracteres');
  if(!me){try{await sb.auth.getSession();}catch(e){}try{await loadMe();}catch(e){}if(!me)return alert('Inicia sesión para comentar');}
  try{
    var lastErr=null,saved=false;
    var _tries=[{post_id:id,user_id:me.id,body:body},{post_id:id,user_id:me.id,content:body},{post_id:id,user_id:me.id,text:body},{post_id:id,user_id:me.id,comment:body},{post_id:id,user_id:me.id,body:body,content:body}];
    for(var _ti=0;_ti<_tries.length;_ti++){try{var _r=await sb.from('comments').insert(_tries[_ti]);if(!_r.error){saved=true;break;}lastErr=_r.error;}catch(e){lastErr=e;if(/column|columna|does not exist|no existe/i.test(e.message||''))continue;else break;}}
    if(!saved)throw lastErr||new Error('No se pudo guardar el comentario');
    inp.value='';await render();
  }catch(e){alert('No se pudo comentar. Error exacto: '+e.message+'\n\nSi dice RLS / policy, pega el SQL de APAGAR RLS de comments. Si dice columna, mándame captura de este error.');}
};

<label class=m>¿Qué entrenaste hoy? <small style="font-weight:400">(opcional, para complementar)</small></label><textarea id=pb rows=2 placeholder="Opcional: cuenta algo de tu sesión…"></textarea>

FF00':'#444'}!important;border-radius:999px!important;padding:8px 14px!important;font-size:13px!important;font-weight:${i==1?'800':'600'}!important;line-height:1.2!important;cursor:pointer;white-space:nowrap!important">${m}</span>`).join('')}</div></div><div id="natacionBlock" style="display:none;margin-top:12px"><label class=m>🏊 ¿Dónde nadaste?</label><div class="row" id="lugarPills" style="flex-wrap:wrap;gap:6px">${['Piscina','Mar','Río','Lago'].map((m,i)=>`<span class="lugar-pill ${i==0?'active':''}" data-lugar="${m}" style="display:inline-flex!important;align-items:center;justify-content:center;width:auto!important;flex:0 0 auto!important;background:${i==0?'#A6FF00':'#1a1a1a'}!important;color:${i==0?'#000':'#fff'}!important;border:1px solid ${i==0?'#A6FF00':'#444'}!important;border-radius:999px!important;padding:8px 14px!important;font-size:13px!important;font-weight:${i==0?'800':'600'}!important;line-height:1.2!important;cursor:pointer;white-space:nowrap!important">${m}</span>`).join('')}</div></div>

window.deletePost=async function(id){
  if(!me){try{await sb.auth.getSession();}catch(e){}try{await loadMe();}catch(e){}if(!me)return alert('Inicia sesión para borrar');}
  if(!confirm('¿Borrar tu entreno?'))return;
  try{
    // Primero los hijos, si no el borrar falla por llave foránea y parece que "en algunos perfiles no borra"
    try{await sb.from('likes').delete().eq('post_id',id);}catch(e){}
    try{await sb.from('comments').delete().eq('post_id',id);}catch(e){}
    var r=await sb.from('posts').delete().eq('id',id);
    if(r.error)throw r.error;
    await render();
    alert('Entreno borrado ✅');
  }catch(e){alert('No se pudo borrar. Error exacto: '+e.message+'\n\nSi dice RLS / policy, pega el SQL de APAGAR RLS de posts.');}
};

@keyframes crks-pulse-ring{0%{box-shadow:0 0 0 0 rgba(166,255,0,.6)}100%{box-shadow:0 0 0 14px rgba(166,255,0,0)}}
.crks-badge-unlocked{animation:crks-float 2.2s ease-in-out infinite, crks-shine 3s ease-in-out infinite}
.crks-badge-near{animation:crks-bounce 1.2s ease-in-out infinite}
.crks-badge-new{animation:crks-pop .6s ease-out, crks-pulse-ring 1.2s ease-out 2}
.crks-progress-fill{transition:width .8s ease}

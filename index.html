<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRKS · Run Cracks Colombia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#e4ebe6;--card:#fff;--ink:#12261f;--g:#1f5d46;--y:#f2b705;--mut:#5d6f67}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a15;--card:#17271f;--ink:#e8f0eb;--g:#3f9b77;--mut:#93a89d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;margin:.2em 0;letter-spacing:.01em}h1{font-size:3rem}h2{font-size:1.8rem}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--g);color:#fff}header b{font:700 1.7rem 'Barlow Condensed',sans-serif;flex:1}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:2px solid var(--g)}nav a{padding:12px 16px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--mut)}nav a.on{color:var(--ink);box-shadow:inset 0 -4px var(--y)}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:6px;padding:14px;margin:0 0 12px;display:block}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,textarea,select{width:100%;padding:10px;margin:4px 0;border:1px solid var(--mut);border-radius:4px;background:transparent;color:inherit;font:inherit}
.row input,.row select{flex:1;min-width:90px}label{display:block;font-size:.85rem;color:var(--mut)}
button{padding:9px 14px;border:0;border-radius:4px;background:var(--y);color:#12261f;font:600 1rem Barlow,sans-serif;cursor:pointer}button.g{background:transparent;color:var(--ink);outline:1px solid var(--mut)}
header button{background:#fff3}small,.m{color:var(--mut)}img{max-width:100%;border-radius:4px;margin:6px 0}
.auth{max-width:380px;margin:12vh auto}:focus-visible{outline:3px solid var(--y);outline-offset:2px}

/* LANDING CRKS */
.landing{background:#070807;color:#fff;font-family:'Barlow Condensed',Impact,sans-serif}
.l-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#000}
.l-logo{font-size:2rem;font-weight:700;letter-spacing:.02em;color:#B4FF00}
.l-logo span{color:#B4FF00}
.l-unir{background:#B4FF00;color:#000;border:0;border-radius:999px;padding:10px 28px;font:700 1rem 'Barlow Condensed',sans-serif;letter-spacing:.12em;cursor:pointer}
.l-hero{padding:38px 20px 28px;max-width:900px}
.l-eyebrow{color:#B4FF00;letter-spacing:.28em;font-size:.95rem;font-weight:700}
.l-hero h1{font-size:clamp(3.2rem,10vw,6.5rem);line-height:.88;margin:14px 0 16px;letter-spacing:.01em}
.l-hero h1 .green{color:#B4FF00}
.l-hero p{font-family:Barlow,sans-serif;color:#d6ddd8;font-size:1.1rem;max-width:560px;line-height:1.5}
.l-btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.l-btn-primary{background:#B4FF00;color:#000;border:0;border-radius:999px;padding:13px 20px;font:700 1rem 'Barlow Condensed',sans-serif;letter-spacing:.06em;cursor:pointer}
.l-btn-ghost{background:transparent;color:#fff;border:1.5px solid #fff;border-radius:999px;padding:12px 20px;font:700 1rem 'Barlow Condensed',sans-serif;letter-spacing:.06em;cursor:pointer}
.l-ticker{background:#B4FF00;color:#000;overflow:hidden;white-space:nowrap;padding:10px 0;font-weight:700;letter-spacing:.08em}
.l-ticker span{display:inline-block;padding-right:18px;animation:tick 18s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.l-auth-wrap{max-width:900px;margin:0 auto;padding:28px 18px 40px}

.home-sec{max-width:900px;margin:0 auto;padding:18px}
.home-sec h2{font-size:1.9rem;margin:18px 0 10px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.home-grid{grid-template-columns:1fr}}
.home-card{background:var(--card);border-radius:8px;padding:14px}
.home-card img{width:100%;border-radius:6px}

.post-card{background:var(--card);border-radius:12px;padding:14px;margin:0 0 14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.post-top{display:flex;gap:10px;align-items:center}
.post-avatar{width:44px;height:44px;border-radius:50%;background:#12261f;color:#B4FF00;display:flex;align-items:center;justify-content:center;font:700 1.2rem 'Barlow Condensed',sans-serif;flex-shrink:0;overflow:hidden}
.post-avatar img{width:100%;height:100%;object-fit:cover}
.post-name{font-weight:700;line-height:1.1}
.post-meta{font-size:.85rem;color:var(--mut)}
.streak-badge{background:#fff3cd;border:1px solid #f2b705;border-radius:999px;padding:2px 9px;font-size:.82rem;font-weight:700;white-space:nowrap}
.post-stats{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;font-weight:700}
.post-stats span{background:#eef4ef;padding:6px 10px;border-radius:999px;font-size:.9rem}
.miracha{background:#12261f;color:#fff;border-radius:12px;padding:14px;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.miracha b{color:#B4FF00;font-size:1.3rem}
</style></head><body><div id="app"></div>
<script>
const SB_URL='https://oqyjbradimrzhrcawept.supabase.co',SB_KEY='sb_publishable_f1rIroehbs0PaGBu2DCqkA_MBA4CtLP';
const sb=supabase.createClient(SB_URL,SB_KEY),$=s=>document.querySelector(s),V={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>d?new Date(d).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'}):'';
let me=null,prof=null,isAdmin=false,tab='home';
sb.auth.onAuthStateChange((_,s)=>{me=s?.user||null;setTimeout(async()=>{if(me)await loadMe();render()},0)});
async function loadMe(){const [p,a]=await Promise.all([sb.from('profiles').select('*').eq('id',me.id).single(),sb.rpc('is_admin')]);prof=p.data;isAdmin=a.data===true}
const go=t=>{tab=t;render()};
async function render(){
 if(!me)return $('#app').innerHTML=`<div class="card auth"><h1>CRKS</h1><p class=m>Run Cracks Colombia. Entrena, publica y suma racha.</p><input id=n placeholder="Tu nombre (solo para crear cuenta)"><input id=e type=email placeholder="Correo"><input id=p type=password placeholder="Contraseña (mínimo 6)"><div class=row><button onclick="login()">Entrar</button><button class=g onclick="signup()">Crear cuenta</button></div><p id=msg></p></div>`;

 const nav=[['home','Inicio'],['feed','Entrenos'],['rank','Ranking'],['meet','Encuentros'],['retos','Retos'],['eventos','Eventos'],['tienda','Tienda'],['perfil','Perfil']];if(isAdmin)nav.push(['admin','Admin']);
 $('#app').innerHTML=`<header><b>CRKS</b><span>🔥 ${prof?.streak||0} · ${esc(prof?.name)}</span><button onclick="sb.auth.signOut()">Salir</button></header><nav>${nav.map(([k,l])=>`<a class="${k==tab?'on':''}" onclick="go('${k}')">${l}</a>`).join('')}</nav><main id=v>Cargando…</main>`;
 try{$('#v').innerHTML=await V[tab]()}catch(e){$('#v').innerHTML='<p>Error: '+esc(e.message)+'</p>'}
}
const msg=t=>$('#msg').textContent=t;
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value});if(error)msg('No se pudo entrar: '+error.message)}
async function signup(){const{data,error}=await sb.auth.signUp({email:$('#e').value.trim(),password:$('#p').value,options:{data:{name:$('#n').value.trim()}}});if(error)return msg(error.message);if(!data.session)msg('Cuenta creada. Revisa tu correo para confirmarla y luego entra.')}
async function up(f){if(!f)return null;const p=`${me.id}/${Date.now()}-${f.name.replace(/[^\w.]/g,'_')}`;const{error}=await sb.storage.from('media').upload(p,f);if(error){alert(error.message);return null}return sb.storage.from('media').getPublicUrl(p).data.publicUrl}
async function del(t,id){if(!confirm('¿Eliminar?'))return;const{error}=await sb.from(t).delete().eq('id',id);if(error)alert(error.message);render()}
const img=u=>u?`<img src="${esc(u)}" alt="">`:'';


V.home=async()=>{
 const[{data:ps},{data:ms},{data:pr},{data:ch}]=await Promise.all([
  sb.from('posts').select('*,profiles(name,streak,avatar_url),likes(user_id),comments(id,body,profiles(name))').order('created_at',{ascending:false}).limit(20),
  sb.from('meetups').select('*,profiles(name),meetup_going(user_id)').order('starts_at').limit(3),
  sb.from('products').select('*').order('created_at',{ascending:false}).limit(4),
  sb.from('challenges').select('*').order('created_at',{ascending:false}).limit(3)
 ]);
 return `<div class="landing"><div class="l-hero" style="padding-top:22px"><div class="l-eyebrow">CLUB DEPORTIVO • COLOMBIA</div><h1>NACIMOS<br>PARA<br><span class="green">RENDIR.</span></h1><p>Entrena con tus cracks. Comparte cada kilómetro, acepta retos y cuadra la próxima salida con los Cracks.</p><div class="l-btns"><button class="l-btn-primary" onclick="go('feed')">📷 PUBLICA TU ENTRENO</button><button class="l-btn-ghost" onclick="go('meet')">🤝 ARMA UN ENCUENTRO</button></div></div><div class="l-ticker"><span>PREPÁRATE ⚡ CRKS ⚡ ENTRENA ⚡ COMPARTE ⚡ SUPÉRATE ⚡ CRKS ⚡ ENTRENA ⚡ COMPARTE ⚡ SUPÉRATE ⚡&nbsp;&nbsp;PREPÁRATE ⚡ CRKS ⚡ ENTRENA ⚡ COMPARTE ⚡ SUPÉRATE ⚡ CRKS ⚡ ENTRENA ⚡ COMPARTE ⚡ SUPÉRATE ⚡</span></div></div>
 <div class="home-sec"><div class="miracha"><div><div style="opacity:.8">TU RACHA</div><b>🔥 ${prof?.streak||0} días</b> <small>· Récord ${prof?.best_streak||0}</small></div><button class="l-btn-primary" onclick="go('feed')">+ Publicar</button></div><h2>🔥 Entrenos de los Cracks</h2>${((ps||[]).map(p=>{const nm=esc(p.profiles?.name||'Crack');const ini=nm.charAt(0).toUpperCase();const av=p.profiles?.avatar_url?`<img src="${esc(p.profiles.avatar_url)}">`:ini;const lk=p.likes.some(x=>x.user_id==me.id);return `<div class="post-card"><div class="post-top"><div class="post-avatar">${av}</div><div style="flex:1"><div class="post-name">${nm}</div><div class="post-meta">${fd(p.created_at)} · ${esc(p.sport||'')}</div></div><span class="streak-badge">🔥 ${p.profiles?.streak||0} días</span></div><p>${esc(p.body)}</p>${img(p.image_url)}<div class="post-stats"><span>🏃 ${+p.km} km</span><span>⏱️ ${p.minutes} min</span><span>⚡ ${(p.km>0&&p.minutes>0)?(p.minutes/p.km).toFixed(1)+' min/km':''}</span></div><div class="row"><button class=g onclick="like('${p.id}',${lk})">${lk?'❤️':'🤍'} ${p.likes.length}</button><button class=g onclick="cmt('${p.id}')">💬 ${p.comments.length}</button>${p.user_id==me.id||isAdmin?`<button class=g onclick="del('posts','${p.id}')">Borrar</button>`:''}</div>${p.comments.map(c=>`<small><b>${esc(c.profiles?.name)}:</b> ${esc(c.body)}</small><br>`).join('')}</div>`}).join('')||'<p class=m>Aún no hay entrenos. Publica el primero.</p>')}<button class=g onclick="go('feed')">Publicar / Ver todo →</button>
 <h2>🤝 Próximos encuentros</h2>${((ms||[]).map(m=>`<div class="card"><h3>${esc(m.title)}</h3><div class=m>${esc(m.place)} · ${fd(m.starts_at)} · por ${esc(m.profiles?.name||'')}</div><div class=m>Van ${m.meetup_going.length} cracks</div></div>`).join('')||'<p class=m>No hay encuentros programados.</p>')}<button class=g onclick="go('meet')">Ver encuentros →</button>
 <h2>🏆 Retos</h2>${((ch||[]).map(r=>`<div class="card">${img(r.cover_url)}<h3>${esc(r.title)}</h3><p>${esc(r.description)}</p><div class=m>Meta: ${+r.goal_km} km</div></div>`).join('')||'<p class=m>No hay retos activos.</p>')}<button class=g onclick="go('retos')">Ver retos →</button>
 <h2>🛍️ Merch / Tienda</h2><div class="home-grid">${((pr||[]).filter(r=>r.active!==false).map(r=>`<div class="home-card">${img(r.image_url)}<h3>${esc(r.name)}</h3><p>${esc(r.description)}</p><b>${esc(r.price)}</b></div>`).join('')||'<p class=m>Pronto más merch CRKS.</p>')}</div><br><button class=g onclick="go('tienda')">Ver tienda →</button></div>`;
};

V.feed=async()=>{
 const{data:ps}=await sb.from('posts').select('*,profiles(name),likes(user_id),comments(id,body,profiles(name))').order('created_at',{ascending:false}).limit(30);
 return`<div class=card><textarea id=pb rows=2 placeholder="¿Qué entrenaste hoy?"></textarea><div class=row><select id=ps><option>Running<option>Ciclismo<option>Trail<option>Fuerza<option>Natación<option>Otro</select><input id=pk type=number step=any placeholder="Km"><input id=pm type=number placeholder="Minutos"></div><input id=pf type=file accept="image/*"><button onclick="post()">Publicar entreno</button></div>`+
 ((ps||[]).map(p=>{const l=p.likes.some(x=>x.user_id==me.id);return`<div class=card><b>${esc(p.profiles?.name)}</b> <small>${fd(p.created_at)} · ${esc(p.sport||'')} · ${+p.km} km · ${p.minutes} min</small><p>${esc(p.body)}</p>${img(p.image_url)}<div class=row><button class=g onclick="like('${p.id}',${l})">${l?'❤️':'🤍'} ${p.likes.length}</button><button class=g onclick="cmt('${p.id}')">💬 ${p.comments.length}</button>${p.user_id==me.id||isAdmin?`<button class=g onclick="del('posts','${p.id}')">Borrar</button>`:''}</div>${p.comments.map(c=>`<small><b>${esc(c.profiles?.name)}:</b> ${esc(c.body)}</small><br>`).join('')}</div>`}).join('')||'<p class=m>Aún no hay entrenos. Publica el primero y empieza tu racha.</p>')};
async function post(){const body=$('#pb').value.trim();if(!body)return alert('Cuéntanos qué entrenaste');if(!me)return alert('Inicia sesión para publicar');const f=$('#pf').files[0];const image_url=await up(f);if(f&&!image_url)return;const{error}=await sb.from('posts').insert({user_id:me.id,body,sport:$('#ps').value,km:+$('#pk').value||0,minutes:+$('#pm').value||0,image_url});if(error)return alert(error.message);await loadMe();render()}
async function like(id,l){await(l?sb.from('likes').delete().match({post_id:id,user_id:me.id}):sb.from('likes').insert({post_id:id,user_id:me.id}));render()}
async function cmt(id){const body=prompt('Tu comentario');if(!body)return;await sb.from('comments').insert({post_id:id,user_id:me.id,body});render()}

V.rank=async()=>{
 const[{data:r},{data:p}]=await Promise.all([sb.from('monthly_ranking').select('*').order('km',{ascending:false}).limit(20),sb.from('profiles').select('id,name')]);
 const m=Object.fromEntries((p||[]).map(x=>[x.id,x.name]));
 return'<h2>Ranking del mes</h2>'+((r||[]).map((x,i)=>`<div class="card row"><b>${['🥇','🥈','🥉'][i]||i+1}</b><span style="flex:1">${esc(m[x.user_id])}</span><span>${+x.km} km · ${x.workouts} entrenos</span></div>`).join('')||'<p class=m>Nadie ha publicado este mes todavía.</p>')};

V.meet=async()=>{
 const{data:ms}=await sb.from('meetups').select('*,profiles(name),meetup_going(user_id)').order('starts_at');
 return`<div class=card><h3>Proponer encuentro</h3><input id=mt placeholder="Título (ej. Rodada del domingo)"><input id=mp placeholder="Lugar"><input id=md type=datetime-local><button onclick="mk()">Crear encuentro</button></div>`+
 ((ms||[]).map(m=>{const g=m.meetup_going.some(x=>x.user_id==me.id);return`<div class=card><h3>${esc(m.title)}</h3><div class=m>${esc(m.place)} · ${fd(m.starts_at)} · por ${esc(m.profiles?.name)}</div><div class=row><button class=${g?'g':''} onclick="going('${m.id}',${g})">${g?'Ya no voy':'Voy'} (${m.meetup_going.length})</button>${m.user_id==me.id||isAdmin?`<button class=g onclick="del('meetups','${m.id}')">Borrar</button>`:''}</div></div>`}).join('')||'<p class=m>No hay encuentros programados.</p>')};
async function mk(){const title=$('#mt').value.trim();if(!title)return alert('Pon un título');const d=$('#md').value;const{error}=await sb.from('meetups').insert({user_id:me.id,title,place:$('#mp').value,starts_at:d?new Date(d).toISOString():null});if(error)alert(error.message);render()}
async function going(id,g){await(g?sb.from('meetup_going').delete().match({meetup_id:id,user_id:me.id}):sb.from('meetup_going').insert({meetup_id:id,user_id:me.id}));render()}

const list=async(t,f,o)=>{const{data}=await sb.from(t).select('*').order(o,{ascending:false});return(data||[]).map(f).join('')||'<p class=m>Aún no hay nada publicado aquí.</p>'};
V.retos=()=>list('challenges',r=>`<div class=card>${img(r.cover_url)}<h3>${esc(r.title)}</h3><p>${esc(r.description)}</p><div class=m>Meta: ${+r.goal_km} km · ${r.starts_on||''} → ${r.ends_on||''}</div></div>`,'created_at').then(h=>'<h2>Retos</h2>'+h);
V.eventos=()=>list('events',r=>`<div class=card>${img(r.image_url)}<h3>${esc(r.title)}</h3><div class=m>${fd(r.starts_at)} · ${esc(r.place)}</div><p>${esc(r.description)}</p><b>${esc(r.price)}</b> <small>${esc(r.includes)}</small></div>`,'created_at').then(h=>'<h2>Eventos</h2>'+h);
V.tienda=()=>list('products',r=>r.active?`<div class=card>${img(r.image_url)}<h3>${esc(r.name)}</h3><p>${esc(r.description)}</p><b>${esc(r.price)}</b></div>`:'','sort').then(h=>'<h2>Tienda</h2>'+h);

V.perfil=async()=>{
 const{data:b}=await sb.from('user_badges').select('badges(name,emoji,description)').eq('user_id',me.id);const x=prof||{};
 return`<h2>Mi perfil</h2><div class=card>${img(x.avatar_url)}<label>Nombre<input id=fn value="${esc(x.name)}"></label><label>Deporte<input id=fs value="${esc(x.sport)}"></label><label>Nivel<input id=fl value="${esc(x.level)}"></label><label>Sobre mí<textarea id=fb rows=2>${esc(x.bio)}</textarea></label><label>Foto<input id=fa type=file accept="image/*"></label><button onclick="save()">Guardar cambios</button></div><div class=card><h3>Racha: ${x.streak||0} días <small>(récord ${x.best_streak||0})</small></h3><div class=row>${(b||[]).map(i=>`<span title="${esc(i.badges.description)}">${i.badges.emoji} ${esc(i.badges.name)}</span>`).join('')||'<span class=m>Publica un entreno para ganar tu primera insignia.</span>'}</div></div>`};
async function save(){const o={name:$('#fn').value,sport:$('#fs').value,level:$('#fl').value,bio:$('#fb').value,onboarded:true};const a=await up($('#fa').files[0]);if(a)o.avatar_url=a;const{error}=await sb.from('profiles').update(o).eq('id',me.id);if(error)alert(error.message);await loadMe();render()}

const F={challenges:['Retos',[['title','Título'],['description','Descripción'],['goal_km','Meta (km)','number'],['starts_on','Inicio','date'],['ends_on','Fin','date'],['cover_url','Portada','file']]],events:['Eventos',[['title','Título'],['starts_at','Fecha y hora','datetime-local'],['place','Lugar'],['description','Descripción'],['price','Precio'],['includes','Qué incluye'],['image_url','Imagen','file']]],products:['Productos',[['name','Nombre'],['description','Descripción'],['price','Precio'],['image_url','Imagen','file']]]};
V.admin=async()=>{let h='<h2>Panel de administrador</h2>';
 for(const t in F){const{data}=await sb.from(t).select('*').order('created_at',{ascending:false});
  h+=`<div class=card><h3>${F[t][0]}</h3>${F[t][1].map(([k,l,ty='text'])=>`<label>${l}<input id="${t}_${k}" type=${ty} ${ty=='file'?'accept="image/*"':''}></label>`).join('')}<button onclick="add('${t}')">Agregar</button>${(data||[]).map(r=>`<div class=row><span style="flex:1">${esc(r.title||r.name)}</span><button class=g onclick="del('${t}','${r.id}')">Borrar</button></div>`).join('')}</div>`}
 const[{data:u},{data:b}]=await Promise.all([sb.from('profiles').select('id,name'),sb.from('badges').select('id,name,emoji')]);
 return h+`<div class=card><h3>Otorgar insignia</h3><select id=bu>${(u||[]).map(x=>`<option value="${x.id}">${esc(x.name)}`).join('')}</select><select id=bb>${(b||[]).map(x=>`<option value="${x.id}">${x.emoji} ${esc(x.name)}`).join('')}</select><button onclick="award()">Otorgar</button></div>`};
async function add(t){const o={};for(const[k,,ty]of F[t][1]){const e=$(`#${t}_${k}`);if(ty=='file')o[k]=await up(e.files[0]);else if(e.value)o[k]=ty=='datetime-local'?new Date(e.value).toISOString():ty=='number'?+e.value:e.value}const{error}=await sb.from(t).insert(o);if(error)return alert(error.message);render()}
async function award(){const{error}=await sb.from('user_badges').insert({user_id:$('#bu').value,badge_id:+$('#bb').value});if(error)alert(error.message);else alert('Insignia otorgada')}
</script></body></html>

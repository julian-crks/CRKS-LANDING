<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRKS · Run Cracks Colombia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0a0a0a;--card:#151515;--ink:#ffffff;--g:#000000;--y:#A6FF00;--mut:#9aa39c}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--card:#151515;--ink:#ffffff;--g:#000000;--mut:#9aa39c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;margin:.2em 0;letter-spacing:.01em}h1{font-size:3rem}h2{font-size:1.8rem}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:#000;color:#fff;border-bottom:2px solid #A6FF00}header b{font:700 1.7rem 'Barlow Condensed',sans-serif;flex:1}
nav{display:flex;overflow-x:auto;background:#000;border-bottom:2px solid #A6FF00}nav a{padding:12px 16px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--mut)}nav a.on{color:var(--ink);box-shadow:inset 0 -4px var(--y)}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:#151515;border:1px solid #222;border-radius:12px;padding:14px;margin:0 0 12px;display:block;color:#fff}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,textarea,select{width:100%;padding:10px;margin:4px 0;border:1px solid #333;border-radius:8px;background:#111;color:#fff;font:inherit}
.row input,.row select{flex:1;min-width:90px}label{display:block;font-size:.85rem;color:var(--mut)}
button{padding:9px 14px;border:0;border-radius:4px;background:var(--y);color:#12261f;font:600 1rem Barlow,sans-serif;cursor:pointer}button.g{background:transparent;color:var(--ink);outline:1px solid var(--mut)}
header button{background:#fff3}small,.m{color:var(--mut)}img{max-width:100%;border-radius:4px;margin:6px 0}
.auth{max-width:380px;margin:12vh auto}:focus-visible{outline:3px solid var(--y);outline-offset:2px}

.publish-card{background:#000!important;color:#fff!important;border:2px solid #A6FF00!important;border-radius:16px!important;padding:18px!important}
.publish-card textarea,.publish-card input,.publish-card select{background:#111!important;color:#fff!important;border:1px solid #333!important;border-radius:10px!important}
.publish-card button{background:#A6FF00!important;color:#000!important;font-weight:800!important;border-radius:999px!important;padding:12px 20px!important;width:100%;font-size:1.05rem}
.publish-logo{font-family:'Barlow Condensed',Impact,sans-serif;font-size:2.6rem;font-weight:700;color:#A6FF00;text-align:center;line-height:1;margin:2px 0 8px;letter-spacing:.02em}
.publish-title{font-family:'Barlow Condensed',Impact,sans-serif;font-size:1.8rem;line-height:.95;text-align:center;margin:4px 0}
.publish-title span{color:#A6FF00}
.publish-sub{text-align:center;color:#aaa;font-size:.9rem;margin-bottom:12px}
.landing{background:#070807;color:#fff}
.l-hero{padding:28px 20px;max-width:900px}
.l-eyebrow{color:#A6FF00;letter-spacing:.28em;font-size:.9rem;font-weight:700}
.l-hero h1{font-size:clamp(3rem,10vw,6rem);line-height:.88;margin:12px 0}
.l-hero h1 .green{color:#A6FF00}
.l-hero p{color:#d6ddd8;max-width:560px}
.l-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.l-btn-primary{background:#A6FF00;color:#000;border:0;border-radius:999px;padding:12px 20px;font:700 1rem 'Barlow Condensed',sans-serif;cursor:pointer}
.l-btn-ghost{background:transparent;color:#fff;border:1.5px solid #fff;border-radius:999px;padding:11px 20px;font:700 1rem 'Barlow Condensed',sans-serif;cursor:pointer}
.l-ticker{background:#A6FF00;color:#000;overflow:hidden;white-space:nowrap;padding:9px 0;font-weight:700}
.home-sec{max-width:900px;margin:0 auto;padding:16px}
.post-card{background:var(--card);border-radius:12px;padding:14px;margin:0 0 14px}
.post-top{display:flex;gap:10px;align-items:center}
.post-avatar{width:44px;height:44px;border-radius:50%;background:#12261f;color:#A6FF00;display:flex;align-items:center;justify-content:center;font:700 1.2rem 'Barlow Condensed',sans-serif;flex-shrink:0;overflow:hidden}
.post-avatar img{width:100%;height:100%;object-fit:cover}
.streak-badge{background:#fff3cd;border:1px solid #f2b705;border-radius:999px;padding:2px 9px;font-size:.82rem;font-weight:700;white-space:nowrap}
.post-stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;font-weight:700}
.post-stats span{background:#222;padding:6px 10px;border-radius:999px;font-size:.9rem}
.miracha{background:#12261f;color:#fff;border-radius:12px;padding:14px;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.miracha b{color:#A6FF00;font-size:1.3rem}

.chat-box{background:var(--card);border-radius:12px;padding:14px;max-height:380px;overflow:auto;margin:10px 0}
.chat-msg{display:flex;gap:8px;margin:0 0 10px}
.chat-msg b{font-size:.9rem}
.rank-table{width:100%;border-collapse:collapse;font-size:.88rem}
.rank-table th,.rank-table td{padding:8px 6px;text-align:left;border-bottom:1px solid #333;color:#fff}
.rank-table th{background:#000;color:#A6FF00;border-bottom:2px solid #A6FF00}
.merch-title{font-size:2rem}
</style></head><body><div id="app"></div>

const sb=supabase.createClient(SB_URL,SB_KEY),$=s=>document.querySelector(s),V={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>d?new Date(d).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'}):'';
let me=null,prof=null,isAdmin=false,tab='home';
sb.auth.onAuthStateChange((_,s)=>{me=s?.user||null;setTimeout(async()=>{if(me)await loadMe();render()},0)});

async function getPosts(limit){
 try{
  let r=await sb.from('posts').select('*,profiles(name,streak,avatar_url),likes(user_id),comments(id,body,profiles(name,avatar_url))').order('created_at',{ascending:false}).limit(limit||20);
  if(!r.error && r.data) return r.data;
 }catch(e){}
 try{
  let r2=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(limit||20);
  let ps=r2.data||[];
  try{let pr=await sb.from('profiles').select('id,name,streak,avatar_url');let m={};(pr.data||[]).forEach(x=>{m[x.id]=x});ps=ps.map(x=>({...x,profiles:m[x.user_id]||null,likes:[],comments:[]}));}catch(e){}
  return ps;

function parseTiempo(txt){if(!txt)return 0;txt=String(txt).trim();if(!txt)return 0;if(/^[0-9]+(\.[0-9]+)?$/.test(txt))return +txt;let parts=txt.split(':').map(Number);if(parts.some(isNaN))return 0;if(parts.length==2)return parts[0]*60+parts[1];if(parts.length==3)return parts[0]*60+parts[1]+parts[2]/60;return 0}
function fmtDigital(min){min=Math.round(min||0);let h=Math.floor(min/60),m=min%60,s=0;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function fmtTiempo(min){return fmtDigital(min)}

V.perfil=async()=>{
 const{data:b}=await sb.from('user_badges').select('badges(name,emoji,description)').eq('user_id',me.id);const x=prof||{};
 return`<h2>Mi perfil</h2><div class="card" style="background:#000;color:#fff;border:2px solid #A6FF00"><div style="color:#A6FF00;font-weight:700">FRASE DE HOY</div><div style="font-size:1.2rem;font-weight:700">“${fraseHoy()}”</div><div style="margin-top:8px">🔥 Racha: ${prof?.streak||0} días · Récord: ${prof?.best_streak||0}</div></div><div class="card"><h3>🏅 Mis insignias</h3><div class=row>${(b||[]).map(i=>`<span title="${esc(i.badges.description)}">${i.badges.emoji} ${esc(i.badges.name)}</span>`).join('')||'<span class=m>Aún no tienes insignias. Completa un reto o publica tu primer entreno.</span>'}</div></div><div class=card>${img(x.avatar_url)}<label>Nombre<input id=fn value="${esc(x.name)}"></label><label>Deporte<input id=fs value="${esc(x.sport)}"></label><label>Nivel<input id=fl value="${esc(x.level)}"></label><label>Sobre mí<textarea id=fb rows=2>${esc(x.bio)}</textarea></label><label>Foto de perfil (se verá en tus entrenos y comentarios)<input id=fa type=file accept="image/*"></label><button onclick="save()">Guardar cambios</button></div><div class=card><h3>Racha: ${x.streak||0} días <small>(récord ${x.best_streak||0})</small></h3><div class=row>${(b||[]).map(i=>`<span title="${esc(i.badges.description)}">${i.badges.emoji} ${esc(i.badges.name)}</span>`).join('')||'<span class=m>Publica un entreno para ganar tu primera insignia.</span>'}</div></div>`};
async function save(){const o={name:$('#fn').value,sport:$('#fs').value,level:$('#fl').value,bio:$('#fb').value,onboarded:true};const a=await up($('#fa').files[0]);if(a)o.avatar_url=a;const{error}=await sb.from('profiles').update(o).eq('id',me.id);if(error)alert(error.message);await loadMe();render()}

const F={challenges:['Retos',[['title','Título'],['description','Descripción'],['goal_km','Meta (km)','number'],['starts_on','Inicio','date'],['ends_on','Fin','date'],['cover_url','Portada','file']]],events:['Eventos',[['title','Título'],['starts_at','Fecha y hora','datetime-local'],['place','Lugar'],['description','Descripción'],['price','Precio'],['includes','Qué incluye'],['image_url','Imagen','file']]],products:['Productos',[['name','Nombre'],['description','Descripción'],['price','Precio'],['image_url','Imagen','file']]]};
V.admin=async()=>{let h='<h2>Panel de administrador</h2>';
 for(const t in F){const{data}=await sb.from(t).select('*').order('created_at',{ascending:false});
  h+=`<div class=card><h3>${F[t][0]}</h3>${F[t][1].map(([k,l,ty='text'])=>`<label>${l}<input id="${t}_${k}" type=${ty} ${ty=='file'?'accept="image/*"':''}></label>`).join('')}<button onclick="add('${t}')">Agregar</button>${(data||[]).map(r=>`<div class=row><span style="flex:1">${esc(r.title||r.name)}</span><button class=g onclick="del('${t}','${r.id}')">Borrar</button></div>`).join('')}</div>`}
 const[{data:u},{data:b}]=await Promise.all([sb.from('profiles').select('id,name'),sb.from('badges').select('id,name,emoji')]);
 return h+`<div class=card><h3>Otorgar insignia</h3><select id=bu>${(u||[]).map(x=>`<option value="${x.id}">${esc(x.name)}`).join('')}</select><select id=bb>${(b||[]).map(x=>`<option value="${x.id}">${x.emoji} ${esc(x.name)}`).join('')}</select><button onclick="award()">Otorgar</button></div>`};
async function add(t){const o={};for(const[k,,ty]of F[t][1]){const e=$(`#${t}_${k}`);if(ty=='file')o[k]=await up(e.files[0]);else if(e.value)o[k]=ty=='datetime-local'?new Date(e.value).toISOString():ty=='number'?+e.value:e.value}const{error}=await sb.from(t).insert(o);if(error)return alert(error.message);render()}
async function award(){const{error}=await sb.from('user_badges').insert({user_id:$('#bu').value,badge_id:+$('#bb').value});if(error)alert(error.message);else alert('Insignia otorgada')}
</script></body></html>
